<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RANK UP — motion prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040C12; --cy:#42E8F5; --cyb:#8AF9FF; --cym:#207D8B;
  --tx:#E6FCFF; --txm:#78A7AE; --mag:#F234A9; --amb:#FFB83E;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#08090b;font-family:Rajdhani,sans-serif;display:grid;place-items:center;padding:14px}

.device{width:min(400px,100%);height:min(820px,94vh);position:relative;overflow:hidden;
  background:var(--bg);color:var(--tx)}
.scene{position:absolute;inset:0;
  background:radial-gradient(70% 40% at 50% 0%,rgba(66,232,245,.10),transparent 65%),
             radial-gradient(100% 60% at 50% 105%,rgba(66,232,245,.06),transparent 70%),var(--bg)}
.scene::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(66,232,245,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(66,232,245,.05) 1px,transparent 1px);background-size:34px 34px;
  -webkit-mask:radial-gradient(90% 60% at 50% 40%,#000,transparent 75%);
  mask:radial-gradient(90% 60% at 50% 40%,#000,transparent 75%)}
/* drifting motes — the scene is never fully still */
.mote{position:absolute;border-radius:50%;background:var(--cy);pointer-events:none;
  animation:drift linear infinite}
@keyframes drift{from{transform:translateY(0);opacity:0}
  12%{opacity:.5} 88%{opacity:.5} to{transform:translateY(-560px);opacity:0}}

.ui{position:relative;height:100%;display:flex;flex-direction:column;padding:18px 15px 0}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* ══ HUD ══ */
.hud{display:flex;align-items:flex-end;gap:11px}
.ab{font-size:9px;letter-spacing:.42em;color:var(--cym);font-weight:600;line-height:1}
.hud .lv{font-size:33px;font-weight:600;line-height:.88;font-variant-numeric:tabular-nums}
.hud .nm{font-size:17px;letter-spacing:.16em;font-weight:500;line-height:1.1}
.hud .rk{font-size:30px;font-weight:700;line-height:.88;color:var(--amb);
  text-shadow:0 0 18px rgba(255,184,62,.5)}
.gauges{margin-top:9px}
.g{display:flex;align-items:center;gap:9px;margin-top:4px}
.g u{text-decoration:none;font-size:9.5px;letter-spacing:.22em;color:var(--cym);width:30px;font-weight:600}
.g .track{flex:1;height:4px;background:rgba(66,232,245,.1);position:relative;overflow:hidden}
.g .track i{position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,var(--cym),var(--cy));box-shadow:0 0 8px rgba(66,232,245,.8);
  transition:width 1.1s var(--ease)}
.g .track i.a{background:linear-gradient(90deg,#9a6a10,var(--amb));box-shadow:0 0 8px rgba(255,184,62,.7)}
.g em{font-style:normal;font-size:11px;color:var(--txm);width:36px;text-align:right;
  font-variant-numeric:tabular-nums}

/* ══ the pane, and its opening sequence ══ */
.pane{position:relative;margin-top:15px;
  background:rgba(7,25,35,.82);border:1px solid rgba(66,232,245,.75);
  box-shadow:0 0 5px rgba(0,220,255,.30),inset 0 0 12px rgba(0,190,255,.05);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pane.m{border-color:rgba(242,52,169,.7);box-shadow:0 0 5px rgba(242,52,169,.3)}
/* 1. a line draws across before the glass exists */
.pane::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:100%;
  background:linear-gradient(90deg,transparent,var(--cyb),transparent);
  transform:scaleX(0);transform-origin:left;box-shadow:0 0 10px var(--cy)}
.anim .pane{animation:paneIn .34s var(--ease) both}
.anim .pane::before{animation:lineDraw .5s var(--ease) both}
@keyframes lineDraw{0%{transform:scaleX(0);opacity:1}
  36%{transform:scaleX(1);opacity:1} 100%{transform:scaleX(1);opacity:0}}
@keyframes paneIn{0%{opacity:0;clip-path:inset(0 0 100% 0)}
  32%{opacity:0;clip-path:inset(0 0 100% 0)}
  100%{opacity:1;clip-path:inset(0 0 0 0)}}
/* 2. a sweep passes through the glass once */
.pane::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(138,249,255,.16),transparent);
  opacity:0}
.anim .pane::after{animation:sweep .7s .18s ease-out both}
@keyframes sweep{0%{opacity:0;transform:translateY(-100%)}
  30%{opacity:1} 100%{opacity:0;transform:translateY(100%)}}

.ph-hd{display:flex;align-items:center;gap:8px;padding:7px 11px;
  background:rgba(66,232,245,.13);border-bottom:1px solid rgba(66,232,245,.45)}
.ph-hd.m{background:rgba(242,52,169,.18);border-bottom-color:rgba(242,52,169,.55)}
.ph-hd span{font-size:12.5px;letter-spacing:.28em;font-weight:600;color:var(--cyb)}
.ph-hd.m span{color:#FFC7E8}
.ph-hd em{margin-left:auto;font-style:normal;font-size:11.5px;letter-spacing:.14em;color:var(--txm)}
.pbody{padding:13px 12px}

/* 3. text arrives staggered, after the glass */
.anim .stg>*{animation:txIn .34s var(--ease) both}
@keyframes txIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.anim .stg>*:nth-child(1){animation-delay:.30s}
.anim .stg>*:nth-child(2){animation-delay:.34s}
.anim .stg>*:nth-child(3){animation-delay:.38s}
.anim .stg>*:nth-child(4){animation-delay:.42s}
.anim .stg>*:nth-child(5){animation-delay:.46s}
.anim .stg>*:nth-child(6){animation-delay:.50s}

.big{display:flex;align-items:baseline;gap:10px}
.big b{font-size:74px;line-height:.86;font-weight:600;font-variant-numeric:tabular-nums}
.big span{font-size:14px;letter-spacing:.3em;color:var(--cy);font-weight:600}
.note{font-size:13.5px;color:var(--txm);margin-top:3px}

.req{margin-top:12px;border-top:1px solid rgba(66,232,245,.22)}
.req .r{display:flex;align-items:center;gap:9px;padding:7px 0;
  border-bottom:1px solid rgba(66,232,245,.1);font-size:13.5px}
.req .r:last-child{border-bottom:0}
.req .r i{width:0;height:0;border-left:6px solid var(--cym);border-top:4px solid transparent;
  border-bottom:4px solid transparent;flex:0 0 6px}
.req .r.ok i{border-left-color:var(--cy);filter:drop-shadow(0 0 5px var(--cy))}
.req .r em{margin-left:auto;font-style:normal;color:var(--txm);font-weight:600;
  font-variant-numeric:tabular-nums}
.req .r.ok em{color:var(--cy)}
.req .r.lock em{color:var(--mag);font-size:10.5px;letter-spacing:.18em}

/* parameters */
.params{display:grid;grid-template-columns:1fr 1px 1fr;column-gap:15px;margin-top:3px}
.params .rule{background:rgba(66,232,245,.25)}
.pa{padding:8px 0;border-bottom:1px solid rgba(66,232,245,.1);display:flex;align-items:center;gap:7px}
.pa:last-child{border-bottom:0}
.pa .t{flex:1;min-width:0}
.pa .lb{font-size:12px;letter-spacing:.09em;font-weight:500}
.pa b{font-size:25px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.pa b.a{color:var(--amb)}
.pa .d{font-size:11px;color:var(--cy);font-weight:600}

.today{margin-top:auto;padding-top:16px}
.today b{display:block;font-size:38px;font-weight:600;letter-spacing:.08em;line-height:1.05;
  margin-top:2px;text-shadow:0 0 24px rgba(66,232,245,.35)}
.btn{margin-top:13px;padding:16px;text-align:center;font-size:15.5px;letter-spacing:.34em;
  font-weight:600;color:#02222b;border:0;width:100%;font-family:inherit;cursor:pointer;
  background:linear-gradient(180deg,var(--cyb),#2fc4d6);
  box-shadow:0 0 22px rgba(66,232,245,.45),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .12s var(--ease),box-shadow .2s;position:relative;overflow:hidden}
.btn:active{transform:translateY(2px);box-shadow:0 0 34px rgba(66,232,245,.9)}
.btn::after{content:"";position:absolute;inset:0;background:#fff;opacity:0}
.btn.flash::after{animation:bflash .3s ease-out}
@keyframes bflash{from{opacity:.85}to{opacity:0}}

/* ══ nav — text rows, cyan marker, no icons ══ */
.nav{display:flex;padding:11px 0 calc(11px + env(safe-area-inset-bottom));margin-top:12px;
  border-top:1px solid rgba(66,232,245,.18)}
.nav button{flex:1;background:none;border:0;font-family:inherit;cursor:pointer;
  font-size:11.5px;letter-spacing:.2em;color:var(--cym);font-weight:600;position:relative;
  padding:4px 0;transition:color .22s}
.nav button.on{color:var(--cyb);text-shadow:0 0 12px rgba(66,232,245,.9)}
.nav button::before{content:"▸";position:absolute;left:2px;opacity:0;color:var(--cy);
  transform:translateX(-4px);transition:opacity .22s,transform .22s var(--ease)}
.nav button.on::before{opacity:1;transform:translateX(0)}

/* ══ level-up overlay ══ */
.lvup{position:absolute;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none;
  background:rgba(4,12,18,.72);opacity:0;visibility:hidden}
.lvup.go{opacity:1;visibility:visible;animation:lvfade 2.6s forwards}
@keyframes lvfade{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0;visibility:hidden}}
.lvup .card{text-align:center;padding:26px 40px;background:rgba(7,25,35,.9);
  border:1px solid var(--cy);box-shadow:0 0 50px rgba(66,232,245,.55)}
.lvup .card .t{font-size:13px;letter-spacing:.44em;color:var(--cy)}
.lvup .card .n{font-size:58px;font-weight:700;margin-top:6px;color:var(--amb);
  text-shadow:0 0 34px rgba(255,184,62,.8);font-variant-numeric:tabular-nums}
.lvup.go .card{animation:glitch .5s steps(2) 2}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-2px,1px)}
  50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(0)}}
.flashline{position:absolute;left:0;right:0;height:2px;background:var(--cyb);
  box-shadow:0 0 20px var(--cy);opacity:0}
.lvup.go .flashline{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:1;top:0}100%{opacity:0;top:100%}}

.hint{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:9px;
  letter-spacing:.24em;color:#20404a;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body>
<div class="device">
  <div class="scene" id="scene"></div>
  <div class="ui">
    <div class="hud">
      <div><div class="ab">L V</div><div class="lv" id="lv">24</div></div>
      <div style="flex:1"><div class="ab">H U N T E R</div><div class="nm">FONZO</div></div>
      <div style="text-align:right"><div class="ab" style="letter-spacing:.3em">R A N K</div>
        <div class="rk">D</div></div>
    </div>
    <div class="gauges">
      <div class="g"><u>BODY</u><div class="track"><i data-w="86"></i></div><em>86%</em></div>
      <div class="g"><u>STM</u><div class="track"><i data-w="61"></i></div><em>61%</em></div>
      <div class="g"><u>EXP</u><div class="track"><i class="a" data-w="73"></i></div><em id="xpv">73%</em></div>
    </div>

    <div class="screen anim" id="screen"></div>

    <nav class="nav" id="nav">
      <button class="on" data-t="today">TODAY</button>
      <button data-t="status">STATUS</button>
      <button data-t="skills">SKILLS</button>
      <button data-t="record">RECORD</button>
    </nav>
  </div>
  <div class="lvup" id="lvup"><div class="flashline"></div>
    <div class="card"><div class="t">RANK UP</div><div class="n">D &nbsp;→&nbsp; C</div></div></div>
  <div class="hint">TAP TABS · TAP BEGIN</div>
</div>

<script>
/* drifting motes, three depths */
(function(){
  const s=document.getElementById('scene');
  for(let i=0;i<22;i++){
    const m=document.createElement('i');m.className='mote';
    const z=Math.random();
    m.style.width=m.style.height=(1+z*2.4).toFixed(1)+'px';
    m.style.left=(Math.random()*100)+'%';
    m.style.top=(60+Math.random()*60)+'%';
    m.style.opacity=.2+z*.4;
    m.style.animationDuration=(9+Math.random()*13)+'s';
    m.style.animationDelay=(-Math.random()*18)+'s';
    s.appendChild(m);
  }
})();

const SCREENS={
 today:`
  <div class="pane">
    <div class="ph-hd"><span>RANK UP</span><em>D → C</em></div>
    <div class="pbody stg">
      <div class="ab">R E M A I N I N G</div>
      <div class="big"><b data-count="9">0</b><span>SESSIONS</span></div>
      <div class="note">Three weeks at five days a week.</div>
      <div class="req">
        <div class="r ok"><i></i><span>Sessions cleared</span><em>31 / 40</em></div>
        <div class="r ok"><i></i><span>Weeks unbroken</span><em>6 / 6</em></div>
        <div class="r lock"><i></i><span>Full push-up</span><em>LOCKED</em></div>
      </div>
    </div>
  </div>
  <div class="today stg"><div class="ab">T O D A Y</div><b>LEG DAY</b></div>
  <button class="btn" id="begin">BEGIN</button>`,

 status:`
  <div class="pane m">
    <div class="ph-hd m"><span>TITLE</span><em>EARNED · DAY 84</em></div>
    <div class="pbody stg" style="padding:10px 12px">
      <div style="font-size:19px;letter-spacing:.14em;color:#FFC7E8;font-weight:600">THE UNYIELDING</div>
    </div>
  </div>
  <div class="pane">
    <div class="ph-hd"><span>PARAMETERS</span><em>LV 24</em></div>
    <div class="pbody stg">
      <div class="params">
        <div>
          <div class="pa"><div class="t"><div class="ab">S T R</div><div class="lb">STRENGTH</div></div><div class="d">+2</div><b data-count="31">0</b></div>
          <div class="pa"><div class="t"><div class="ab">A G I</div><div class="lb">AGILITY</div></div><b data-count="24">0</b></div>
          <div class="pa"><div class="t"><div class="ab">M O B</div><div class="lb">MOBILITY</div></div><b data-count="19">0</b></div>
        </div>
        <div class="rule"></div>
        <div>
          <div class="pa"><div class="t"><div class="ab">E N D</div><div class="lb">ENDURANCE</div></div><b data-count="27">0</b></div>
          <div class="pa"><div class="t"><div class="ab">S T M</div><div class="lb">STAMINA</div></div><b class="a" data-count="35">0</b></div>
          <div class="pa"><div class="t"><div class="ab">R E C</div><div class="lb">RECOVERY</div></div><b data-count="29">0</b></div>
        </div>
      </div>
    </div>
  </div>
  <div class="pane">
    <div class="ph-hd"><span>TOTAL TRAINING</span></div>
    <div class="pbody stg">
      <div class="req" style="margin-top:0;border-top:0">
        <div class="r"><i></i><span>Sessions</span><em>127</em></div>
        <div class="r"><i></i><span>Active days</span><em>84</em></div>
        <div class="r"><i></i><span>Current streak</span><em>12</em></div>
      </div>
    </div>
  </div>`,

 skills:`
  <div class="pane">
    <div class="ph-hd"><span>SKILLS</span><em>126 / 155</em></div>
    <div class="pbody stg">
      <div class="req" style="margin-top:0;border-top:0">
        <div class="r ok"><i></i><span>Goblet squat</span><em>3 × 10</em></div>
        <div class="r ok"><i></i><span>Romanian deadlift</span><em>3 × 8</em></div>
        <div class="r ok"><i></i><span>Walking lunge</span><em>3 × 12</em></div>
        <div class="r lock"><i></i><span>Barbell back squat</span><em>C-RANK</em></div>
        <div class="r lock"><i></i><span>Power clean</span><em>B-RANK</em></div>
      </div>
    </div>
  </div>`,

 record:`
  <div class="pane">
    <div class="ph-hd"><span>RECORD</span><em>LAST 10 WEEKS</em></div>
    <div class="pbody stg">
      <div class="ab">S E S S I O N S</div>
      <div class="big"><b data-count="127">0</b><span>TOTAL</span></div>
      <div class="req">
        <div class="r ok"><i></i><span>Push-ups</span><em>42</em></div>
        <div class="r ok"><i></i><span>Squats</span><em>55</em></div>
        <div class="r ok"><i></i><span>Plank</span><em>95s</em></div>
      </div>
    </div>
  </div>`
};

const screen=document.getElementById('screen');

/* numbers count up rather than appearing — the brief's "numbers are objects" */
function countUp(){
  screen.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count, t0=performance.now(), dur=620;
    (function step(now){
      const p=Math.min(1,(now-t0)/dur);
      el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
      if(p<1)requestAnimationFrame(step);
    })(t0);
  });
}
function paint(k){
  screen.classList.remove('anim');
  screen.innerHTML=SCREENS[k];
  void screen.offsetWidth;            // restart the entrance
  screen.classList.add('anim');
  setTimeout(countUp,300);
  const b=document.getElementById('begin');
  if(b)b.onclick=()=>{b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),320);rankUp()};
}
document.getElementById('nav').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  paint(b.dataset.t);
};
/* gauges fill on load */
function fillGauges(){
  document.querySelectorAll('.track i').forEach(i=>{
    i.style.width='0%';
    setTimeout(()=>{i.style.width=i.dataset.w+'%'},120);
  });
}
/* the rank-up beat: edge flash, glitch, gold number */
function rankUp(){
  const o=document.getElementById('lvup');
  o.classList.remove('go'); void o.offsetWidth; o.classList.add('go');
  const xp=document.querySelector('.track i.a');
  xp.style.width='100%';
  setTimeout(()=>{
    document.getElementById('lv').textContent='25';
    document.querySelector('.rk').textContent='C';
    xp.style.width='6%';
    document.getElementById('xpv').textContent='6%';
  },1300);
}
paint('today');
fillGauges();
</script>
</body></html>
