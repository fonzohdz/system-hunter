<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>RANK UP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040C12;--cy:#42E8F5;--cyb:#8AF9FF;--cym:#207D8B;--tx:#E6FCFF;--txm:#78A7AE;
 --mag:#F234A9;--amb:#FFB83E;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html{height:100%}
body{background:var(--bg);font-family:Rajdhani,sans-serif;min-height:100vh;min-height:100dvh;
  overscroll-behavior:none;display:flex;align-items:center;justify-content:center}
.device{position:relative;overflow:hidden;background:var(--bg);color:var(--tx);
  width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column}
@media(min-width:560px){body{background:#08090b}
  .device{width:430px;height:min(920px,96dvh);box-shadow:0 0 0 1px #1b2b33,0 30px 80px -30px #000}}
.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}
 30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}100%{transform:none}}

#bgfx,#fgfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bgfx{z-index:1}#fgfx{z-index:31}
.scene{position:absolute;inset:0;z-index:0;
  background:radial-gradient(70% 38% at 50% 0%,rgba(66,232,245,.11),transparent 64%),
   radial-gradient(110% 55% at 50% 104%,rgba(66,232,245,.07),transparent 70%),var(--bg)}
.scene::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(66,232,245,.05) 1px,transparent 1px),
   linear-gradient(90deg,rgba(66,232,245,.05) 1px,transparent 1px);background-size:34px 34px;
  -webkit-mask:radial-gradient(92% 58% at 50% 38%,#000,transparent 76%);
  mask:radial-gradient(92% 58% at 50% 38%,#000,transparent 76%)}
.scan{position:absolute;left:0;right:0;height:140px;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(66,232,245,.05),transparent);
  animation:scan 7s linear infinite}
@keyframes scan{from{top:-150px}to{top:100%}}

.ui{position:relative;z-index:10;flex:1;min-height:0;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0
   calc(14px + env(safe-area-inset-left))}
.screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow-y:auto;
  overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

.ab{font-size:9px;letter-spacing:.42em;color:var(--cym);font-weight:600;line-height:1}
.hud{display:flex;align-items:flex-end;gap:11px}
.hud .lv{font-size:clamp(27px,8vw,34px);font-weight:600;line-height:.88;font-variant-numeric:tabular-nums}
.hud .nm{font-size:clamp(15px,4.4vw,18px);letter-spacing:.16em;font-weight:500;line-height:1.1}
.hud .rk{font-size:clamp(26px,8vw,34px);font-weight:700;line-height:.88;color:var(--amb);
  text-shadow:0 0 20px rgba(255,184,62,.65)}
.gauges{margin-top:9px}
.g{display:flex;align-items:center;gap:9px;margin-top:4px}
.g u{text-decoration:none;font-size:9.5px;letter-spacing:.22em;color:var(--cym);width:30px;font-weight:600}
.g .track{flex:1;height:5px;background:rgba(66,232,245,.09);position:relative;overflow:hidden}
/* segment ticks — a gauge, not a progress bar */
.g .track::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(4,12,18,.9) 11px 13px)}
.g .track i{position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,var(--cym),var(--cy));box-shadow:0 0 9px rgba(66,232,245,.9);
  transition:width 1.1s var(--ease)}
.g .track i.a{background:linear-gradient(90deg,#9a6a10,var(--amb));box-shadow:0 0 9px rgba(255,184,62,.8)}
.g em{font-style:normal;font-size:11px;color:var(--txm);width:36px;text-align:right;
  font-variant-numeric:tabular-nums}

.pane{position:relative;margin-top:13px;background:rgba(7,25,35,.82);
  border:1px solid rgba(66,232,245,.72);
  box-shadow:0 0 5px rgba(0,220,255,.3),inset 0 0 12px rgba(0,190,255,.05);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* corner ticks — small, four of them, the detail that reads as engineered */
.pane .ct{position:absolute;width:9px;height:9px;border:1px solid var(--cyb);opacity:.9}
.pane .ct.tl{top:-1px;left:-1px;border-right:0;border-bottom:0}
.pane .ct.tr{top:-1px;right:-1px;border-left:0;border-bottom:0}
.pane .ct.bl{bottom:-1px;left:-1px;border-right:0;border-top:0}
.pane .ct.br{bottom:-1px;right:-1px;border-left:0;border-top:0}
.pane .sid{position:absolute;right:7px;bottom:4px;font-size:8px;letter-spacing:.2em;
  color:rgba(66,232,245,.28)}
.pane::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:100%;
  background:linear-gradient(90deg,transparent,var(--cyb),transparent);
  transform:scaleX(0);transform-origin:left;box-shadow:0 0 10px var(--cy)}
.anim .pane{animation:paneIn .34s var(--ease) both,flick 13s steps(1) 1.4s infinite}
.anim .pane::before{animation:lineDraw .5s var(--ease) both}
@keyframes lineDraw{0%{transform:scaleX(0);opacity:1}36%{transform:scaleX(1);opacity:1}
 100%{transform:scaleX(1);opacity:0}}
@keyframes paneIn{0%{opacity:0;clip-path:inset(0 0 100% 0)}32%{opacity:0;clip-path:inset(0 0 100% 0)}
 100%{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes flick{0%,97.4%,100%{opacity:1}97.6%{opacity:.7}97.8%{opacity:1}98%{opacity:.86}98.2%{opacity:1}}
.pane::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(138,249,255,.16),transparent);opacity:0}
.anim .pane::after{animation:sweep .7s .18s ease-out both}
@keyframes sweep{0%{opacity:0;transform:translateY(-100%)}30%{opacity:1}
 100%{opacity:0;transform:translateY(100%)}}

.ph-hd{display:flex;align-items:center;gap:8px;padding:7px 11px;
  background:rgba(66,232,245,.13);border-bottom:1px solid rgba(66,232,245,.45)}
.ph-hd.m{background:rgba(242,52,169,.18);border-bottom-color:rgba(242,52,169,.55)}
.ph-hd span{font-size:12.5px;letter-spacing:.28em;font-weight:600;color:var(--cyb)}
.ph-hd.m span{color:#FFC7E8}
.ph-hd em{margin-left:auto;font-style:normal;font-size:11.5px;letter-spacing:.14em;color:var(--txm)}
.pbody{padding:13px 12px}
.anim .stg>*{animation:txIn .34s var(--ease) both}
@keyframes txIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.anim .stg>*:nth-child(1){animation-delay:.30s}.anim .stg>*:nth-child(2){animation-delay:.34s}
.anim .stg>*:nth-child(3){animation-delay:.38s}.anim .stg>*:nth-child(4){animation-delay:.42s}
.anim .stg>*:nth-child(5){animation-delay:.46s}.anim .stg>*:nth-child(6){animation-delay:.50s}

.big{display:flex;align-items:baseline;gap:10px}
.big b{font-size:clamp(56px,17vw,78px);line-height:.86;font-weight:600;font-variant-numeric:tabular-nums}
.big span{font-size:14px;letter-spacing:.3em;color:var(--cy);font-weight:600}
.note{font-size:13.5px;color:var(--txm);margin-top:3px}
.req{margin-top:12px;border-top:1px solid rgba(66,232,245,.22)}
.req .r{display:flex;align-items:center;gap:9px;padding:9px 6px 9px 0;
  border-bottom:1px solid rgba(66,232,245,.1);font-size:13.5px;cursor:pointer;
  transition:background .18s,padding-left .18s var(--ease)}
.req .r:last-child{border-bottom:0}
.req .r:active{background:rgba(66,232,245,.12);padding-left:6px}
.req .r i{width:0;height:0;border-left:6px solid var(--cym);border-top:4px solid transparent;
  border-bottom:4px solid transparent;flex:0 0 6px}
.req .r.ok i{border-left-color:var(--cy);filter:drop-shadow(0 0 5px var(--cy))}
.req .r em{margin-left:auto;font-style:normal;color:var(--txm);font-weight:600;
  font-variant-numeric:tabular-nums}
.req .r.ok em{color:var(--cy)}
.req .r.lock em{color:var(--mag);font-size:10.5px;letter-spacing:.18em}
.params{display:grid;grid-template-columns:1fr 1px 1fr;column-gap:15px;margin-top:3px}
.params .rule{background:rgba(66,232,245,.25)}
.pa{padding:8px 0;border-bottom:1px solid rgba(66,232,245,.1);display:flex;align-items:center;gap:7px}
.pa:last-child{border-bottom:0}
.pa .t{flex:1;min-width:0}.pa .lb{font-size:12px;letter-spacing:.09em;font-weight:500}
.pa b{font-size:clamp(21px,6vw,26px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.pa b.a{color:var(--amb)}.pa .d{font-size:11px;color:var(--cy);font-weight:600}

.today{margin-top:auto;padding-top:14px}
.today b{display:block;font-size:clamp(30px,9vw,40px);font-weight:600;letter-spacing:.08em;
  line-height:1.05;margin-top:2px;text-shadow:0 0 24px rgba(66,232,245,.35)}
.btn{margin-top:11px;padding:clamp(14px,4vw,17px);text-align:center;
  font-size:clamp(14px,4vw,16px);letter-spacing:.34em;font-weight:600;color:#02222b;border:0;
  width:100%;font-family:inherit;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--cyb),#2fc4d6);
  box-shadow:0 0 22px rgba(66,232,245,.45),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .1s var(--ease),box-shadow .2s}
/* a highlight sweeps the primary action every few seconds */
.btn::after{content:"";position:absolute;top:0;bottom:0;width:60px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:gleam 3.6s ease-in-out infinite}
@keyframes gleam{0%,68%{left:-70px}84%,100%{left:112%}}
.btn:active{transform:translateY(2px) scale(.985);box-shadow:0 0 44px rgba(66,232,245,1)}
.btn.ghost{background:none;color:var(--txm);border:1px solid rgba(66,232,245,.3);
  box-shadow:none;font-size:12.5px;letter-spacing:.22em;margin-top:8px}
.btn.ghost::after{display:none}

.nav{display:flex;padding:9px 0 calc(9px + env(safe-area-inset-bottom));margin-top:9px;
  border-top:1px solid rgba(66,232,245,.18)}
.nav button{flex:1;background:none;border:0;font-family:inherit;cursor:pointer;font-size:11.5px;
  letter-spacing:.2em;color:var(--cym);font-weight:600;position:relative;padding:5px 0;
  transition:color .22s}
.nav button.on{color:var(--cyb);text-shadow:0 0 12px rgba(66,232,245,.9)}
.nav button::before{content:"▸";position:absolute;left:2px;opacity:0;color:var(--cy);
  transform:translateX(-4px);transition:opacity .22s,transform .22s var(--ease)}
.nav button.on::before{opacity:1;transform:translateX(0)}

/* ═══ rank-up takeover — a full-screen event, not a box ═══ */
.rk-ov{position:absolute;inset:0;z-index:34;display:none;pointer-events:none;overflow:hidden}
.rk-ov.go{display:block}
.rk-dim{position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 42%,
  rgba(4,20,30,.55),rgba(2,6,10,.94));opacity:0;animation:dimIn 2.9s forwards}
@keyframes dimIn{0%{opacity:0}9%{opacity:1}84%{opacity:1}100%{opacity:0}}
/* light rays from the centre */
.rk-rays{position:absolute;left:50%;top:42%;width:760px;height:760px;
  transform:translate(-50%,-50%) scale(.2);opacity:0;
  background:conic-gradient(from 0deg,transparent 0 6deg,rgba(138,249,255,.16) 7deg,
   transparent 8deg 22deg,rgba(138,249,255,.12) 23deg,transparent 24deg 40deg,
   rgba(255,184,62,.12) 41deg,transparent 42deg 62deg,rgba(138,249,255,.14) 63deg,transparent 64deg 90deg);
  animation:rays 2.9s cubic-bezier(.1,.8,.2,1) forwards;
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);
  mask:radial-gradient(circle,#000 8%,transparent 62%)}
@keyframes rays{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}
 14%{opacity:1}72%{opacity:.7}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(46deg)}}
/* a column of light behind the letter */
.rk-col{position:absolute;left:50%;top:0;bottom:0;width:190px;transform:translateX(-50%) scaleY(0);
  transform-origin:center;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(138,249,255,.2),rgba(255,255,255,.28),
   rgba(138,249,255,.2),transparent);
  animation:col 2.9s cubic-bezier(.1,.9,.2,1) forwards}
@keyframes col{0%{opacity:0;transform:translateX(-50%) scaleY(0)}
 8%{opacity:1;transform:translateX(-50%) scaleY(1)}70%{opacity:.5}100%{opacity:0}}
.rk-stage{position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);text-align:center}
.rk-kick{font-size:12px;letter-spacing:.58em;color:var(--cy);opacity:0;
  animation:kick 2.9s forwards;text-shadow:0 0 18px var(--cy)}
@keyframes kick{0%,10%{opacity:0;letter-spacing:.2em}22%{opacity:1;letter-spacing:.58em}
 84%{opacity:1}100%{opacity:0}}
.rk-letters{display:flex;align-items:center;justify-content:center;gap:clamp(14px,6vw,34px);
  margin-top:8px}
.rk-old,.rk-new{font-size:clamp(76px,26vw,124px);font-weight:700;line-height:1}
.rk-old{color:#4a6d7a;opacity:0;animation:oldOut 2.9s forwards}
@keyframes oldOut{0%{opacity:0;transform:scale(1)}10%{opacity:1}
 26%{opacity:1;transform:scale(1)}40%{opacity:0;transform:scale(.6) translateX(-24px);filter:blur(6px)}
 100%{opacity:0}}
.rk-arrow{width:clamp(30px,9vw,54px);height:2px;background:var(--cy);position:relative;opacity:0;
  animation:arw 2.9s forwards;box-shadow:0 0 12px var(--cy)}
.rk-arrow::after{content:"";position:absolute;right:-1px;top:-5px;width:0;height:0;
  border-left:10px solid var(--cy);border-top:6px solid transparent;border-bottom:6px solid transparent}
@keyframes arw{0%,12%{opacity:0;transform:translateX(-14px)}24%{opacity:1;transform:none}
 40%{opacity:1}56%{opacity:0}100%{opacity:0}}
.rk-new{color:var(--amb);opacity:0;text-shadow:0 0 44px rgba(255,184,62,1),0 0 90px rgba(255,184,62,.6);
  animation:newIn 2.9s forwards}
@keyframes newIn{0%,34%{opacity:0;transform:scale(2.6);filter:blur(12px)}
 44%{opacity:1;transform:scale(1);filter:blur(0)}
 46%{transform:scale(1) translate(-4px,2px)}48%{transform:scale(1) translate(4px,-2px)}
 50%{transform:scale(1)}86%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
.rk-sub{margin-top:10px;font-size:13px;letter-spacing:.28em;color:var(--txm);opacity:0;
  animation:subIn 2.9s forwards}
@keyframes subIn{0%,46%{opacity:0}56%{opacity:1}84%{opacity:1}100%{opacity:0}}
.rk-flash{position:absolute;inset:0;background:#DFFAFF;opacity:0;animation:fla 2.9s forwards}
@keyframes fla{0%,32%{opacity:0}35%{opacity:.92}46%{opacity:0}100%{opacity:0}}
.rk-ring{position:absolute;left:50%;top:42%;width:14px;height:14px;border-radius:50%;
  border:2px solid var(--cyb);transform:translate(-50%,-50%) scale(0);opacity:0}
.rk-ring.r1{animation:rr 2.9s cubic-bezier(.1,.7,.3,1) forwards}
.rk-ring.r2{animation:rr 2.9s .1s cubic-bezier(.1,.7,.3,1) forwards;border-color:var(--amb)}
.rk-ring.r3{animation:rr 2.9s .2s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes rr{0%,32%{opacity:0;transform:translate(-50%,-50%) scale(0)}
 35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(52)}}

.snd{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(4px + env(safe-area-inset-bottom));z-index:40;background:none;border:0;
  cursor:pointer;font-family:inherit;font-size:9.5px;letter-spacing:.18em;color:#1d3c46;
  font-weight:600;padding:5px 10px}
.snd.on{color:var(--cy);text-shadow:0 0 10px var(--cy)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-height:700px){.gauges{margin-top:6px}.g{margin-top:3px}.pane{margin-top:9px}
 .pbody{padding:10px 11px}.today{padding-top:9px}.btn{margin-top:8px}.nav{padding-top:7px;margin-top:7px}}
</style></head>
<body>
<div class="device" id="dev">
  <div class="scene"></div>
  <canvas id="bgfx"></canvas>
  <div class="scan"></div>
  <canvas id="fgfx"></canvas>

  <div class="rk-ov" id="rkov">
    <div class="rk-dim"></div><div class="rk-col"></div><div class="rk-rays"></div>
    <div class="rk-ring r1"></div><div class="rk-ring r2"></div><div class="rk-ring r3"></div>
    <div class="rk-stage">
      <div class="rk-kick">RANK UP</div>
      <div class="rk-letters">
        <span class="rk-old" id="rkOld">D</span>
        <span class="rk-arrow"></span>
        <span class="rk-new" id="rkNew">C</span>
      </div>
      <div class="rk-sub" id="rkSub">NEW SKILLS UNLOCKED</div>
    </div>
    <div class="rk-flash"></div>
  </div>

  <div class="ui">
    <div class="hud">
      <div><div class="ab">L V</div><div class="lv" id="lv">24</div></div>
      <div style="flex:1"><div class="ab">H U N T E R</div><div class="nm">FONZO</div></div>
      <div style="text-align:right"><div class="ab" style="letter-spacing:.3em">R A N K</div>
        <div class="rk" id="rk">D</div></div>
    </div>
    <div class="gauges">
      <div class="g"><u>BODY</u><div class="track"><i data-w="86"></i></div><em>86%</em></div>
      <div class="g"><u>STM</u><div class="track"><i data-w="61"></i></div><em>61%</em></div>
      <div class="g"><u>EXP</u><div class="track"><i class="a" id="xpbar" data-w="73"></i></div><em id="xpv">73%</em></div>
    </div>
    <div class="screen anim" id="screen"></div>
    <nav class="nav" id="nav">
      <button class="on" data-t="today">TODAY</button><button data-t="status">STATUS</button>
      <button data-t="skills">SKILLS</button><button data-t="record">RECORD</button>
    </nav>
  </div>
  <button class="snd" id="snd">♪ SOUND OFF</button>
</div>

<script>
/* ═══════════ STATE — one source of truth, so nothing on screen can contradict ═══════════ */
const ORDER=['E','D','C','B','A','S'];
const S={lv:24,rank:'D',xp:73,done:31,need:40,weeks:6,weeksNeed:6};
const nextRank=()=>ORDER[Math.min(ORDER.length-1,ORDER.indexOf(S.rank)+1)];
const remaining=()=>Math.max(0,S.need-S.done);

/* ═══════════ SOUND — layered, with a real tail ═══════════ */
const SFX=(()=>{
  let ctx=null,on=false,verb=null,bus=null;
  function boot(){
    if(ctx)return;
    try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    /* a short generated impulse: without a tail every UI blip sounds like a beep
       from a 1998 website */
    const len=Math.floor(ctx.sampleRate*1.1),b=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);
      for(let i=0;i<len;i++){const t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,3.2)*.5}}
    verb=ctx.createConvolver();verb.buffer=b;
    const wet=ctx.createGain();wet.gain.value=.34;
    bus=ctx.createGain();bus.gain.value=.9;
    bus.connect(ctx.destination);bus.connect(verb);verb.connect(wet);wet.connect(ctx.destination);
  }
  const t=()=>ctx.currentTime;
  function osc(f,type,a,d,peak,slide,detune){
    if(!ctx||!on)return;
    const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t());
    if(detune)o.detune.value=detune;
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t()+a+d);
    const g=ctx.createGain();g.gain.setValueAtTime(.0001,t());
    g.gain.exponentialRampToValueAtTime(peak,t()+a);
    g.gain.exponentialRampToValueAtTime(.0001,t()+a+d);
    o.connect(g);g.connect(bus);o.start();o.stop(t()+a+d+.03);
  }
  /* the attack transient — what makes a sound feel like a click, not a tone */
  function tick(dur,peak,f0,f1,q){
    if(!ctx||!on)return;
    const n=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.4);
    const s=ctx.createBufferSource();s.buffer=buf;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=q||2.2;
    bp.frequency.setValueAtTime(f0,t());bp.frequency.exponentialRampToValueAtTime(f1,t()+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(peak,t());
    g.gain.exponentialRampToValueAtTime(.0001,t()+dur);
    s.connect(bp);bp.connect(g);g.connect(bus);s.start();
  }
  return{
    boot,toggle(){boot();on=!on;if(on)this.open();return on},get on(){return on},
    /* every sound is a transient + a body, two oscillators detuned apart */
    nav(){tick(.035,.28,2600,900,3);osc(880,'triangle',.005,.14,.05);osc(1320,'sine',.005,.10,.03,null,8)},
    row(){tick(.025,.2,3200,1400,3);osc(1460,'triangle',.004,.07,.035)},
    deny(){tick(.05,.24,900,220,1.6);osc(196,'sawtooth',.006,.22,.06,132);osc(198,'sawtooth',.006,.22,.05,133,-14)},
    open(){tick(.3,.16,300,4200,1.1);osc(320,'sine',.02,.36,.045,700);osc(480,'sine',.02,.3,.03,1050,6)},
    confirm(){
      tick(.05,.3,1800,4200,2);
      osc(392,'triangle',.006,.2,.09,523);osc(394,'triangle',.006,.2,.07,525,-10);
      setTimeout(()=>{osc(659,'sine',.006,.3,.07,784);osc(661,'sine',.006,.3,.05,786,9)},80);
    },
    rank(){
      if(!ctx||!on)return;
      /* sub hit, rising sweep, then a spread major chord with a shimmer on top */
      osc(55,'sine',.01,1.5,.28,38);
      osc(180,'sawtooth',.4,.5,.08,1600);
      tick(1.1,.16,260,7000,.8);
      [[261.6,0],[329.6,110],[392,210],[523.3,310],[659.3,410],[784,520]].forEach(([f,ms])=>
        setTimeout(()=>{osc(f,'triangle',.012,1.5,.075);osc(f*2,'sine',.012,1.1,.03,null,7)},ms));
      setTimeout(()=>tick(.9,.1,4000,12000,.9),330);
    }
  };
})();

/* ═══════════ PARTICLES ═══════════ */
const FX=(()=>{
  const bg=document.getElementById('bgfx'),fg=document.getElementById('fgfx');
  const bx=bg.getContext('2d'),fx=fg.getContext('2d');
  let W=0,H=0,dpr=1;const amb=[],parts=[],rings=[];
  function size(){
    const r=document.getElementById('dev').getBoundingClientRect();
    dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;
    [bg,fg].forEach(c=>{c.width=W*dpr;c.height=H*dpr});
    bx.setTransform(dpr,0,0,dpr,0,0);fx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',size);
  addEventListener('orientationchange',()=>setTimeout(size,220));
  if(window.visualViewport)visualViewport.addEventListener('resize',size);
  for(let i=0;i<50;i++)amb.push({x:Math.random(),y:Math.random(),z:Math.random(),
    ph:Math.random()*6.3,streak:Math.random()<.18});
  function burst(x,y,n,o){
    o=o||{};
    for(let i=0;i<n;i++){
      const a=o.dir!==undefined?o.dir+(Math.random()-.5)*(o.spread||6.3):Math.random()*6.3;
      const s=(o.speed||2.6)*(.3+Math.random());
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.lift||0),life:1,
        dec:.012+Math.random()*.022,r:o.r||(.8+Math.random()*2),
        c:o.c||'#8AF9FF',g:o.g===undefined?.045:o.g});
    }
    if(parts.length>760)parts.splice(0,parts.length-760);
  }
  /* particles pulled INWARD, used to charge the rank-up before it detonates */
  function implode(x,y,n,c){
    for(let i=0;i<n;i++){
      const a=Math.random()*6.3,d=90+Math.random()*190;
      parts.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,
        vx:-Math.cos(a)*(d/34),vy:-Math.sin(a)*(d/34),
        life:1,dec:.026,r:1+Math.random()*1.8,c:c||'#8AF9FF',g:0});
    }
  }
  function ring(x,y,c){rings.push({x,y,r:4,life:1,c:c||'#8AF9FF'})}
  function edge(el){
    const d=document.getElementById('dev').getBoundingClientRect(),r=el.getBoundingClientRect();
    const y=r.top-d.top,x0=r.left-d.left,x1=x0+r.width;let t=0;
    const iv=setInterval(()=>{t+=.12;if(t>1){clearInterval(iv);return}
      burst(x0+(x1-x0)*t,y,2,{speed:.8,r:1.1,g:.012})},16);
  }
  function loop(){
    bx.clearRect(0,0,W,H);
    for(const m of amb){
      m.y-=(0.00016+m.z*0.00042);
      if(m.y<-.03){m.y=1.03;m.x=Math.random()}
      const x=(m.x+Math.sin(performance.now()/5200+m.ph)*.01)*W,y=m.y*H;
      bx.globalAlpha=.10+m.z*.34;bx.fillStyle=m.z>.8?'#8AF9FF':'#42E8F5';
      if(m.streak)bx.fillRect(x,y,1,6+m.z*10);
      else{bx.beginPath();bx.arc(x,y,.5+m.z*1.9,0,6.3);bx.fill()}
    }
    bx.globalAlpha=1;
    fx.clearRect(0,0,W,H);
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.985;p.vy*=.985;p.life-=p.dec;
      if(p.life<=0){parts.splice(i,1);continue}
      fx.globalAlpha=Math.max(0,p.life);fx.fillStyle=p.c;
      fx.beginPath();fx.arc(p.x,p.y,p.r*p.life,0,6.3);fx.fill();
    }
    for(let i=rings.length-1;i>=0;i--){
      const r=rings[i];r.r+=7;r.life-=.028;
      if(r.life<=0){rings.splice(i,1);continue}
      fx.globalAlpha=Math.max(0,r.life)*.8;fx.strokeStyle=r.c;fx.lineWidth=2*r.life;
      fx.beginPath();fx.arc(r.x,r.y,r.r,0,6.3);fx.stroke();
    }
    fx.globalAlpha=1;requestAnimationFrame(loop);
  }
  size();if(!location.search.includes('still'))requestAnimationFrame(loop);
  return{burst,implode,ring,edge,size};
})();

/* ═══════════ SCREENS — rendered FROM state ═══════════ */
const PANE=(hd,right,body,cls,sid)=>`
  <div class="pane ${cls||''}">
    <i class="ct tl"></i><i class="ct tr"></i><i class="ct bl"></i><i class="ct br"></i>
    <div class="ph-hd ${cls||''}"><span>${hd}</span><em>${right||''}</em></div>
    <div class="pbody stg">${body}</div>
    <span class="sid">${sid||'SYS.0X2F'}</span>
  </div>`;

const SCREENS={
 today:()=>PANE('RANK UP',S.rank+' → '+nextRank(),`
    <div class="ab">R E M A I N I N G</div>
    <div class="big"><b data-count="${remaining()}">0</b><span>SESSIONS</span></div>
    <div class="note">About ${Math.max(1,Math.ceil(remaining()/5))} week${remaining()>5?'s':''} at five days a week.</div>
    <div class="req">
      <div class="r ${S.done>=S.need?'ok':''}"><i></i><span>Sessions cleared</span><em>${S.done} / ${S.need}</em></div>
      <div class="r ${S.weeks>=S.weeksNeed?'ok':''}"><i></i><span>Weeks unbroken</span><em>${S.weeks} / ${S.weeksNeed}</em></div>
      <div class="r lock"><i></i><span>Full push-up</span><em>LOCKED</em></div>
    </div>`)
  +`<div class="today stg"><div class="ab">T O D A Y</div><b>LEG DAY</b></div>
    <button class="btn" data-act="begin">BEGIN</button>
    <button class="btn ghost" data-act="rank">▸ DEMO A RANK UP</button>`,

 status:()=>PANE('TITLE','EARNED · DAY 84',
    `<div style="font-size:19px;letter-spacing:.14em;color:#FFC7E8;font-weight:600">THE UNYIELDING</div>`,'m','SYS.0X11')
  +PANE('PARAMETERS','LV '+S.lv,`
    <div class="params">
      <div>
        <div class="pa"><div class="t"><div class="ab">S T R</div><div class="lb">STRENGTH</div></div><div class="d">+2</div><b data-count="31">0</b></div>
        <div class="pa"><div class="t"><div class="ab">A G I</div><div class="lb">AGILITY</div></div><b data-count="24">0</b></div>
        <div class="pa"><div class="t"><div class="ab">M O B</div><div class="lb">MOBILITY</div></div><b data-count="19">0</b></div>
      </div><div class="rule"></div>
      <div>
        <div class="pa"><div class="t"><div class="ab">E N D</div><div class="lb">ENDURANCE</div></div><b data-count="27">0</b></div>
        <div class="pa"><div class="t"><div class="ab">S T M</div><div class="lb">STAMINA</div></div><b class="a" data-count="35">0</b></div>
        <div class="pa"><div class="t"><div class="ab">R E C</div><div class="lb">RECOVERY</div></div><b data-count="29">0</b></div>
      </div>
    </div>`,'','SYS.0X07')
  +PANE('TOTAL TRAINING','',`
    <div class="req" style="margin-top:0;border-top:0">
      <div class="r"><i></i><span>Sessions</span><em>${S.done+96}</em></div>
      <div class="r"><i></i><span>Active days</span><em>84</em></div>
      <div class="r"><i></i><span>Current streak</span><em>12</em></div>
    </div>`,'','SYS.0X1C'),

 skills:()=>PANE('SKILLS','126 / 155',`
    <div class="req" style="margin-top:0;border-top:0">
      <div class="r ok"><i></i><span>Goblet squat</span><em>3 × 10</em></div>
      <div class="r ok"><i></i><span>Romanian deadlift</span><em>3 × 8</em></div>
      <div class="r ok"><i></i><span>Walking lunge</span><em>3 × 12</em></div>
      <div class="r ok"><i></i><span>Leg press</span><em>3 × 12</em></div>
      <div class="r ${ORDER.indexOf(S.rank)>=2?'ok':'lock'}"><i></i><span>Barbell back squat</span><em>${ORDER.indexOf(S.rank)>=2?'3 × 5':'C-RANK'}</em></div>
      <div class="r ${ORDER.indexOf(S.rank)>=3?'ok':'lock'}"><i></i><span>Power clean</span><em>${ORDER.indexOf(S.rank)>=3?'5 × 3':'B-RANK'}</em></div>
    </div>`,'','SYS.0X44'),

 record:()=>PANE('RECORD','LAST 10 WEEKS',`
    <div class="ab">S E S S I O N S</div>
    <div class="big"><b data-count="${S.done+96}">0</b><span>TOTAL</span></div>
    <div class="req">
      <div class="r ok"><i></i><span>Push-ups</span><em>42</em></div>
      <div class="r ok"><i></i><span>Squats</span><em>55</em></div>
      <div class="r ok"><i></i><span>Plank</span><em>95s</em></div>
    </div>`,'','SYS.0X58')
};

const screen=document.getElementById('screen'),dev=document.getElementById('dev');
let tab='today';
function countUp(){
  screen.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,t0=performance.now(),dur=640;
    (function step(now){const p=Math.min(1,(now-t0)/dur);
      el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
      if(p<1)requestAnimationFrame(step)})(t0);
  });
}
function paint(k){
  tab=k||tab;
  screen.classList.remove('anim');screen.innerHTML=SCREENS[tab]();
  void screen.offsetWidth;screen.classList.add('anim');
  setTimeout(countUp,300);
  setTimeout(()=>screen.querySelectorAll('.pane').forEach(p=>FX.edge(p)),40);
}
function syncHud(){
  document.getElementById('lv').textContent=S.lv;
  document.getElementById('rk').textContent=S.rank;
  document.getElementById('xpbar').style.width=S.xp+'%';
  document.getElementById('xpv').textContent=S.xp+'%';
}

/* ── taps burst where your FINGER is, not at the element's centre ── */
function pt(e){
  const r=dev.getBoundingClientRect();
  const s=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  return{x:(s.clientX||0)-r.left,y:(s.clientY||0)-r.top};
}
dev.addEventListener('pointerdown',e=>{
  SFX.boot();
  const p=pt(e);
  const row=e.target.closest('.req .r');
  if(row){
    if(row.classList.contains('lock')){SFX.deny();FX.burst(p.x,p.y,12,{c:'#F234A9',speed:1.7})}
    else{SFX.row();FX.burst(p.x,p.y,16,{c:'#8AF9FF',speed:1.9})}
    return;
  }
  const b=e.target.closest('[data-act]');
  if(b){
    if(b.dataset.act==='begin'){SFX.confirm();FX.ring(p.x,p.y);FX.burst(p.x,p.y,46,{speed:3.6,lift:1})}
    else rankUp();
    return;
  }
  const t=e.target.closest('.nav button');
  if(t){
    [...t.parentNode.children].forEach(x=>x.classList.toggle('on',x===t));
    SFX.nav();FX.burst(p.x,p.y,18,{speed:2.1,dir:-Math.PI/2,spread:1.7});
    paint(t.dataset.t);SFX.open();
  }
});
document.getElementById('snd').addEventListener('pointerdown',e=>{
  e.stopPropagation();
  const on=SFX.toggle(),b=document.getElementById('snd');
  b.textContent=on?'♪ SOUND ON':'♪ SOUND OFF';b.classList.toggle('on',on);
});

/* ═══════════ THE RANK-UP ═══════════ */
let busy=false;
function rankUp(){
  if(busy)return; busy=true;
  const from=S.rank,to=nextRank();
  document.getElementById('rkOld').textContent=from;
  document.getElementById('rkNew').textContent=to;
  document.getElementById('rkSub').textContent=
    to==='C'?'BARBELL WORK UNLOCKED':to==='B'?'POWER CLEAN UNLOCKED':'NEW SKILLS UNLOCKED';
  const ov=document.getElementById('rkov');
  ov.classList.remove('go');void ov.offsetWidth;ov.classList.add('go');
  SFX.rank();
  const r=dev.getBoundingClientRect(),cx=r.width/2,cy=r.height*.42;
  /* charge — particles pulled in — then the detonation */
  FX.implode(cx,cy,90);
  setTimeout(()=>{
    dev.classList.add('shake');
    FX.burst(cx,cy,230,{speed:7,r:2.5,g:.07});
    setTimeout(()=>FX.burst(cx,cy,110,{speed:3.4,c:'#FFB83E',r:2.1,g:.05}),140);
    setTimeout(()=>dev.classList.remove('shake'),420);
  },930);
  /* state actually advances, so nothing on screen can contradict it */
  setTimeout(()=>{
    S.rank=to;S.lv+=1;S.xp=6;S.done=0;S.need=S.need+8;S.weeks=0;
    syncHud();paint();
  },1280);
  setTimeout(()=>{ov.classList.remove('go');busy=false},2950);
}

paint('today');syncHud();
document.querySelectorAll('.track i').forEach(i=>{
  i.style.width='0%';setTimeout(()=>{i.style.width=(i.dataset.w||S.xp)+'%'},150);
});
</script>
