<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>System Hunter — RPG Workout</title>
<meta name="description" content="A gamer's workout app. Daily quests, levels, ranks, and 73 movements from wall push-ups to power cleans.">
<meta name="theme-color" content="#0A0818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="System Hunter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="System Hunter">
<meta property="og:description" content="Arise. Daily quests, levels, and 73 workouts from beginner to elite.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230A0818'/><text x='50' y='72' font-size='68' font-family='Arial' font-weight='bold' fill='%235BE9E4' text-anchor='middle'>E</text></svg>">
<style>
html{background:#0A0818}
body{margin:0;padding:0;background:#0A0818;overscroll-behavior-y:none;min-height:100vh;min-height:100dvh}
</style>
</head>
<body>
<div id="root"><div class="boot">Waking the System<span class="dots"></span></div></div>

<style>
  :root{
    --void:#0A0818; --deep:#120E2E; --panel:#181341; --edge:#2E2668;
    --arc:#5BE9E4; --mana:#9B7BFF; --gold:#F2B84B; --blood:#FF4D6D;
    --ink:#EAE6FF; --mute:#8D86BE;
    --display:"Arial Narrow","Haettenschweiler",Impact,"Franklin Gothic Medium",sans-serif;
    --body:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #root{font-family:var(--body);color:var(--ink);
    background:radial-gradient(120% 60% at 50% -10%,#241a5c 0%,transparent 60%),
      radial-gradient(80% 40% at 100% 100%,#10203f 0%,transparent 60%),var(--void);
    min-height:100vh;
    padding-top:calc(14px + env(safe-area-inset-top));
    padding-right:calc(12px + env(safe-area-inset-right));
    padding-bottom:calc(92px + env(safe-area-inset-bottom));
    padding-left:calc(12px + env(safe-area-inset-left));
    max-width:760px;margin:0 auto;overflow-x:hidden}
  .boot{padding:80px 20px;text-align:center;color:var(--arc);letter-spacing:.18em;font-size:13px}
  .dots::after{content:"";animation:dots 1.2s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  .win{position:relative;background:linear-gradient(180deg,rgba(24,19,65,.92),rgba(14,11,40,.92));
    border:1px solid var(--edge);border-radius:2px;padding:14px;margin-bottom:12px;
    box-shadow:0 0 0 1px rgba(91,233,228,.07),0 14px 40px -22px #000}
  .win::before,.win::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--arc);opacity:.75}
  .win::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .win::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
  .win-title{font-family:var(--display);font-size:19px;letter-spacing:.14em;color:var(--arc);margin:0 0 10px;font-weight:700}
  .win-title small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.02em;color:var(--mute);font-weight:400;margin-top:3px}

  .hunter{display:flex;gap:14px;align-items:center}
  .rankbadge{width:64px;height:64px;flex:0 0 64px;display:grid;place-items:center;
    font-family:var(--display);font-size:34px;font-weight:700;color:var(--void);
    background:conic-gradient(from 210deg,var(--arc),var(--mana),var(--arc));
    clip-path:polygon(50% 0,100% 26%,100% 74%,50% 100%,0 74%,0 26%)}
  .hname{font-family:var(--display);font-size:26px;letter-spacing:.06em;line-height:1;margin:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .htitle{color:var(--gold);font-size:12px;margin:4px 0 8px;letter-spacing:.04em}
  .bar{height:7px;background:#0C0926;border:1px solid var(--edge);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mana),var(--arc));transition:width .5s cubic-bezier(.2,.9,.2,1)}
  .barlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:5px}
  .barlab b{color:var(--ink);font-weight:600}
  .purse{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .chip{border:1px solid var(--edge);padding:6px 10px;font-size:12px;display:flex;gap:6px;align-items:center;background:rgba(10,8,24,.6)}
  .chip.g b{color:var(--gold)} .chip.s b{color:var(--blood)}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
  .stat{text-align:center;border-top:1px solid var(--edge);padding-top:7px}
  .stat u{display:block;font-size:10px;color:var(--mute);text-decoration:none;letter-spacing:.1em}
  .stat b{display:block;font-size:20px;font-family:var(--display);letter-spacing:.04em}

  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
    background:linear-gradient(180deg,rgba(10,8,24,.6),var(--void) 40%);
    border-top:1px solid var(--edge);backdrop-filter:blur(8px);
    padding:6px calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));max-width:760px;margin:0 auto}
  .tabs button{flex:1;background:none;border:0;color:var(--mute);font-family:var(--display);
    font-size:14px;letter-spacing:.1em;padding:10px 2px;cursor:pointer;position:relative}
  .tabs button.on{color:var(--arc)}
  .tabs button.on::after{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--arc)}

  .qrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(46,38,104,.8);cursor:pointer}
  .qrow:last-of-type{border-bottom:0}
  .qfig{width:58px;height:58px;flex:0 0 58px;background:rgba(10,8,24,.7);border:1px solid var(--edge)}
  .qmeta{flex:1;min-width:0}
  .qmeta h4{margin:0;font-size:15px;font-weight:600}
  .qmeta p{margin:3px 0 0;font-size:12px;color:var(--mute)}
  .qcheck{width:30px;height:30px;flex:0 0 30px;border:1px solid var(--edge);display:grid;place-items:center;color:transparent;font-size:16px;background:rgba(10,8,24,.6)}
  .qrow.done .qcheck{background:var(--arc);color:var(--void);border-color:var(--arc)}
  .qrow.done .qmeta h4{color:var(--mute);text-decoration:line-through}
  .qdone-banner{text-align:center;padding:14px;border:1px solid var(--arc);color:var(--arc);
    font-family:var(--display);letter-spacing:.14em;font-size:17px;margin-top:10px;background:rgba(91,233,228,.06)}
  .warn{font-size:12px;color:var(--mute);margin:10px 0 0;line-height:1.55}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .filters button{background:rgba(10,8,24,.6);border:1px solid var(--edge);color:var(--mute);
    font-size:12px;padding:6px 11px;cursor:pointer;font-family:var(--body)}
  .filters button.on{border-color:var(--arc);color:var(--arc);background:rgba(91,233,228,.08)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{border:1px solid var(--edge);background:linear-gradient(180deg,rgba(24,19,65,.8),rgba(12,9,32,.9));
    padding:8px;cursor:pointer;position:relative;text-align:left;color:inherit;font:inherit}
  .card.locked{opacity:.4}
  .card svg{width:100%;display:block;background:radial-gradient(60% 60% at 50% 45%,rgba(155,123,255,.14),transparent 70%)}
  .card h4{margin:6px 0 0;font-size:13px;font-weight:600;line-height:1.25}
  .card p{margin:3px 0 0;font-size:11px;color:var(--mute)}
  .rk{position:absolute;top:6px;right:6px;font-family:var(--display);font-size:13px;width:20px;height:20px;display:grid;place-items:center;border:1px solid currentColor}
  .rk-E{color:#7EE0A0}.rk-D{color:var(--arc)}.rk-C{color:var(--mana)}.rk-B{color:var(--gold)}.rk-A{color:var(--blood)}
  .gear{position:absolute;top:6px;left:6px;font-size:9px;letter-spacing:.06em;color:var(--gold);border:1px solid rgba(242,184,75,.5);padding:1px 4px}

  .veil{position:fixed;inset:0;background:rgba(5,4,14,.82);z-index:60;display:grid;place-items:end center}
  .sheet{width:100%;max-width:760px;max-height:92vh;overflow-y:auto;background:var(--deep);
    border-top:1px solid var(--arc);padding:16px calc(14px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));animation:rise .22s ease-out}
  @keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .sheet h2{font-family:var(--display);font-size:27px;margin:0;letter-spacing:.05em}
  .sheet .sub{color:var(--mute);font-size:12px;margin:5px 0 14px}
  .demo{background:radial-gradient(70% 70% at 50% 45%,rgba(155,123,255,.16),transparent 70%);border:1px solid var(--edge);margin-bottom:14px}
  .demo svg{width:100%;display:block}
  .cues{list-style:none;padding:0;margin:0 0 14px}
  .cues li{padding:7px 0 7px 22px;position:relative;font-size:14px;line-height:1.45;border-bottom:1px solid rgba(46,38,104,.5)}
  .cues li::before{content:"";position:absolute;left:4px;top:14px;width:6px;height:6px;background:var(--arc);transform:rotate(45deg)}
  .btn{width:100%;padding:14px;background:linear-gradient(90deg,var(--mana),var(--arc));border:0;color:#0A0818;
    font-family:var(--display);font-size:18px;letter-spacing:.12em;cursor:pointer}
  .btn.ghost{background:none;border:1px solid var(--edge);color:var(--mute);margin-top:8px;font-size:15px}
  .btn:disabled{filter:grayscale(1);opacity:.5;cursor:default}

  .item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(46,38,104,.6)}
  .item:last-child{border-bottom:0}
  .item .ico{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border:1px solid var(--edge);font-size:19px}
  .item h4{margin:0;font-size:14px}
  .item p{margin:3px 0 0;font-size:12px;color:var(--mute);line-height:1.4}
  .buy{border:1px solid var(--gold);background:none;color:var(--gold);padding:7px 11px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:var(--body)}
  .buy:disabled{opacity:.35;cursor:default}
  .buy.owned{border-color:var(--edge);color:var(--mute)}
  .buy.warnbtn{border-color:var(--blood);color:var(--blood)}

  .pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(46,38,104,.6)}
  .prin{width:66px;background:#0C0926;border:1px solid var(--edge);color:var(--ink);padding:8px;text-align:center;font:inherit}

  /* onboarding */
  .ob{max-width:520px;margin:0 auto;padding-top:22px}
  .ob .step{font-size:11px;color:var(--mute);letter-spacing:.16em;margin-bottom:10px}
  .ob h2{font-family:var(--display);font-size:30px;letter-spacing:.04em;margin:0 0 6px;line-height:1.1}
  .ob p.lead{color:var(--mute);font-size:13px;line-height:1.6;margin:0 0 18px}
  .opts{display:grid;gap:8px;margin-bottom:16px}
  .opt{text-align:left;background:rgba(10,8,24,.6);border:1px solid var(--edge);color:var(--ink);
    padding:13px 14px;font:inherit;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .opt.on{border-color:var(--arc);background:rgba(91,233,228,.09)}
  .opt small{display:block;color:var(--mute);font-size:12px;margin-top:3px;line-height:1.4}
  .opt .tick{color:var(--arc);font-size:15px;opacity:0}
  .opt.on .tick{opacity:1}
  .namein{width:100%;background:#0C0926;border:1px solid var(--edge);color:var(--ink);padding:14px;font:inherit;font-size:17px;margin-bottom:16px}
  .namein:focus{outline:none;border-color:var(--arc)}

  /* system message intro */
  .sysmsg{position:fixed;inset:0;z-index:95;background:rgba(4,3,12,.94);display:grid;place-items:center;padding:22px;
    font-family:var(--body);color:var(--ink)}
  .sysbox{width:100%;max-width:420px;border:1px solid var(--arc);background:linear-gradient(180deg,rgba(24,19,65,.96),rgba(10,8,26,.96));
    padding:26px 22px;position:relative;box-shadow:0 0 60px -18px var(--arc)}
  .sysbox::before,.sysbox::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--arc)}
  .sysbox::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
  .sysbox::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
  .syshead{font-family:var(--display);letter-spacing:.28em;font-size:13px;color:var(--arc);text-align:center;margin-bottom:20px}
  .sysline{font-size:16px;line-height:1.6;margin:0 0 12px;color:var(--ink);opacity:0;transform:translateY(6px);animation:lineIn .45s forwards}
  .sysline.big{font-family:var(--display);font-size:24px;letter-spacing:.05em;color:var(--arc);line-height:1.25}
  @keyframes lineIn{to{opacity:1;transform:none}}
  .sysbtns{margin-top:22px;opacity:0;animation:lineIn .4s forwards}

  /* guided tour */
  .tourblock{position:fixed;inset:0;z-index:99}
  .spot{position:fixed;z-index:100;border:2px solid var(--arc);pointer-events:none;
    box-shadow:0 0 0 9999px rgba(4,3,12,.86),0 0 22px -2px var(--arc);
    transition:top .3s cubic-bezier(.3,.8,.3,1),left .3s cubic-bezier(.3,.8,.3,1),width .3s,height .3s}
  .tip{position:fixed;z-index:101;width:min(330px,calc(100vw - 28px));background:var(--panel);
    border:1px solid var(--arc);padding:14px 15px;transition:top .3s,left .3s}
  .tip h4{margin:0 0 6px;font-family:var(--display);font-size:19px;letter-spacing:.08em;color:var(--arc)}
  .tip p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink)}
  .tiprow{display:flex;align-items:center;gap:10px;margin-top:14px}
  .tiprow .dots2{flex:1;display:flex;gap:4px}
  .tiprow .dots2 i{width:5px;height:5px;background:var(--edge);border-radius:50%}
  .tiprow .dots2 i.on{background:var(--arc)}
  .tip button{border:1px solid var(--edge);background:none;color:var(--mute);padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
  .tip button.go{border-color:var(--arc);color:var(--void);background:var(--arc);font-weight:600}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:80;background:var(--panel);
    border:1px solid var(--arc);color:var(--arc);padding:11px 16px;font-size:13px;letter-spacing:.05em;
    pointer-events:none;animation:pop .3s ease-out;max-width:90%;text-align:center}
  @keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .lvlup{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(5,4,14,.8);
    font-family:var(--display);text-align:center;animation:pop .3s;padding:20px}
  .lvlup div{font-size:44px;color:var(--arc);letter-spacing:.2em;line-height:1.2}
  .lvlup p{font-family:var(--body);color:var(--ink);font-size:14px;letter-spacing:.02em;max-width:340px;margin:10px auto 0;line-height:1.5}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

<script>
/* =========================================================
   THE SYSTEM — universal build
   Pose = 22 numbers: head,neck,hip,[backElbow,hand,knee,foot],[frontElbow,hand,knee,foot]
   idx: 0/1 head 2/3 neck 4/5 hip 6/7 bE 8/9 bH 10/11 bK 12/13 bF 14/15 fE 16/17 fH 18/19 fK 20/21 fF
   ========================================================= */
const P=(...n)=>n;
const m=(base,ed)=>{const a=base.slice();for(const k in ed)a[k]=ed[k];return a};
const ST = P(50,14, 50,24, 50,52, 45,37, 44,50, 46,70, 46,88, 55,37, 56,50, 54,70, 54,88);
const SQ = P(48,28, 49,38, 52,64, 56,46, 66,40, 40,70, 44,88, 58,48, 68,42, 62,70, 58,88);
const PLK_UP = P(22,42, 30,45, 60,50, 28,56, 26,72, 74,56, 88,70, 30,57, 27,72, 72,56, 86,70);
const PLK_DN = P(20,58, 28,60, 60,58, 36,66, 28,72, 74,62, 88,72, 38,67, 29,72, 72,62, 86,72);
const LIE    = P(20,62, 28,62, 56,64, 24,68, 20,70, 68,58, 78,70, 26,69, 22,71, 66,58, 76,70);
const BENCH_L= P(24,58, 34,58, 62,58, 34,48, 34,36, 70,60, 84,64, 36,50, 36,38, 72,60, 86,64);

/* eq: [] = nothing needed. Codes: db kb bb bar bench band machine */
const EX=[
/* ================= BODYWEIGHT ================= */
{id:'wallpush',n:'Wall Push-Up',r:'E',c:'push',st:'STR',d:'3 × 10',eq:[],
 cues:['Stand an arm-length from a wall, hands at chest height.','Lower your chest toward the wall over 3 slow seconds.','Push back until your arms are straight, body in one line.','Too easy? Walk your feet further back.'],
 f:[P(30,20,36,28,48,56,30,32,24,30,52,76,54,90,32,34,25,34,50,76,52,90),
    P(24,24,32,31,48,58,30,38,22,32,52,76,54,90,32,40,23,36,50,76,52,90)]},
{id:'incpush',n:'Incline Push-Up',r:'E',c:'push',st:'STR',d:'3 × 8',eq:[],
 cues:['Hands on a bed, counter, or couch arm.','Lower until your chest is near the surface.','Squeeze your glutes so the hips don\'t sag.','Use a lower surface as you get stronger.'],
 f:[P(26,34,34,38,60,50,32,46,30,58,74,58,88,70,34,48,31,60,72,58,86,70),
    P(24,46,32,49,60,54,38,54,30,60,74,60,88,71,40,56,31,61,72,60,86,71)]},
{id:'chairsq',n:'Chair Squat',r:'E',c:'legs',st:'STR',d:'3 × 10',eq:[],
 cues:['Stand in front of a chair, feet shoulder width.','Sit back and touch the seat — don\'t collapse into it.','Drive through your heels to stand tall.','The best beginner leg move there is.'],
 f:[ST,m(SQ,{4:54,5:64,10:42,11:70})]},
{id:'wallsit',n:'Wall Sit',r:'E',c:'legs',st:'END',d:'3 × 20s hold',eq:[],
 cues:['Back flat on a wall, slide down until your knees bend.','Start shallow. Shins as vertical as you can manage.','Breathe. Do not hold your breath.','Add 5 seconds a week.'],
 f:[P(62,22,62,30,62,54,58,40,56,52,46,56,44,80,60,40,58,52,44,56,42,80),
    P(62,24,62,32,62,56,58,42,56,54,46,58,44,82,60,42,58,54,44,58,42,82)]},
{id:'kneeplank',n:'Knee Plank',r:'E',c:'core',st:'CORE',d:'3 × 20s hold',eq:[],
 cues:['Forearms down, knees down, straight line head to knees.','Pull your belly in, squeeze your glutes.','Low back aching means your hips sagged. Lift them.','Stop when form breaks, not when it burns.'],
 f:[P(22,50,30,52,58,56,26,60,22,64,70,62,84,66,28,61,24,65,68,62,82,66),
    P(22,49,30,51,58,55,26,59,22,64,70,61,84,66,28,60,24,65,68,61,82,66)]},
{id:'bridge',n:'Glute Bridge',r:'E',c:'legs',st:'STR',d:'3 × 12',eq:[],
 cues:['On your back, knees bent, feet flat and close to your butt.','Push through your heels and lift your hips into a ramp.','Squeeze hard at the top for a full second.','Wakes up what sitting all day puts to sleep.'],
 f:[LIE,m(LIE,{3:60,5:50,7:66,11:52,15:67,19:52})]},
{id:'march',n:'Standing March',r:'E',c:'cardio',st:'END',d:'3 × 45s',eq:[],
 cues:['Stand tall, drive one knee to hip height.','Swing the opposite arm like a fast walk.','Stay light and rhythmic.','Hold a wall if your balance is shaky.'],
 f:[m(ST,{6:44,8:42,14:56,16:58,18:58,19:60,20:56,21:72}),
    m(ST,{6:56,8:58,10:56,11:60,12:56,13:72,14:44,16:42})]},
{id:'calf',n:'Calf Raise',r:'E',c:'legs',st:'END',d:'3 × 15',eq:[],
 cues:['Near a wall for balance, feet hip width.','Rise onto the balls of your feet as high as possible.','Lower over 3 seconds — that\'s where the work is.','Do them while brushing your teeth. Free reps.'],
 f:[ST,m(ST,{1:10,3:20,5:48,7:33,9:46,11:66,13:84,15:33,17:46,19:66,21:84})]},
{id:'birddog',n:'Bird Dog',r:'E',c:'core',st:'CORE',d:'3 × 8 each side',eq:[],
 cues:['Hands and knees, back flat like a tabletop.','Reach one arm forward and the opposite leg back.','Wobbling? Go shorter, not faster.','Best move going for a cranky lower back.'],
 f:[P(26,44,34,46,62,48,30,54,28,66,70,54,78,66,32,55,30,66,68,54,76,66),
    P(24,42,32,44,62,48,24,40,14,38,70,52,88,42,32,55,30,66,68,54,76,66)]},

function pts(p){const o=[];for(let i=0;i<22;i+=2)o.push({x:p[i],y:p[i+1]});return o}

  if(prop==='plate') stat+='<rect x="84" y="30" width="14" height="40" rx="2" class="eqs"/>';
  if(prop==='db'||prop==='band') dyn+='<g data-p="h0"></g><g data-p="h1"></g>';
  if(prop==='db1'||prop==='kb'||prop==='kb1') dyn+='<g data-p="h1"></g>';
  if(prop==='kb2') dyn+='<g data-p="h1"></g>';
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <line x1="4" y1="94" x2="96" y2="94" class="gnd"/>
    ${stat}
    <g class="back"><polyline data-l="1,3,4"/><polyline data-l="2,5,6"/></g>
    <g class="front"><polyline data-l="1,2"/><polyline data-l="1,7,8"/><polyline data-l="2,9,10"/><circle data-head r="7"/></g>
    <g class="eq" data-prop="${prop||''}">${dyn}</g>
  </svg>`;
}
function paint(svg,pose,prop){
  const p=pts(pose);
  svg.querySelectorAll('polyline').forEach(pl=>pl.setAttribute('points',pl.dataset.l.split(',').map(i=>p[+i].x+','+p[+i].y).join(' ')));
  const h=svg.querySelector('[data-head]');h.setAttribute('cx',p[0].x);h.setAttribute('cy',p[0].y);
  if(!prop)return;
  const bH=p[4],fH=p[8];
  const set=(sel,html)=>{const g=svg.querySelector(sel);if(g)g.innerHTML=html};
  const dbAt=(q)=>`<rect x="${q.x-6}" y="${q.y-2.6}" width="12" height="5.2" rx="2.2" class="eqf"/>`;
  const kbAt=(q)=>`<circle cx="${q.x}" cy="${q.y+3}" r="4.6" class="eqf"/><path d="M${q.x-3.4} ${q.y+1} a3.4 4 0 0 1 6.8 0" class="eqo"/>`;
  if(prop==='db'){set('[data-p="h0"]',dbAt(bH));set('[data-p="h1"]',dbAt(fH))}
  else if(prop==='db1'){set('[data-p="h1"]',dbAt(fH))}
  else if(prop==='kb'||prop==='kb1'||prop==='kb2'){set('[data-p="h1"]',kbAt(prop==='kb2'?{x:(bH.x+fH.x)/2,y:(bH.y+fH.y)/2}:fH))}
  else if(prop==='band'){set('[data-p="h0"]',`<line x1="${bH.x}" y1="${bH.y}" x2="${fH.x}" y2="${fH.y}" class="eqb"/>`);set('[data-p="h1"]','')}
  else if(prop==='bar'||prop==='bar2'){
    const y=(bH.y+fH.y)/2, x1=Math.min(bH.x,fH.x)-16, x2=Math.max(bH.x,fH.x)+16;
    const g=svg.querySelector('.eq');
    g.innerHTML=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="eqf2"/>
      <rect x="${x1-2}" y="${y-7}" width="5" height="14" rx="1" class="eqf"/>
      <rect x="${x2-3}" y="${y-7}" width="5" height="14" rx="1" class="eqf"/>`;
  }
  else if(prop==='cable'){const l=svg.querySelector('[data-p="cbl"]');if(l){l.setAttribute('x1',92);l.setAttribute('y1',30);l.setAttribute('x2',fH.x);l.setAttribute('y2',fH.y)}}
}
const lerp=(a,b,t)=>a+(b-a)*t;
const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let rigs=[];
function mount(svg,frames,phase,prop){const r={svg,frames,phase:phase||0,prop};rigs.push(r);paint(svg,frames[0],prop);return r}
function tick(now){
  if(!REDUCED)for(const r of rigs){
    const t=((now/1400)+r.phase)%2,k=t<1?t:2-t,e=k*k*(3-2*k),a=r.frames[0],b=r.frames[1],o=[];
    for(let i=0;i<22;i++)o.push(lerp(a[i],b[i],e));
    paint(r.svg,o,r.prop);
  }
  requestAnimationFrame(tick);
}

function styleSvg(svg){
  svg.querySelectorAll('polyline').forEach(p=>{p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round')});
  const g=svg.querySelector('.gnd');if(g){g.setAttribute('stroke','var(--edge)');g.setAttribute('stroke-width','1')}
  svg.querySelectorAll('.back polyline').forEach(p=>{p.setAttribute('stroke','var(--mana)');p.setAttribute('stroke-width','4');p.setAttribute('opacity','.4')});
  svg.querySelectorAll('.front polyline').forEach(p=>{p.setAttribute('stroke','var(--arc)');p.setAttribute('stroke-width','5')});
  svg.querySelector('[data-head]').setAttribute('fill','var(--arc)');
  svg.querySelectorAll('.eqs').forEach(e=>{e.setAttribute('fill','var(--edge)');e.setAttribute('stroke','none')});
  svg.querySelectorAll('.eqs2').forEach(e=>{e.setAttribute('stroke','var(--edge)');e.setAttribute('stroke-width','2.5')});
}

/* ---------------- quest ---------------- */
function seeded(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return()=>{h=Math.imul(h^h>>>15,2246822507);h^=h>>>13;return(h>>>0)/4294967296}}
function pool(){const p=EX.filter(e=>unlocked(e.r)&&hasEq(e));return p.length?p:EX.filter(e=>!e.eq.length&&e.r==='E')}
function questFor(d){
  const rnd=seeded(d+'|'+S.lvl+'|'+S.eq.join('')+'|'+S.goal),pl=pool(),w=GOALS[S.goal].w;
  const bag=[];for(const c in w)for(let i=0;i<w[c];i++)bag.push(c);
  const out=[],used=new Set();
  let guard=0;
  while(out.length<5&&guard++<200){
    const c=bag[Math.floor(rnd()*bag.length)];
    let opts=pl.filter(e=>e.c===c&&!used.has(e.id));
    if(!opts.length)opts=pl.filter(e=>!used.has(e.id));
    if(!opts.length)break;
    const pick=opts[Math.floor(rnd()*opts.length)];
    used.add(pick.id);out.push(pick);
  }
  return out;
}
function rollQuest(){const d=today();if(S.questDate!==d){S.questDate=d;S.questDone=[];S.questBonus=false;save()}return questFor(d)}

let pendingLevel=null;
function award(xp,gold,stat){
  S.xp+=xp;S.gold+=gold;S.logs++;
  if(stat&&S.stats[stat]!==undefined)S.stats[stat]+=1;
  let g=0;
  while(S.xp>=need(S.lvl)){S.xp-=need(S.lvl);S.lvl++;g++;for(const k in S.stats)S.stats[k]+=1}
  save();if(g)pendingLevel=S.lvl;return g;
}
const gap=()=>Math.max(1,7-(S.days||4));
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function touchStreak(){
  const d=today();if(S.last===d)return;
  if(!S.last){S.streak=1}
  else{
    const n=daysBetween(S.last,d);
    if(n<=gap())S.streak++;
    else if(S.potions>0){S.potions--;S.streak++;toast('Potion of Rest consumed — streak held')}
    else S.streak=1;
  }
  S.best=Math.max(S.best,S.streak);S.last=d;save();
}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2100)}
function applyTheme(){const t=THEMES[S.theme],r=document.documentElement.style;
  if(!t){['--arc','--mana','--edge','--deep','--panel'].forEach(v=>r.removeProperty(v));return}
  r.setProperty('--arc',t.arc);r.setProperty('--mana',t.mana);r.setProperty('--edge',t.edge);r.setProperty('--deep',t.deep);r.setProperty('--panel',t.panel)}

/* ----- onboarding ----- */
function viewOB(){
  const s=ob.step;
  const wrap=(step,title,lead,body,btn,ok)=>`<div class="ob">
    <div class="step">${step} OF 5</div><h2>${title}</h2><p class="lead">${lead}</p>${body}
    <button class="btn" data-obnext ${ok?'':'disabled'}>${btn}</button>
    ${s>0?'<button class="btn ghost" data-obback>Back</button>':''}</div>`;
  const opt=(v,k,label,sub,multi)=>{
    const on=multi?ob.eq.includes(v):ob[k]===v;
    return `<button class="opt ${on?'on':''}" data-ob="${k}:${v}"><span>${label}${sub?`<small>${sub}</small>`:''}</span><span class="tick">✓</span></button>`};
  if(s===0)return wrap(1,'The System has selected you.',
    'Every hunter needs a name. Yours goes on the card.',
    `<input class="namein" id="obname" maxlength="18" placeholder="Enter your name" value="${esc(ob.name)}" autocomplete="off">`,
    'Begin',ob.name.trim().length>0);
  if(s===1)return wrap(2,'How much have you trained?',
    'This sets your starting level and which movements unlock right away. Be honest — nobody is watching.',
    `<div class="opts">
      ${opt('new','exp','Brand new','Never really trained, or coming back after years off')}
      ${opt('some','exp','A little','On and off. You know a squat from a deadlift')}
      ${opt('trained','exp','Trained','Consistent for a while. Comfortable in a gym')}
      ${opt('adv','exp','Advanced','Years in. You have numbers you care about')}
    </div>`,'Continue',!!ob.exp);
  if(s===2)return wrap(3,'What are you chasing?',
    'Your daily quests get built around this. You can change it later.',
    `<div class="opts">
      ${opt('muscle','goal','Build muscle','More pressing and pulling volume')}
      ${opt('strong','goal','Get stronger','Heavier compounds, lower reps')}
      ${opt('cond','goal','Conditioning','More cardio and full-body work')}
      ${opt('consist','goal','Just move more','Balanced and forgiving. Habit first')}
    </div>`,'Continue',!!ob.goal);
  if(s===3)return wrap(4,'What do you have access to?',
    'Pick everything you can actually get to. Nothing selected is completely fine — the bodyweight library is huge.',
    `<div class="opts">
      ${opt('db','eq','Dumbbells','',1)}
      ${opt('kb','eq','Kettlebell','',1)}
      ${opt('bb','eq','Barbell and plates','',1)}
      ${opt('bench','eq','A bench','',1)}
      ${opt('bar','eq','Pull-up bar','',1)}
      ${opt('band','eq','Resistance bands','',1)}
      ${opt('machine','eq','Gym machines and cardio equipment','',1)}
    </div>`,ob.eq.length?'Continue':'I train with nothing but my body',true);
  return wrap(5,'How many days a week?',
    'This decides how forgiving your streak is. Rest days are part of the plan, not a failure.',
    `<div class="opts">
      ${opt(3,'days','3 days','Streak survives up to 4 days between sessions')}
      ${opt(4,'days','4 days','Streak survives up to 3 days between sessions')}
      ${opt(5,'days','5 days','Streak survives up to 2 days between sessions')}
      ${opt(6,'days','6 days','Streak survives 1 day between sessions')}
    </div>`,'Enter the System',!!ob.days);
}
function finishOB(){
  S.setup=true;S.name=ob.name.trim().slice(0,18);S.exp=ob.exp;S.goal=ob.goal;S.eq=ob.eq.slice();S.days=ob.days;
  S.lvl=XPLEVEL[ob.exp]||1;
  const bump={new:0,some:2,trained:5,adv:9}[ob.exp]||0;
  for(const k in S.stats)S.stats[k]+=bump;
  save();tab='quest';render();showIntro();
}

/* ----- main views ----- */
function hunterCard(){
  const r=rankOf(S.lvl),n=need(S.lvl);
  const title=S.title?(SHOP.find(x=>x.id===S.title)||{}).n:RANK_NAME[r];
  return `<section class="win">
    <div class="hunter">
      <div class="rankbadge"><span>${r}</span></div>
      <div style="flex:1;min-width:0">
        <h1 class="hname">${esc(S.name||'Hunter')}</h1>
        <div class="htitle">${esc(title)} · Level ${S.lvl}</div>
        <div class="bar"><i style="width:${Math.min(100,S.xp/n*100)}%"></i></div>
        <div class="barlab"><span>Experience</span><span><b>${S.xp}</b> / ${n}</span></div>
      </div>
    </div>
    <div class="purse">
      <div class="chip g">Gold <b>${S.gold}</b></div>
      <div class="chip s">Streak <b>${S.streak}</b></div>
      <div class="chip">Best <b>${S.best}</b></div>
      <div class="chip">Sets logged <b>${S.logs}</b></div>

  </section>`;
}
function viewQuest(){
  const q=rollQuest(),done=S.questDone,all=q.length&&q.every(e=>done.includes(e.id));
  const light=unlocked('D')?'knee push-ups':'wall push-ups';
  return hunterCard()+`
  <section class="win">
    <h2 class="win-title">Daily Quest<small>Built from your goal and your equipment. Resets at midnight.</small></h2>
    ${q.map((e,i)=>`<div class="qrow ${done.includes(e.id)?'done':''}" data-q="${e.id}">
        <svg class="qfig" data-fig="${e.id}" data-phase="${i*0.3}" viewBox="0 0 100 100"></svg>
        <div class="qmeta"><h4>${esc(e.n)}</h4><p>${esc(e.d)} · ${CATS[e.c]}</p></div>
        <div class="qcheck">✓</div></div>`).join('')}
    ${all?'<div class="qdone-banner">Quest Complete</div>':''}
    <p class="warn">Tap a row to see how it's done and log it. Rest 60–90 seconds between sets. Sharp pain means stop and swap the movement — soreness is fine, pain isn't.</p>
  </section>

    <h2 class="win-title">Instant Dungeon<small>Optional bonus. Six minutes, whatever you have left.</small></h2>

}

    <div class="item"><div class="ico">▤</div><div style="flex:1"><h4>Equipment</h4><p>${S.eq.length?esc(S.eq.map(x=>EQNAME[x]).join(', ')):'Bodyweight only'}</p></div><button class="buy" data-editeq>Edit</button></div>

    <div class="item"><div class="ico">⟲</div><div style="flex:1"><h4>Start over</h4><p>Wipes your level, gold, and records on this device. Cannot be undone.</p></div><button class="buy warnbtn" data-reset>Reset</button></div>

  <div class="opts">${Object.entries(EQNAME).map(([k,v])=>`<button class="opt ${S.eq.includes(k)?'on':''}" data-toggleeq="${k}"><span>${v}</span><span class="tick">✓</span></button>`).join('')}</div>
  <button class="btn" data-eqdone>Save kit</button></section>`;

function render(){
  applyTheme();
  if(!S.setup){root.innerHTML=viewOB();const n=document.getElementById('obname');if(n){n.oninput=e=>{ob.name=e.target.value;const b=document.querySelector('[data-obnext]');b.disabled=!ob.name.trim()}}return}
  const body=tab==='quest'?viewQuest():tab==='lib'?viewLib():tab==='rec'?viewRecords():tab==='eqedit'?viewEqEdit():viewShop();
  root.innerHTML=EQCSS+body+`<nav class="tabs">
    <button data-tab="quest" class="${tab==='quest'?'on':''}">QUEST</button>
    <button data-tab="lib" class="${tab==='lib'?'on':''}">SKILLS</button>
    <button data-tab="rec" class="${tab==='rec'?'on':''}">RECORDS</button>
    <button data-tab="shop" class="${tab==='shop'||tab==='eqedit'?'on':''}">VAULT</button></nav>`;
  rigs=[];
  root.querySelectorAll('svg[data-fig]').forEach(svg=>{
    const e=EX.find(x=>x.id===svg.dataset.fig);if(!e)return;
    svg.innerHTML=figSVG(e.p,e.pp);styleSvg(svg);mount(svg,e.f,parseFloat(svg.dataset.phase||0),e.p);
  });
  if(open)renderSheet();
  if(pendingLevel!==null)showLevelUp();
}
function renderSheet(){
  const e=EX.find(x=>x.id===open);if(!e)return;
  const lockedRank=!unlocked(e.r),lockedEq=!hasEq(e);
  const q=rollQuest(),inQ=q.some(x=>x.id===e.id),doneToday=S.questDone.includes(e.id);
  const v=document.createElement('div');v.className='veil';v.dataset.veil='1';
  const kit=e.eq.length?e.eq.map(x=>EQNAME[x]).join(' + '):'no equipment';
  v.innerHTML=`<div class="sheet">${EQCSS}
    <h2>${esc(e.n)}</h2>
    <div class="sub">${e.r}-Rank · ${CATS[e.c]} · builds ${e.st} · ${esc(kit)}</div>
    <div class="demo"><svg data-sheetfig viewBox="0 0 100 100"></svg></div>
    <ul class="cues">${e.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
    <div class="sub" style="margin:0 0 12px">Target for now: <b style="color:var(--gold)">${esc(e.d)}</b></div>
    ${lockedRank?`<button class="btn" disabled>Unlocks at level ${RANK_LV[e.r]}</button>`
      :lockedEq?`<button class="btn" disabled>Needs ${esc(kit)}</button>`
      :`<button class="btn" data-log="${e.id}" ${doneToday?'disabled':''}>${doneToday?'Logged today':'Log it · +'+(inQ?25:15)+' XP'}</button>`}
    <button class="btn ghost" data-close>Close</button></div>`;
  document.body.appendChild(v);
  const svg=v.querySelector('[data-sheetfig]');
  svg.innerHTML=figSVG(e.p,e.pp);styleSvg(svg);mount(svg,e.f,0,e.p);
}
function closeSheet(){document.querySelectorAll('[data-veil]').forEach(v=>{v.querySelectorAll('svg').forEach(s=>{rigs=rigs.filter(r=>r.svg!==s)});v.remove()});open=null}
function showLevelUp(){
  const lv=pendingLevel;pendingLevel=null;
  const r=rankOf(lv),prev=rankOf(lv-1);
  const d=document.createElement('div');d.className='lvlup';
  d.innerHTML=`<div>LEVEL ${lv}<p>${r!==prev?'Rank up. You are now '+RANK_NAME[r]+'. New skills unlocked in the library.':'All stats increased by 1.'}</p></div>`;
  document.body.appendChild(d);
  const bye=()=>{d.remove();if(r!==prev)render()};
  d.addEventListener('click',bye);setTimeout(()=>{if(d.isConnected)bye()},2600);
}

/* ---------------- guided tour ---------------- */
const TOUR=[
 {sel:'.rankbadge',t:'This is you',x:'Your rank, level and stats. Every set you log feeds this card. Rank goes E → D → C → B → A as you level.'},
 {sel:'.bar',t:'Experience',x:'Fills every time you log a movement. Fill it completely and you level up, which unlocks harder skills in the library.'},
 {sel:'.qrow',t:'Your daily quest',x:'Four or five movements picked for your goal and the gear you said you have. It rebuilds itself every morning.'},
 {sel:'.qrow',t:'Tap any row',x:'It opens a demo of the movement — an animated figure, form cues, and how many sets to do. That is where you log it.'},
 {sel:'.qcheck',t:'Then check it off',x:'Logging pays XP and gold. Finish every row in the quest and you get a bonus on top. That is the whole loop.'},
 {sel:'[data-dungeon]',t:'Instant dungeon',x:'Optional. Six minutes of circuits on days you have extra in the tank. Skip it whenever you want.'},
 {sel:'[data-tab="lib"]',t:'The library',x:'68 movements from wall push-ups to power cleans. Filter by what you can actually do, or browse everything and see what unlocks later.'},
 {sel:'[data-tab="rec"]',t:'Records',t2:1,x:'Max push-ups, max squats, longest plank. Test them every couple of weeks — beating an old number pays gold per point.'},
 {sel:'[data-tab="shop"]',t:'The vault',x:'Spend gold on titles and color themes. You can also change your goal, edit your equipment, or reset everything from here.'}
];
let tour={on:false,i:0,els:null};
function startTour(){
  S.tourSeen=true;save();
  tour.on=true;tour.i=0;tab='quest';closeSheet();render();
  const block=document.createElement('div');block.className='tourblock';
  const spot=document.createElement('div');spot.className='spot';
  const tip=document.createElement('div');tip.className='tip';
  document.body.append(block,spot,tip);
  tour.els={block,spot,tip};
  window.addEventListener('resize',placeTour);
  window.addEventListener('scroll',placeTour,true);
  stepTour(0);
}
function stepTour(i){
  tour.i=i;
  const s=TOUR[i],{tip}=tour.els;
  tip.innerHTML=`<h4>${esc(s.t)}</h4><p>${esc(s.x)}</p>
    <div class="tiprow">
      <span class="dots2">${TOUR.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</span>
      ${i<TOUR.length-1?'<button data-tskip>Skip</button>':''}
      <button class="go" data-tnext>${i<TOUR.length-1?'Next':'Let\'s go'}</button>
    </div>`;
  const el=document.querySelector(s.sel);
  if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(placeTour,el?260:0);
}
function placeTour(){
  if(!tour.on)return;
  const s=TOUR[tour.i],{spot,tip}=tour.els;
  const el=document.querySelector(s.sel);
  if(!el){spot.style.opacity=0;tip.style.top='50%';tip.style.left='50%';tip.style.transform='translate(-50%,-50%)';return}
  spot.style.opacity=1;tip.style.transform='none';
  const r=el.getBoundingClientRect(),pad=7;
  spot.style.top=(r.top-pad)+'px';spot.style.left=(r.left-pad)+'px';
  spot.style.width=(r.width+pad*2)+'px';spot.style.height=(r.height+pad*2)+'px';
  const th=tip.offsetHeight||150,tw=tip.offsetWidth||320;
  let top=r.bottom+16;
  if(top+th>window.innerHeight-12)top=Math.max(12,r.top-th-16);
  let left=r.left+r.width/2-tw/2;
  left=Math.min(Math.max(12,left),window.innerWidth-tw-12);
  tip.style.top=top+'px';tip.style.left=left+'px';
}
function endTour(){
  if(!tour.on)return;
  tour.on=false;
  Object.values(tour.els).forEach(e=>e.remove());
  tour.els=null;
  window.removeEventListener('resize',placeTour);
  window.removeEventListener('scroll',placeTour,true);
}

/* ---------------- events ---------------- */
document.addEventListener('click',ev=>{
  const t=ev.target;
  // intro + tour
  if(t.closest('[data-accept]')){document.querySelector('.sysmsg')?.remove();startTour();return}
  if(t.closest('[data-tskip]')){endTour();toast('Tutorial skipped. Replay it any time from the Vault.');return}
  if(t.closest('[data-tnext]')){
    if(tour.i>=TOUR.length-1){endTour();toast('You are set. Go clear your first quest.')}
    else stepTour(tour.i+1);
    return}
  if(t.closest('[data-replaytour]')){tab='quest';render();startTour();return}
  if(tour.on)return;
  // onboarding
  const o=t.closest('[data-ob]');
  if(o){const [k,v]=o.dataset.ob.split(':');
    if(k==='eq'){const i=ob.eq.indexOf(v);i>=0?ob.eq.splice(i,1):ob.eq.push(v)}
    else ob[k]=(k==='days')?+v:v;
    render();return}
  if(t.closest('[data-obnext]')){
    if(ob.step===0){const n=document.getElementById('obname');if(n)ob.name=n.value}
    if(ob.step===4){finishOB();return}
    ob.step++;render();return}
  if(t.closest('[data-obback]')){ob.step=Math.max(0,ob.step-1);render();return}

  const tb=t.closest('[data-tab]');if(tb){tab=tb.dataset.tab;closeSheet();render();return}
  const f=t.closest('[data-f]');if(f){const [k,v]=f.dataset.f.split(':');filt[k]=v;render();return}
  const ex=t.closest('[data-ex]');if(ex){open=ex.dataset.ex;renderSheet();return}
  const qr=t.closest('[data-q]');if(qr){open=qr.dataset.q;renderSheet();return}
  if(t.closest('[data-close]')||t.dataset.veil==='1'){closeSheet();return}

  const lg=t.closest('[data-log]');
  if(lg){
    const e=EX.find(x=>x.id===lg.dataset.log),q=rollQuest(),inQ=q.some(x=>x.id===e.id);
    touchStreak();
    if(inQ&&!S.questDone.includes(e.id))S.questDone.push(e.id);
    award(inQ?25:15,10,e.st);
    if(q.every(x=>S.questDone.includes(x.id))&&!S.questBonus){S.questBonus=true;award(80,50,null);toast('Daily Quest complete · +80 XP · +50 gold')}
    else toast(e.n+' logged · +'+(inQ?25:15)+' XP · +10 gold');
    closeSheet();render();return}

  if(t.closest('[data-dungeon]')){touchStreak();award(60,40,'END');toast('Dungeon cleared · +60 XP · +40 gold');render();return}

  const ps=t.closest('[data-prsave]');
  if(ps){const k=ps.dataset.prsave,inp=document.querySelector(`[data-pr="${k}"]`),v=parseInt(inp.value,10);
    if(!v||v<0){toast('Enter a number first');return}
    const old=S.prs[k]||0;
    if(v>old){const g=(v-old)*3;S.prs[k]=v;award(30,g,k==='plank'?'CORE':'STR');toast('New record · +'+g+' gold')}
    else{toast('Logged. Record still '+old+'.');save()}
    render();return}

  const sh=t.closest('[data-shop]');
  if(sh){const id=sh.dataset.shop;
    if(id==='clear_title'){S.title=null;save();render();return}
    if(id==='clear_theme'){S.theme=null;save();render();return}
    const it=SHOP.find(x=>x.id===id),owned=S.owned.includes(id);
    if(it.k==='potion'){if(S.gold<it.p){toast('Not enough gold');return}S.gold-=it.p;S.potions++;toast('Potion of Rest acquired');save();render();return}
    if(!owned){if(S.gold<it.p){toast('Not enough gold');return}S.gold-=it.p;S.owned.push(id);toast(it.n+' acquired')}
    if(it.k==='title')S.title=S.title===id?null:id;
    if(it.k==='theme')S.theme=S.theme===id?null:id;
    save();render();return}

  if(t.closest('[data-cyclegoal]')){const k=Object.keys(GOALS);S.goal=k[(k.indexOf(S.goal)+1)%k.length];save();toast('Goal: '+GOALS[S.goal].n);render();return}
  if(t.closest('[data-cycledays]')){S.days=S.days>=6?3:S.days+1;save();render();return}
  if(t.closest('[data-editeq]')){tab='eqedit';render();return}
  const te=t.closest('[data-toggleeq]');
  if(te){const k=te.dataset.toggleeq,i=S.eq.indexOf(k);i>=0?S.eq.splice(i,1):S.eq.push(k);save();render();return}
  if(t.closest('[data-eqdone]')){tab='shop';save();toast('Kit updated');render();return}
  if(t.closest('[data-reset]')){
    if(!confirm('Wipe your hunter and start over? This cannot be undone.'))return;
    S={setup:false,name:'',goal:'consist',exp:'new',eq:[],days:4,lvl:1,xp:0,gold:0,streak:0,best:0,last:null,
      stats:{STR:5,END:5,VIT:5,AGI:5,CORE:5},prs:{pushup:0,squat:0,plank:0},logs:0,questDate:null,questDone:[],
      questBonus:false,owned:[],title:null,theme:null,potions:0};
    ob={step:0,name:'',exp:null,goal:null,eq:[],days:null};
    save();applyTheme();render();return}
});

/* ---------------- boot ---------------- */
(async()=>{
  await load();
  if(S.setup&&S.last){
    const d=today(),n=daysBetween(S.last,d);
    if(n>gap()){if(S.potions>0)S.potions--;else S.streak=0;save()}
  }
  render();
  if(S.setup&&!S.tourSeen)setTimeout(startTour,400);
})();
</script>

</body>
</html>
