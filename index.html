  if(tour.on){endTour();toast('Skipped. Replay it from the Vault.');return}
  if(document.querySelector('[data-veil]')){closeSheet();return}
});

/* ----- level up ----- */
let shards=[],BW,BH,burstOn=false,bx,bc;
function sizeBurst(){if(!bc)return;BW=bc.width=innerWidth*2;BH=bc.height=innerHeight*2}
function shardBurst(n,spd){
  for(let i=0;i<n;i++){const a=Math.random()*6.3,s=spd*(.35+Math.random());
    shards.push({x:BW/2,y:BH*.42,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,
      r:1+Math.random()*3.2,dec:.008+Math.random()*.012})}
}
function burstLoop(){
  if(!burstOn||!bc||!bc.isConnected)return;
  bx.clearRect(0,0,BW,BH);
  for(let i=shards.length-1;i>=0;i--){
    const p=shards[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.975;p.vy*=.975;p.life-=p.dec;
    if(p.life<=0){shards.splice(i,1);continue}
    bx.globalAlpha=p.life;
    bx.fillStyle=p.life>.7?cssv('--core'):p.life>.35?cssv('--magenta'):cssv('--crimson');
    bx.beginPath();bx.arc(p.x,p.y,p.r*2.2,0,6.3);bx.fill();
  }
  requestAnimationFrame(burstLoop);
}
function showLevelUp(){
  const lv=pendingLevel;pendingLevel=null;
  const r=rankOf(lv),prev=rankOf(lv-1),ranked=r!==prev;
  const el=document.createElement('div');el.className='awaken';
  el.innerHTML=`<canvas id="burst"></canvas><div class="aflash"></div>
    <div class="acore"></div><div class="aring r1"></div><div class="aring r2"></div>
    <div class="atext">
      <span class="asmall">${ranked?'Rank up':'Level up'}</span>
      <span class="abig">LEVEL ${lv}</span>
      <span class="asub">${ranked?`Now <b>${r}-Rank · ${RANK_TITLE[r]}</b>`:'Every stat increased by 1'}</span>
      <div class="aloot">
        <span class="aloot-i">All stats +1</span>
        ${ranked?'<span class="aloot-i">New skills unlocked</span>':''}
      </div>
    </div>
    <p class="atap">Tap anywhere to continue</p>`;
  el.setAttribute('role','status');
  el.setAttribute('aria-live','polite');
  /* Any earlier one is gone before this one goes up: two stacked overlays was
     the other way to end up staring at black. */
  document.querySelectorAll('.awaken').forEach(x=>x.remove());
  el.dataset.live='1';
  document.body.appendChild(el);
  let done=false;
  const bye=()=>{if(done)return;done=true;burstOn=false;
    clearTimeout(hardStop);removeEventListener('keydown',esc);
    el.remove();if(ranked)render()};
  /* Dismissible from the first frame, by tap or by key, and always announced
     with a visible way out rather than a mystery black screen. */
  el.addEventListener('click',bye);
  el.addEventListener('keydown',bye);
  const esc=ev=>{if(ev.key==='Escape'||ev.key===' '||ev.key==='Enter')bye()};
  addEventListener('keydown',esc);
  const hardStop=setTimeout(bye,7000);          // nothing survives this
  const cleanup=()=>{clearTimeout(hardStop);removeEventListener('keydown',esc)};
  if(REDUCED){                       // a fade and the text, nothing else
    el.querySelector('.atext').style.opacity=1;
    setTimeout(()=>{if(el.isConnected)bye()},4200);
    return;
  }
  bc=el.querySelector('#burst');bx=bc.getContext('2d');sizeBurst();
  shards=[];burstOn=true;requestAnimationFrame(burstLoop);
  const core=el.querySelector('.acore'),flash=el.querySelector('.aflash'),
        txt=el.querySelector('.atext'),r1=el.querySelector('.r1'),r2=el.querySelector('.r2');
  setTimeout(()=>{core.style.transition='transform 1.05s cubic-bezier(.35,.8,.3,1)';
    core.style.transform='translate(-50%,-50%) scale(1)';shardBurst(40,3)},120);
  setTimeout(()=>{core.style.transition='transform .22s ease-in';
    core.style.transform='translate(-50%,-50%) scale(.35)'},1150);
  setTimeout(()=>{
    if(navigator.vibrate)navigator.vibrate([0,45,40,110]);
    core.style.transition='transform .5s cubic-bezier(.15,1.1,.4,1)';
    core.style.transform='translate(-50%,-50%) scale(3.4)';
    flash.style.opacity=.92;shardBurst(220,26);
    setTimeout(()=>{flash.style.transition='opacity .55s';flash.style.opacity=0},60);
    [r1,r2].forEach((rr,i)=>setTimeout(()=>{
      rr.style.transition='transform 1.15s cubic-bezier(.1,.8,.25,1), opacity 1.15s';
      rr.style.opacity=.85;rr.style.transform='translate(-50%,-50%) scale(6)';
      setTimeout(()=>{rr.style.opacity=0},420)},i*170));
  },1400);
  setTimeout(()=>{core.style.transition='transform 1.2s ease-out, opacity 1.2s';
    core.style.transform='translate(-50%,-50%) scale(1.5)';core.style.opacity=.3},1960);
  setTimeout(()=>{txt.style.opacity=1},2120);
  setTimeout(()=>{if(el.isConnected)bye()},5400);
}

/* ----- intro + tour ----- */
function showIntro(){
  const lines=[
    ['You have awakened.','big'],
    ['A quest will be issued each day. Clear it and your aura grows. Ignore it and the light goes out.',''],
    ['Nothing here is given. All of it is earned.','']
  ];
  const d=document.createElement('div');d.className='sysmsg';
  d.innerHTML=`<div class="sysbox">
    <div class="syshead" style="animation:lineIn .4s forwards">The System</div>
    ${lines.map((l,i)=>`<p class="sysline ${l[1]}" style="animation-delay:${.45+i*.95}s">${esc(l[0])}</p>`).join('')}
    <div class="sysbtns" style="animation-delay:${.45+lines.length*.95}s">
      <button class="btn" data-accept>Accept</button></div></div>`;
  document.body.appendChild(d);
}
const TOUR=[
 {sel:'.blade',t:'This is your weapon',x:'It burns as long as you keep training. Let the streak die and it goes dark and dull.'},
 {sel:'.lvlrow',t:'Level, XP and gold',x:'Every skill you log pays both. Fill the bar and you level up, which unlocks harder skills.'},
 {sel:'.props',t:'Your stats',x:'STR, END, VIT, AGI and CORE grow from the kind of work you actually do. Level ups raise all five.'},
 {sel:'[data-begin]',t:'Begin Quest',x:'Five movements picked for your goal and your kit, rebuilt every morning. You see them one at a time, with timers for the holds and the rests.'},
 {sel:'.kitline',t:'What you have today',x:'Travelling, or stuck in a hotel room? Change it here and the quest rebuilds around what you actually have.'},
 {sel:'[data-dungeon]',t:'Instant dungeon',x:'A six-minute timed loop for days you have extra in the tank. Three bodyweight stations, as many rounds as you can. It runs the clock for you.'},
 {sel:'[data-tab="lib"]',t:'The library',x:'155 movements from wall push-ups to power cleans, ranked E through A. Every one animates so you can see the shape of it before you try it. Filter by muscle to find what you want.'},
 {sel:'[data-tab="rec"]',t:'Records and your card',x:'Track your max push-ups, squats and plank. Milestones live here, and the two cards worth sending to the group chat.'},
 {sel:'[data-tab="prov"]',t:'Provisions',x:'Food ideas sorted by the situation you are in — a petrol station, a hotel room with a kettle, ten minutes after a long shift. Nothing there tracks anything.'},
 {sel:'[data-tab="vault"]',t:'The vault',x:'Change your class or palette any time — it costs nothing and resets nothing. Spend gold on titles and new palettes. Goal, kit and rest days live here too.'}
];
let tour={on:false,i:0,els:null};
function startTour(){
  S.tourSeen=true;save();tour.on=true;tour.i=0;tab='quest';closeSheet();render();
  const block=document.createElement('div');block.className='tourblock';
  const spot=document.createElement('div');spot.className='spot';
  const tip=document.createElement('div');tip.className='tip';
  document.body.append(block,spot,tip);tour.els={block,spot,tip};
  addEventListener('resize',placeTour);addEventListener('scroll',placeTour,true);
  stepTour(0);
}
function stepTour(i){
  tour.i=i;const s=TOUR[i],{tip}=tour.els;
  tip.innerHTML=`<h4>${esc(s.t)}</h4><p>${esc(s.x)}</p>
    <div class="tiprow"><span class="dots2">${TOUR.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</span>
    ${i<TOUR.length-1?'<button data-tskip>Skip</button>':''}
    <button class="go" data-tnext>${i<TOUR.length-1?'Next':'Begin'}</button></div>`;
  const el=document.querySelector(s.sel);
  if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(placeTour,el?280:0);
}
function placeTour(){
  if(!tour.on)return;
  const s=TOUR[tour.i],{spot,tip}=tour.els,el=document.querySelector(s.sel);
  if(!el){spot.style.opacity=0;return}
  spot.style.opacity=1;
  const r=el.getBoundingClientRect(),pad=7;
  spot.style.transform=`translate3d(${r.left-pad}px,${r.top-pad}px,0)`;
  spot.style.width=(r.width+pad*2)+'px';spot.style.height=(r.height+pad*2)+'px';
  const th=tip.offsetHeight||150,tw=tip.offsetWidth||320;
  let top=r.bottom+16;
  if(top+th>innerHeight-12)top=Math.max(12,r.top-th-16);
  let left=r.left+r.width/2-tw/2;
  left=Math.min(Math.max(12,left),innerWidth-tw-12);
  tip.style.top=top+'px';tip.style.left=left+'px';
}
function endTour(){
  if(!tour.on)return;tour.on=false;
  Object.values(tour.els).forEach(e=>e.remove());tour.els=null;
  removeEventListener('resize',placeTour);removeEventListener('scroll',placeTour,true);
}

/* ---------------- events ---------------- */
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.closest('[data-accept]')){document.querySelector('.sysmsg')?.remove();startTour();return}
  if(t.closest('[data-tskip]')){endTour();toast('Skipped. Replay it from the Vault.');return}
  if(t.closest('[data-tnext]')){
    if(tour.i>=TOUR.length-1){endTour();toast('Go clear your first quest.')}else stepTour(tour.i+1);return}
  if(t.closest('[data-replaytour]')){tab='quest';render();startTour();return}
  if(tour.on)return;

  const oe=t.closest('[data-obeq]');
  if(oe){const k=oe.dataset.obeq,i=ob.eq.indexOf(k);
    i>=0?ob.eq.splice(i,1):ob.eq.push(k);render();return}
  const oc=t.closest('[data-obcls]');
  if(oc){ob.class=oc.dataset.obcls;                 // class sets the weapon/palette defaults
    const dw=CLASSES[ob.class].w;
    ob.weapon=WEAPONPRICE[dw]?'longsword':dw;       // you can't start with a weapon you'd have to buy
    ob.palette=CLASSES[ob.class].pal;
    render();return}
  const ow=t.closest('[data-obwep]');
  if(ow){if(!WEAPONPRICE[ow.dataset.obwep]){ob.weapon=ow.dataset.obwep;render()}return}
  const op=t.closest('[data-obpal]');
  if(op){ob.palette=op.dataset.obpal;render();return}
  const sc=t.closest('[data-setcls]');
  if(sc){S.class=sc.dataset.setcls;                 // cosmetic swap: progression untouched
    if(wepOwned(cls().w))S.weapon=cls().w;
    S.palette=cls().pal;
    save();render();return}
  const sw=t.closest('[data-setwep]');
  if(sw){const k=sw.dataset.setwep;
    if(wepOwned(k)){S.weapon=k;save();render();return}
    const p=WEAPONPRICE[k];
    if(S.gold<p){toast('Not enough gold · '+WEAPONNAME[k]+' costs '+p);return}
    S.gold-=p;S.owned.push('wep_'+k);S.weapon=k;    // buy and equip in one tap
    toast(WEAPONNAME[k]+' acquired');save();render();return}
  const sp=t.closest('[data-setpal]');
  if(sp){S.palette=sp.dataset.setpal;save();render();return}

  const o=t.closest('[data-ob]');
  if(o){const [k,v]=o.dataset.ob.split(':');
    if(k==='eq'){const i=ob.eq.indexOf(v);i>=0?ob.eq.splice(i,1):ob.eq.push(v)}
    else ob[k]=(k==='days')?+v:v;
    render();return}
  if(t.closest('[data-obnext]')){
    if(ob.step===0){const n=document.getElementById('obname');if(n)ob.name=n.value}
    if(ob.step===6){finishOB();return}
    ob.step++;render();return}
  if(t.closest('[data-obback]')){ob.step=Math.max(0,ob.step-1);render();return}

  const tb=t.closest('[data-tab]');if(tb){tab=tb.dataset.tab;closeSheet();render();scrollTo(0,0);return}
  const f=t.closest('[data-f]');if(f){const [k,v]=f.dataset.f.split(':');filt[k]=v;render();return}
  const ex=t.closest('[data-ex]');if(ex){open=ex.dataset.ex;renderSheet();return}
  if(t.closest('[data-card]')){showCard();return}
  if(t.closest('[data-week]')){showWeek();return}
  if(t.closest('[data-close]')||t.dataset.veil==='1'){closeSheet();
    document.querySelectorAll('.cardveil').forEach(v=>v.remove());return}

  const lg=t.closest('[data-log]');
  if(lg){
    const e=EX.find(x=>x.id===lg.dataset.log),q=rollQuest(),inQ=q.some(x=>x.id===e.id);
    touchStreak();
    if(inQ&&!S.questDone.includes(e.id))S.questDone.push(e.id);
    award(inQ?25:15,10,e.st);
    if(q.every(x=>S.questDone.includes(x.id))&&!S.questBonus){
      S.questBonus=true;S.clears++;award(80,50,null);toast('Daily quest cleared · +80 XP · +50 gold')}
    else toast(e.n+' · +'+(inQ?25:15)+' XP · +10 gold');
    noteLogged(e);checkAch();
    closeSheet();render();return}

  if(t.closest('[data-dungeon]')){
    if(dg()&&dg().st==='run'){keepAwake(true);dgFired=false;tab='dungeon';render();return}
    startDungeon();return}
  if(t.closest('[data-dgnext]')){const o=dg();
    o.step++; if(o.step%3===0)o.rounds++;
    buzz([0,35]);save();render();return}
  if(t.closest('[data-dgpause]')){const o=dg();
    if(o.paused){o.endAt=Date.now()+o.left*1000;o.paused=0;dgFired=false}
    else{o.left=dgLeft();o.paused=1}
    save();render();return}
  if(t.closest('[data-dgstop]')){endDungeon();return}
  if(t.closest('[data-dgexit]')){keepAwake(false);tab='quest';save();render();return}
  if(t.closest('[data-dgdone]')){S.dg=null;keepAwake(false);save();tab='quest';render();return}

  const ps=t.closest('[data-prsave]');
  if(ps){const k=ps.dataset.prsave,inp=document.querySelector(`[data-pr="${k}"]`),v=parseInt(inp.value,10);
    if(!v||v<0){toast('Enter a number first');return}
    const old=S.prs[k]||0;
    if(v>old){const g=(v-old)*3;
      if(!S.prFirst[k])S.prFirst[k]=old||v;      // the baseline a doubling is measured from
      S.prs[k]=v;award(30,g,k==='plank'?'CORE':'STR');toast('New record · +'+g+' gold');checkAch()}
    else{toast('Logged. Record still '+old+'.');save()}
    render();return}

  const sh=t.closest('[data-shop]');
  if(sh){const id=sh.dataset.shop;
    if(id==='clear_title'){S.title=null;save();render();return}
    const it=shopItems().find(x=>x.id===id);if(!it)return;
    if(it.earned){S.title=S.title===id?null:id;save();render();return}
    const owned=S.owned.includes(id);
    if(it.k==='potion'){if(S.gold<it.p){toast('Not enough gold');return}
      S.gold-=it.p;S.potions++;toast('Elixir acquired');save();render();return}
    if(!owned){if(S.gold<it.p){toast('Not enough gold');return}
      S.gold-=it.p;S.owned.push(id);toast(it.n+' acquired')}
    if(it.k==='title')S.title=S.title===id?null:id;
    if(it.k==='pal')S.palette=it.pal;
    save();render();return}

  if(t.closest('[data-cyclegoal]')){const k=Object.keys(GOALS);
    S.goal=k[(k.indexOf(S.goal)+1)%k.length];save();toast('Goal: '+GOALS[S.goal].n);render();return}
  if(t.closest('[data-cycledays]')){S.days=S.days>=6?3:S.days+1;save();render();return}
  /* ----- guided session ----- */
  if(t.closest('[data-begin]')){
    if(S.kitAsked===today()&&sess()){keepAwake(true);tab='run';render();return}
    if(!sess())startSession();
    tab=(S.kitAsked===today())?'run':'kit';render();return}
  if(t.closest('[data-kitopen]')){tab='kit';render();return}
  if(t.closest('[data-kitdone]')){
    S.kitAsked=today();
    if(!sess())startSession(); else {const o=sess();o.i=0;o.set=1;o.st='brief';o.endAt=0}
    save();keepAwake(true);tab='run';render();return}
  if(t.closest('[data-runexit]')){endSession(true);return}
  if(t.closest('[data-runfinish]')){endSession(false);return}
  if(t.closest('[data-sound]')){S.sound=!S.sound;save();
    if(S.sound)beep();
    toast(S.sound?'Sound on':'Sound off');render();return}
  if(t.closest('[data-runstart]')){
    const o=sess(),q=questToday(),e=q[o.i];
    if(isTimed(e)){o.st='hold';o.total=targetReps(e);o.endAt=Date.now()+o.total*1000;o.paused=0;fired=false}
    else o.st='work';
    save();render();return}
  if(t.closest('[data-holdpause]')){
    const o=sess();
    if(o.paused){o.endAt=Date.now()+o.left*1000;o.paused=0;fired=false}
    else{o.left=restLeft();o.paused=1}
    save();render();return}
  const hd=t.closest('[data-holddone]');
  if(hd){const o=sess(),q=questToday(),e=q[o.i],sets=(doseParts(e)||{}).sets||3;
    buzz([0,40]);
    if(o.set>=sets){clearMovement(e,null);return}
    o.set++;o.total=restLen(e);fired=false;beginRest(o.total);return}
  const sd=t.closest('[data-setdone]');
  if(sd){const o=sess(),q=questToday(),e=q[o.i],sets=(doseParts(e)||{}).sets||3;
    const inp=document.getElementById('actual');
    const got=inp&&inp.value!==''?parseInt(inp.value,10):null;
    buzz([0,40]);
    /* Say it back. Typing a number into a box that then vanishes gives you no
       reason to believe it was recorded. */
    if(got!=null&&Number.isFinite(got)&&got>0){
      o.log=o.log||[];o.log.push({n:e.n,set:o.set,reps:got});
      toast('Set '+o.set+' · '+got+' reps logged');
    }
    if(o.set>=sets){clearMovement(e,got);return}
    if(got!=null)recordPerf(e,got);
    o.set++;o.total=restLen(e);fired=false;beginRest(o.total);return}
  if(t.closest('[data-restskip]')){const o=sess();o.st='work';o.endAt=0;fired=false;save();render();return}
  if(t.closest('[data-runskip]')){
    const o=sess(),q=questToday();o.i++;o.set=1;o.st='brief';o.endAt=0;
    if(o.i>=q.length)o.st='done';
    save();render();return}
  const swp=t.closest('[data-swap]');
  if(swp){const e=EX.find(x=>x.id===swp.dataset.swap);if(e)viewSwap(e);return}
  const st2=t.closest('[data-swapto]');
  if(st2){const [a,b]=st2.dataset.swapto.split('|');doSwap(a,b,false);return}
  const shr=t.closest('[data-swaphurt]');
  if(shr){const [a,b]=shr.dataset.swaphurt.split('|');doSwap(a,b,true);return}

  const fq=t.closest('[data-foodeq]');
  if(fq){const k=fq.dataset.foodeq,i=S.foodEq.indexOf(k);
    i>=0?S.foodEq.splice(i,1):S.foodEq.push(k);save();render();return}
  const dt=t.closest('[data-diet]');
  if(dt){const k=dt.dataset.diet,i=S.diet.indexOf(k);
    i>=0?S.diet.splice(i,1):S.diet.push(k);save();render();return}
  const pv=t.closest('[data-provsec]');
  if(pv){S.provOpen=pv.dataset.provsec;save();render();return}

  const kb=t.closest('[data-kit]');
  if(kb){const k=kb.dataset.kit;
    /* Re-rolls today against the new constraint. Anything already logged stays
       logged — questDone is only cleared when the date rolls over — so nobody
       is punished for switching mid-day, and questBonus stops a second payout. */
    if(k==='custom'){setDayEq('custom',effEq().slice());tab='dayeq';render();return}
    setDayEq(k);
    if(sess()){const o=sess();o.i=0;o.set=1;o.st='brief';o.endAt=0;save()}
    render();return}
  const td=t.closest('[data-toggleday]');
  if(td){const k=td.dataset.toggleday,o=dayEq(),cur=(o&&o.k==='custom'?o.eq:effEq()).slice();
    const i=cur.indexOf(k);i>=0?cur.splice(i,1):cur.push(k);
    setDayEq('custom',cur);render();return}
  if(t.closest('[data-daydone]')){tab=sess()?'kit':'quest';toast('Quest rebuilt for today');render();return}

  const ol=t.closest('[data-oblim]');
  if(ol){const k=ol.dataset.oblim,i=ob.limits.indexOf(k);
    i>=0?ob.limits.splice(i,1):ob.limits.push(k);render();return}
  const tl=t.closest('[data-togglelim]');
  if(tl){const k=tl.dataset.togglelim,i=S.limits.indexOf(k);
    i>=0?S.limits.splice(i,1):S.limits.push(k);save();render();return}
  if(t.closest('[data-editlim]')){tab='limits';render();return}
  if(t.closest('[data-limdone]')){tab='vault';toast('Saved');render();return}
  if(t.closest('[data-editeq]')){tab='eqedit';render();return}
  const te=t.closest('[data-toggleeq]');
  if(te){const k=te.dataset.toggleeq,i=S.eq.indexOf(k);
    i>=0?S.eq.splice(i,1):S.eq.push(k);save();render();return}
  if(t.closest('[data-eqdone]')){tab='vault';save();toast('Kit updated');render();return}
  if(t.closest('[data-reset]')){
    if(!confirm('Wipe your hunter and start over? This cannot be undone.'))return;
    S=fresh();
    ob={step:0,name:'',exp:null,goal:null,eq:[],days:null,limits:[],class:'bladebound',weapon:'longsword',palette:'crimson'};
    save();applyLook();render();return}
});

/* ---------------- boot ---------------- */
(async()=>{
  await load();
  if(S.setup&&S.last){
    const n=daysBetween(S.last,today());
    if(n>gapAllowed()){if(S.potions>0)S.potions--;else S.streak=0;save()}
  }
  if(S.sess&&S.sess.d!==today())S.sess=null;      // yesterday's run does not resume
  if(S.dg&&S.dg.d!==today())S.dg=null;
  checkAch();
  render();
  if(S.refund){const g=S.refund;delete S.refund;save();
    setTimeout(()=>toast('Palettes are free now · '+g+' gold refunded'),700)}
  if(S.setup&&!S.tourSeen)setTimeout(startTour,400);
})();
