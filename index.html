<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>RANK UP</title>
<meta name="description" content="An RPG workout app. Daily quests, ranks, levels, and 155 skills from wall push-ups to power cleans.">
<meta name="theme-color" content="#040C12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RANK UP">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Ascendant">
<meta property="og:description" content="Clear the daily quest. Keep your aura lit. 155 skills, E-rank to A-rank.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2305091B'/><path d='M50 12 L64 34 L64 68 L50 80 L36 68 L36 34 Z' fill='%23FF6FA5'/></svg>">
<style>
/* ============================================================
   RANK UP — the System layer.

   Modelled on Shangri-La Frontier's interface: smoked glass panes with a thin
   luminous cyan perimeter, restrained glow, dividers instead of boxes, tiny
   spaced abbreviations over real labels, and numbers treated as objects rather
   than as text inside sentences.

   Three accents and no more. Cyan is the operating system. Magenta marks
   anything that is locked, new, or a record. Amber is reserved for the single
   number that matters most on a screen — spend it and hierarchy appears.
   ============================================================ */
:root{
  --bg:#040C12; --pane:#071923; --cy:#42E8F5; --cyb:#8AF9FF; --cym:#207D8B;
  --tx:#E6FCFF; --txm:#78A7AE; --mag:#F234A9; --amb:#FFB83E; --dang:#FF4058;
  --ok:#5BE8A0;
  --line:rgba(66,232,245,.22);
  --ease:cubic-bezier(.16,1,.3,1);
  --ui:"Rajdhani","Segoe UI",system-ui,-apple-system,sans-serif;
  /* legacy aliases so anything still reaching for the old names keeps working */
  --void:#040C12; --deep:#071923; --panel:#081B26; --ash:#78A7AE; --ash2:#4E7A88;
  --bone:#E6FCFF; --crimson:#207D8B; --magenta:#42E8F5; --core:#8AF9FF; --gold:#FFB83E;
  --c1:32,125,139; --m1:66,232,245;
  --display:var(--ui); --body:var(--ui); --mono:var(--ui);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{margin:0;background:var(--bg);overscroll-behavior:none}

/* ── the field everything sits in ── */
#atmos{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(70% 38% at 50% 0%,rgba(66,232,245,.11),transparent 64%),
   radial-gradient(110% 55% at 50% 104%,rgba(66,232,245,.07),transparent 70%),var(--bg)}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(66,232,245,.05) 1px,transparent 1px),
   linear-gradient(90deg,rgba(66,232,245,.05) 1px,transparent 1px);background-size:34px 34px;
  -webkit-mask:radial-gradient(92% 58% at 50% 38%,#000,transparent 76%);
  mask:radial-gradient(92% 58% at 50% 38%,#000,transparent 76%)}
#fxc{position:fixed;inset:0;z-index:60;pointer-events:none}
.scanbar{position:fixed;left:0;right:0;height:140px;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(66,232,245,.045),transparent);
  animation:scanmove 7s linear infinite}
@keyframes scanmove{from{top:-150px}to{top:100%}}

#root{position:relative;z-index:3;font-family:var(--ui);color:var(--tx);max-width:520px;
  margin:0 auto;min-height:100vh;min-height:100dvh;font-size:15px;line-height:1.45;
  padding-top:calc(10px + env(safe-area-inset-top));
  padding-right:calc(14px + env(safe-area-inset-right));
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  padding-left:calc(14px + env(safe-area-inset-left))}
.boot{padding:90px 20px;text-align:center;color:var(--cy);letter-spacing:.3em;font-size:12px;
  text-transform:uppercase}

/* ── browser surfaces ── */
::selection{background:rgba(66,232,245,.3);color:#fff}
:root{scrollbar-color:var(--cym) transparent;scrollbar-width:thin;caret-color:var(--cy);
  accent-color:var(--cy)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(66,232,245,.28);border-radius:8px}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
b,strong,input,.tally,.liftv,.xpnum,.sumgrid,.props,.heat{font-variant-numeric:tabular-nums}

/* ── tiny spaced abbreviation, the SLF signature ── */
.ab{font-size:9px;letter-spacing:.42em;color:var(--cym);font-weight:600;line-height:1;
  text-transform:uppercase}

/* ══ HUD: level, name, rank ══ */
.mast{padding:0}
.brandrow{display:none}
.lvlrow{display:flex;align-items:flex-end;gap:11px;padding:0}
.lvlbadge{width:auto;height:auto;flex:0 0 auto;display:block;background:none;clip-path:none}
.lvlbadge::before{content:none}
.lvlbadge span{font-family:var(--ui);font-size:clamp(27px,8vw,34px);font-weight:600;
  color:var(--tx);line-height:.88;text-shadow:none;position:static}
.lvlmeta{flex:1;min-width:0}
.lvlline{display:block;margin:0}
.lvlline b{font-size:clamp(15px,4.4vw,18px);letter-spacing:.16em;font-weight:500;
  text-transform:uppercase;color:var(--tx)}
.xpnum{display:none}
.matline{font-size:11px;color:var(--txm);letter-spacing:.1em;text-transform:uppercase}
.rkbig{font-size:clamp(26px,8vw,34px);font-weight:700;line-height:.88;color:var(--amb);
  text-shadow:0 0 20px rgba(255,184,62,.65)}
.goldchip{display:none}
.coin{display:none}

/* gauges — thin, segment-ticked, never chunky */
.gauges{margin-top:9px}
.g{display:flex;align-items:center;gap:9px;margin-top:4px}
.g u{text-decoration:none;font-size:9.5px;letter-spacing:.22em;color:var(--cym);width:34px;
  font-weight:600}
.g .track{flex:1;height:5px;background:rgba(66,232,245,.09);position:relative;overflow:hidden}
.g .track::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(4,12,18,.9) 11px 13px)}
.g .track i{position:absolute;left:0;top:0;bottom:0;width:0;display:block;
  background:linear-gradient(90deg,var(--cym),var(--cy));box-shadow:0 0 9px rgba(66,232,245,.9);
  transition:width 1.1s var(--ease)}
.g .track i.a{background:linear-gradient(90deg,#9a6a10,var(--amb));
  box-shadow:0 0 9px rgba(255,184,62,.8)}
.g em{font-style:normal;font-size:11px;color:var(--txm);width:38px;text-align:right}
.xpbar{height:5px;background:rgba(66,232,245,.09);overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#9a6a10,var(--amb));
  box-shadow:0 0 9px rgba(255,184,62,.8);transition:clip-path 1.1s var(--ease)}

/* ══ the pane ══ */
.block,.hero{position:relative;margin:13px 0 0;padding:0;border:0;border-radius:0;
  background:rgba(7,25,35,.82);box-shadow:0 0 5px rgba(0,220,255,.3),
   inset 0 0 12px rgba(0,190,255,.05);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  outline:1px solid rgba(66,232,245,.72);outline-offset:-1px}
.block.top{margin-top:calc(6px + env(safe-area-inset-top))}
/* corner ticks, drawn without extra markup */
.block::before,.hero::before{content:"";position:absolute;top:-1px;left:-1px;width:10px;height:10px;
  border:1px solid var(--cyb);border-right:0;border-bottom:0;pointer-events:none;z-index:2}
.block::after,.hero::after{content:"";position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;
  border:1px solid var(--cyb);border-left:0;border-top:0;pointer-events:none;z-index:2}

.blockhead{display:flex;align-items:center;gap:8px;margin:0;padding:8px 12px;
  background:rgba(66,232,245,.13);border-bottom:1px solid rgba(66,232,245,.45)}
.blockhead h2{font-family:var(--ui);font-size:12.5px;letter-spacing:.28em;font-weight:600;
  color:var(--cyb);text-transform:uppercase;margin:0}
.tally{margin-left:auto;font-size:11.5px;letter-spacing:.14em;color:var(--txm);
  display:flex;align-items:center;gap:5px}
/* everything that isn't the header gets the body padding */
.block>*:not(.blockhead){margin-left:13px;margin-right:13px}
.block>*:not(.blockhead):first-child{margin-top:13px}
.block>*:not(.blockhead):last-child{margin-bottom:13px}

.note{font-size:13px;color:var(--txm);line-height:1.6;margin:12px 0 0;max-width:62ch}
.note.big{font-size:14px}
.dgn{font-size:14px;line-height:1.6;color:var(--tx);margin:12px 0}
.dgn b{color:var(--cy);font-weight:600}
.cleared{margin:13px;padding:14px;text-align:center;color:var(--ok);letter-spacing:.24em;
  text-transform:uppercase;font-size:14px;font-weight:600;
  background:rgba(91,232,160,.1);outline:1px solid rgba(91,232,160,.45);outline-offset:-1px}

/* ══ the horizon block — the screen's whole argument ══ */
.big{display:flex;align-items:baseline;gap:10px}
.big b{font-size:clamp(56px,17vw,80px);line-height:.86;font-weight:600;color:var(--tx)}
.big span{font-size:14px;letter-spacing:.3em;color:var(--cy);font-weight:600}
.todayline{margin:16px 0 0}
.todayline b{display:block;font-size:clamp(30px,9vw,42px);font-weight:600;letter-spacing:.08em;
  line-height:1.05;margin-top:2px;text-shadow:0 0 24px rgba(66,232,245,.35)}

/* ══ requirement / list rows — dividers, not boxes ══ */
.req{border-top:1px solid var(--line);margin-top:12px}
.req .r{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:13.5px;
  border-bottom:1px solid rgba(66,232,245,.1)}
.req .r:last-child{border-bottom:0}
.req .r i{width:0;height:0;border-left:6px solid var(--cym);border-top:4px solid transparent;
  border-bottom:4px solid transparent;flex:0 0 6px}
.req .r.ok i{border-left-color:var(--ok);filter:drop-shadow(0 0 5px var(--ok))}
.req .r em{margin-left:auto;font-style:normal;color:var(--txm);font-weight:600}
.req .r.ok em{color:var(--ok)}
.req .r.lock em{color:var(--mag);font-size:10.5px;letter-spacing:.18em}

/* ══ stats ══ */
.props{display:grid;grid-template-columns:1fr 1px 1fr;column-gap:14px;margin:13px}
.props .rule{background:var(--line)}
.prop{padding:9px 0;border-bottom:1px solid rgba(66,232,245,.1);display:flex;align-items:center;
  gap:8px;background:none;text-align:left}
.prop span{display:block;font-size:9px;letter-spacing:.42em;color:var(--cym);font-weight:600}
.prop b{font-family:var(--ui);font-size:clamp(21px,6vw,26px);font-weight:600;line-height:1;
  margin:0;color:var(--tx)}
.prop i{display:none}

/* ══ buttons ══ */
/* inside a pane the body margin already sets the width, so a 100% button
   resolves against the pane and then gets pushed past its own right edge */
.block>.btn,.block>.mini{display:block;width:auto}
.btn{width:100%;padding:clamp(14px,4vw,17px);cursor:pointer;margin-top:12px;border:0;
  font-family:var(--ui);font-size:clamp(14px,4vw,16px);letter-spacing:.34em;font-weight:600;
  text-transform:uppercase;color:#02222b;position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--cyb),#2fc4d6);
  box-shadow:0 0 22px rgba(66,232,245,.45),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .1s var(--ease),box-shadow .2s}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:60px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  animation:gleam 3.8s ease-in-out infinite}
@keyframes gleam{0%,68%{left:-70px}84%,100%{left:112%}}
.btn:active{transform:translateY(2px) scale(.985);box-shadow:0 0 44px rgba(66,232,245,1)}
.btn:disabled{filter:grayscale(.7) brightness(.55);cursor:default;box-shadow:none}
.btn:disabled::after{display:none}
.btn.ghost{background:none;color:var(--txm);box-shadow:inset 0 0 0 1px rgba(66,232,245,.3);
  font-size:12.5px;letter-spacing:.22em;margin-top:8px}
.btn.ghost::after{display:none}
.btn.ghost:hover{color:var(--cyb);box-shadow:inset 0 0 0 1px var(--cy)}
.btn.big{min-height:58px}
.mini{border:0;background:rgba(66,232,245,.07);color:var(--txm);padding:8px 12px;
  font-family:var(--ui);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;cursor:pointer;white-space:nowrap;
  box-shadow:inset 0 0 0 1px rgba(66,232,245,.24);transition:color .18s,background .18s}
.mini:hover:not(:disabled){color:var(--cyb);background:rgba(66,232,245,.16)}
.mini:disabled{opacity:.32;cursor:default}
.mini.on{color:#02222b;background:linear-gradient(180deg,var(--cyb),#2fc4d6)}
.mini.danger{color:#FF8FA8;box-shadow:inset 0 0 0 1px rgba(255,64,88,.4)}

/* ══ tabs ══ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;max-width:520px;margin:0 auto;
  background:linear-gradient(180deg,rgba(4,12,18,.55),rgba(4,12,18,.97) 55%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 -1px 0 rgba(66,232,245,.2);
  padding:10px calc(6px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom))
   calc(6px + env(safe-area-inset-left))}
.tabs button{flex:1;background:none;border:0;cursor:pointer;position:relative;
  font-family:var(--ui);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
  font-weight:600;color:var(--cym);padding:7px 1px;min-height:44px;transition:color .22s}
.tabs button.on{color:var(--cyb);text-shadow:0 0 12px rgba(66,232,245,.9)}
.tabs button::before{content:"▸";position:absolute;left:6px;opacity:0;color:var(--cy);
  transform:translateX(-4px);transition:opacity .22s,transform .22s var(--ease)}
.tabs button.on::before{opacity:1;transform:translateX(0)}
.tabs button.on::after{content:none}

/* ══ library ══ */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:13px}
.filtsum{font-size:11.5px;letter-spacing:.04em;color:var(--cym);text-transform:capitalize;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filterpanel{margin:0 13px 13px;padding:4px 11px 12px;background:rgba(0,0,0,.28);
  box-shadow:inset 0 0 0 1px rgba(66,232,245,.16)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.filters button{background:rgba(66,232,245,.06);border:0;color:var(--txm);font-family:var(--ui);
  font-size:12.5px;padding:7px 12px;cursor:pointer;font-weight:600;letter-spacing:.06em;
  box-shadow:inset 0 0 0 1px rgba(66,232,245,.2);transition:color .18s,background .18s}
.filters button:hover{color:var(--cyb);background:rgba(66,232,245,.14)}
.filters button.on{color:#02222b;background:linear-gradient(180deg,var(--cyb),#2fc4d6)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:13px}
@media(min-width:460px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{border:0;padding:9px;cursor:pointer;position:relative;text-align:left;color:inherit;
  font-family:var(--ui);background:rgba(7,25,35,.72);
  box-shadow:inset 0 0 0 1px rgba(66,232,245,.24);transition:box-shadow .2s,transform .16s var(--ease)}
.card:active{transform:translateY(1px)}
.card:hover{box-shadow:inset 0 0 0 1px var(--cy),0 0 18px -6px rgba(66,232,245,.7)}
.card.locked{opacity:.34}
.card h4{margin:7px 0 0;font-size:13.5px;font-weight:600;line-height:1.2;color:var(--tx)}
.card p{margin:3px 0 0;font-size:11.5px;color:var(--txm)}
.cardmus{margin:3px 0 0;font-size:10.5px;color:var(--cy);opacity:.85;line-height:1.3}
.rk{position:absolute;top:6px;right:6px;font-size:11.5px;font-weight:700;width:19px;height:19px;
  display:grid;place-items:center;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px currentColor}
.rk-E{color:var(--ok)}.rk-D{color:var(--cy)}.rk-C{color:#9B8BFF}.rk-B{color:var(--amb)}
.rk-A{color:var(--mag)}
.gearlab{position:absolute;top:6px;left:6px;font-size:8.5px;letter-spacing:.06em;color:var(--amb);
  background:rgba(0,0,0,.5);padding:2px 5px;text-transform:uppercase;
  box-shadow:inset 0 0 0 1px rgba(255,184,62,.35)}

/* ══ records ══ */
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;
  border-bottom:1px solid rgba(66,232,245,.12)}
.pr:first-of-type{border-top:1px solid var(--line)}
.pr h4{margin:0;font-size:14.5px;font-weight:600}
.pr p{margin:4px 0 0;font-size:12.5px;color:var(--txm)}
.pr p b{font-size:19px;color:var(--amb);font-weight:700}
.prin-wrap{display:flex;gap:7px}
.prin{width:66px;background:rgba(0,0,0,.45);border:0;color:var(--tx);padding:10px;
  text-align:center;font-family:var(--ui);font-size:15px;font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(66,232,245,.28)}
.prin::placeholder{color:var(--cym)}
.prin:focus{outline:none;box-shadow:inset 0 0 0 1px var(--cy),0 0 20px -6px rgba(66,232,245,.9)}
.lift{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;
  border-bottom:1px solid rgba(66,232,245,.1)}
.lift:last-of-type{border-bottom:0}
.liftn h4{margin:0;font-size:13.5px;font-weight:600}
.liftn p{margin:3px 0 0;font-size:11.5px;color:var(--cym)}
.liftv{text-align:right}
.liftv b{display:block;font-size:15.5px;font-weight:600;color:var(--tx)}
.liftv b.up{color:var(--ok)}.liftv b.dn{color:var(--txm)}
.liftv span{display:block;font-size:10.5px;color:var(--cym);margin-top:3px}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:12px 0 0}
.heat i{aspect-ratio:1;display:block;background:rgba(66,232,245,.06);
  box-shadow:inset 0 0 0 1px rgba(66,232,245,.12)}
.heat i.hm1{background:rgba(66,232,245,.26)}
.heat i.hm2{background:rgba(66,232,245,.58);box-shadow:0 0 8px -2px rgba(66,232,245,.8)}
.heat i.hm3{background:var(--cy);box-shadow:0 0 11px -1px var(--cy)}
.heatkey{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;
  color:var(--cym);letter-spacing:.06em}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.ach{padding:11px;opacity:.45;background:rgba(66,232,245,.04);
  box-shadow:inset 0 0 0 1px rgba(66,232,245,.14)}
.ach.on{opacity:1;box-shadow:inset 0 0 0 1px rgba(66,232,245,.4)}
.ach b{display:block;font-size:13px;font-weight:600}
.ach span{display:block;font-size:11.5px;color:var(--txm);margin-top:3px;line-height:1.4}
.ach i{display:block;font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cym);margin-top:7px;font-weight:600}
.ach.on i{color:var(--cy)}
.earned{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mag);padding:2px 6px;
  margin-left:5px;background:rgba(242,52,169,.14);box-shadow:inset 0 0 0 1px rgba(242,52,169,.4)}

/* ══ list items ══ */
.item{display:flex;gap:12px;align-items:center;padding:12px 0;
  border-bottom:1px solid rgba(66,232,245,.1)}
.item:first-of-type{border-top:1px solid var(--line)}
.ico{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;color:var(--cy);
  background:rgba(66,232,245,.08);box-shadow:inset 0 0 0 1px rgba(66,232,245,.24);font-size:14px}
.ico svg{width:18px;height:18px}
.itxt{flex:1;min-width:0}
.itxt h4{margin:0;font-size:14px;font-weight:600}
.itxt p{margin:3px 0 0;font-size:12.5px;color:var(--txm);line-height:1.45}
.wmeta{flex:1;min-width:0}

/* ══ sheets ══ */
.veil{position:fixed;inset:0;background:rgba(2,8,12,.8);z-index:70;display:grid;place-items:end center;
  font-family:var(--ui);color:var(--tx);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  animation:veilin .22s ease-out}
@keyframes veilin{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;position:relative;

<!--
  DIRECTION CONTRACT — seed f4a4c481 · operate

  THESIS: the app is a lit place you step into, not a status window you read.
  It refuses the fitness-app arrangement (metric ring, card list, mint accent)
  and the terminal-readout arrangement the previous look chose.

  OWN-WORLD: HD-2D. Deep navy ground with a lit horizon and bokeh at three
  depths; panels are volumes of tinted air, feathered top and bottom, with one
  hairline catch-light along the top edge. No frames, no ticked corners, no
  scanlines. Pixel-grid artwork is the only hard edge in the app and is never
  anti-aliased. Grenze carries identity, Barlow carries everything readable,
  figures are tabular. Accent is the palette's own light; gold is money only.

  STORY: you open it, the screen tells you what today is and the single thing
  to do about it, and you press one lit control and start training.

  FIRST VIEWPORT: masthead, then the level/XP/gold instrument strip, then the
  hero — a 268px lit volume holding your name, today's plan, the aura tier
  scale, and directly beneath it the one primary action at 64px. Stats and
  everything else sit below the fold.

  FORM: HD-2D, user-pinned from four reference screenshots; candidate 1 of the
  grounded list. Raised by: night-flight instruments (damped motion, glance
  legibility), WPA poster (one imperative per screen), leather studio (real
  depth and a true press state), Ikeda (total palette commitment).

  FINISH: unreviewed and undocumented is unfinished; this build ends with the
  finish review, the verdict, DESIGN.md, and every shipping raster carrying
  its provenance.
-->

{id:'sideknee',strain:['shoulders'],mus:{p:['obliques'],s:['abs','side-delts']},n:'Side Plank (knees)',r:'D',c:'core',st:'CORE',d:'3 × 20s each side',eq:[],
 cues:['On your side, elbow under shoulder, knees bent and stacked.','Lift hips into one line from head to knees.','Top hand on your hip or reaching up.','Hits what the regular plank misses.']},
{id:'climber',strain:['knees','shoulders','wrists'],mus:{p:['abs'],s:['front-delts','quads']},n:'Slow Mountain Climber',r:'D',c:'cardio',st:'AGI',d:'3 × 30s',eq:[],
 cues:['Top of a push-up, hands under shoulders.','Draw one knee to your chest, then switch. Controlled.','Hips stay level — no butt popping up.','Speed it up once form is automatic.']},
{id:'pushup',next:'diamond',strain:['shoulders','wrists'],mus:{p:['chest','triceps'],s:['front-delts','abs']},n:'Full Push-Up',r:'C',c:'push',st:'STR',d:'4 × 6',eq:[],
 cues:['Hands under shoulders, body rigid head to heels.','Lower until your chest is a fist off the floor.','Push the floor away — whole body moves as one plank.','The rep you\'ll measure yourself by for years.']},
{id:'split',next:'db_bulg',strain:['knees','lower-back'],mus:{p:['quads','glutes'],s:['hamstrings']},n:'Split Squat',r:'C',c:'legs',st:'STR',d:'3 × 8 each leg',eq:[],
 cues:['One foot forward, one back, split stance the whole set.','Drop straight down, back knee toward the floor.','Front heel stays glued down.','Harder than it looks. Respect it.']},
{id:'sideplank',next:'hollow',strain:['shoulders'],mus:{p:['obliques'],s:['abs','side-delts','glutes']},n:'Side Plank',r:'C',c:'core',st:'CORE',d:'3 × 30s each side',eq:[],
 cues:['Elbow under shoulder, legs straight and stacked.','Drive the hips up and hold the line.','Don\'t let the top shoulder roll forward.','Struggling? Drop the bottom knee, keep the clock going.']},
{id:'hollow',strain:['knees'],mus:{p:['abs'],s:['quads']},n:'Hollow Hold',r:'C',c:'core',st:'CORE',d:'3 × 20s hold',eq:[],
 cues:['On your back, press your low back flat into the floor.','Lift shoulders and legs a few inches up.','Back lifts off? Legs go higher, or bend the knees.','Gymnasts build their entire core on this.']},
{id:'jack',next:'burpee_s',strain:['knees','shoulders'],mus:{p:['calves'],s:['side-delts','quads']},n:'Jumping Jack',r:'C',c:'cardio',st:'AGI',d:'4 × 40s',eq:[],
 cues:['Arms and legs out, then back in.','Bad knees? Step one foot out at a time instead.','Land soft, toes then heel.','Best 40-second heart-rate spike in the game.']},
{id:'row_table',next:'trx_row',strain:['shoulders'],mus:{p:['midback','lats'],s:['biceps','rear-delts']},nf:1,n:'Table Row',r:'C',c:'pull',st:'STR',d:'3 × 8',eq:[],
 cues:['Lie under a sturdy table, grab the edge, body straight.','Pull your chest to the edge, squeeze the shoulder blades.','Bend the knees to make it easier, straighten to make it harder.','Push-ups alone build a hunchback. Pull something.']},
{id:'superman',strain:['lower-back','shoulders'],mus:{p:['lower-back'],s:['glutes','rear-delts']},n:'Superman Hold',r:'C',c:'pull',st:'VIT',d:'3 × 20s hold',eq:[],
 cues:['Face down, arms out front, legs straight.','Lift arms, chest, and legs at the same time.','Squeeze your glutes, look at the floor.','Balances out everything you do sitting down.']},
{id:'bear',strain:['knees','shoulders','wrists'],mus:{p:['abs'],s:['front-delts','quads']},n:'Bear Crawl Hold',r:'C',c:'core',st:'CORE',d:'3 × 25s hold',eq:[],
 cues:['Hands and knees, hover the knees an inch off the floor.','Flat back — you could balance a cup on it.','Breathe normally while your abs scream.','Add small steps once holding is easy.']},
{id:'diamond',next:'archer',strain:['shoulders','wrists'],mus:{p:['triceps','chest'],s:['front-delts']},n:'Diamond Push-Up',r:'B',c:'push',st:'STR',d:'3 × 6',eq:[],
 cues:['Hands together under your chest, thumbs and fingers making a triangle.','Elbows tucked tight to your ribs.','Lower until your chest touches your hands.','Triceps assassin. Expect the rep count to crater.']},
{id:'pike',strain:['shoulders','wrists'],mus:{p:['front-delts','triceps'],s:['side-delts','traps']},n:'Pike Push-Up',r:'B',c:'push',st:'STR',d:'3 × 6',eq:[],
 cues:['Push-up position, walk the feet in so your hips point at the ceiling.','Lower the top of your head toward the floor between your hands.','This is your overhead press without a barbell.','Feet on a chair makes it brutal.']},
{id:'burpee_s',next:'burpee_f',strain:['knees','shoulders','wrists'],mus:{p:['quads','chest'],s:['abs','front-delts']},n:'Step-Back Burpee',r:'B',c:'cardio',st:'AGI',d:'4 × 8',eq:[],
 cues:['Squat down, hands on the floor, step the feet back one at a time.','Step them in, then stand tall.','No jumping needed — stepping keeps joints happy, heart rate high.','Add the jump only when stepping feels easy.']},
{id:'slbridge',next:'bb_thrust',strain:['knees','lower-back'],mus:{p:['glutes'],s:['hamstrings','lower-back']},n:'Single-Leg Glute Bridge',r:'B',c:'legs',st:'STR',d:'3 × 8 each leg',eq:[],
 cues:['Bridge position, then extend one leg straight out.','Push the planted heel down and lift the hips level.','Don\'t let the free hip drop.','Fixes the strength gap between your left and right side.']},
{id:'archer',strain:['shoulders','wrists'],mus:{p:['chest','triceps'],s:['front-delts','abs','obliques']},n:'Archer Push-Up',r:'A',c:'push',st:'STR',d:'3 × 4 each side',eq:[],
 cues:['Hands wide. Lower toward one hand, the other arm stays straight.','The straight arm is a kickstand, not a pusher.','Push back to center and alternate.','Your gateway to the one-arm push-up.']},
{id:'pistol',strain:['knees','lower-back'],mus:{p:['quads','glutes'],s:['hamstrings','calves','abs']},n:'Assisted Pistol Squat',r:'A',c:'legs',st:'AGI',d:'3 × 4 each leg',eq:[],
 cues:['Hold a doorframe. One leg down, the other straight out front.','Lower under control as deep as you can, then drive up.','Use as much hand assist as you need — reduce it over time.','Balance, mobility, and raw leg strength in one rep.']},
{id:'handstand',strain:['shoulders','wrists'],mus:{p:['front-delts','triceps'],s:['traps','abs']},nf:1,n:'Wall Handstand Hold',r:'A',c:'push',st:'AGI',d:'4 × 20s hold',eq:[],
 cues:['Chest to the wall, walk your feet up slowly.','Arms locked, ribs pulled in, squeeze everything.','Come down before form goes, not after.','Pure showoff move. Earn it.']},
{id:'burpee_f',strain:['knees','shoulders','wrists'],mus:{p:['quads','chest'],s:['abs','front-delts','calves']},n:'Full Burpee',r:'A',c:'cardio',st:'AGI',d:'5 × 10',eq:[],
 cues:['Floor, chest down, jump the feet in, jump up, hands overhead.','Every rep is a full sentence — don\'t half-rep the top.','Pace yourself. Round four is where people fold.','The universal "am I actually in shape" test.']},

/* ================= DUMBBELLS ================= */
{id:'db_curl',strain:['wrists'],sit:1,mus:{p:['biceps'],s:['forearms']},n:'Dumbbell Curl',r:'E',c:'pull',st:'STR',d:'3 × 12',eq:['db'],
 cues:['Stand tall, dumbbells at your sides, palms forward.','Curl up without swinging your body — elbows pinned to your ribs.','Lower over 3 seconds. The lowering is where arms are built.','Lighter and slower beats heavier and swinging.']},
{id:'db_hammer',strain:['wrists'],sit:1,mus:{p:['biceps','forearms'],s:[]},n:'Hammer Curl',r:'E',c:'pull',st:'STR',d:'3 × 12',eq:['db'],
 cues:['Same as a curl but palms face each other the whole way.','Hits the forearm and the thicker part of the bicep.','No swinging. If your back moves, the weight is too heavy.','Pairs well right after regular curls.'],
 hi:'arms'},
{id:'db_goblet',strain:['knees','shoulders'],mus:{p:['quads','glutes'],s:['abs','front-delts']},n:'Goblet Squat',r:'D',c:'legs',st:'STR',d:'3 × 10',eq:['db'],
 cues:['Hold one dumbbell vertically against your chest like a goblet.','Squat down between your knees, elbows inside your thighs.','The weight up front keeps your chest from dumping forward.','Best squat for learning depth safely.']},
{id:'db_row',strain:['lower-back','shoulders'],mus:{p:['lats','midback'],s:['biceps','rear-delts']},n:'One-Arm Dumbbell Row',r:'D',c:'pull',st:'STR',d:'3 × 10 each arm',eq:['db'],
 cues:['One hand and knee on a bench, other foot planted, back flat.','Pull the dumbbell to your hip, leading with the elbow.','Squeeze the shoulder blade at the top, lower it all the way.','Don\'t twist your torso to move more weight.']},
{id:'db_floor',strain:['shoulders'],sit:1,mus:{p:['chest','triceps'],s:['front-delts']},n:'Dumbbell Floor Press',r:'D',c:'push',st:'STR',d:'3 × 10',eq:['db'],
 cues:['On your back, knees bent, dumbbells over your chest.','Lower until your triceps touch the floor, then press up.','The floor stops you before your shoulders get cranky.','No bench needed. Great hotel-room chest work.']},
{id:'db_lat',strain:['shoulders'],sit:1,mus:{p:['side-delts'],s:['traps']},n:'Lateral Raise',r:'D',c:'push',st:'STR',d:'3 × 15',eq:['db'],
 cues:['Light weight. Seriously, lighter than you think.','Raise the dumbbells out to the sides to shoulder height.','Slight bend in the elbows, lead with the elbows not the hands.','This is what builds the round-shoulder look.']},
{id:'db_press',strain:['shoulders'],sit:1,mus:{p:['front-delts','triceps'],s:['side-delts','traps']},n:'Dumbbell Shoulder Press',r:'C',c:'push',st:'STR',d:'3 × 8',eq:['db'],
 cues:['Dumbbells at shoulder height, palms forward.','Press straight overhead until your arms lock out.','Don\'t arch your lower back — squeeze your glutes and abs.','Standing works your whole body. Seated is stricter.']},
{id:'db_bench',strain:['shoulders'],sit:1,mus:{p:['chest'],s:['triceps','front-delts']},n:'Dumbbell Bench Press',r:'C',c:'push',st:'STR',d:'4 × 8',eq:['db','bench'],pp:'bench',
 cues:['Lie back, dumbbells over your chest, feet flat on the floor.','Lower until you feel a stretch across your chest — not deeper.','Press up and slightly together at the top.','Dumbbells beat the barbell for most people\'s shoulders.']},
{id:'db_fly',strain:['shoulders'],sit:1,mus:{p:['chest'],s:['front-delts']},n:'Dumbbell Chest Fly',r:'C',c:'push',st:'STR',d:'3 × 12',eq:['db','bench'],pp:'bench',
 cues:['Lie back, arms above your chest with a soft elbow bend.','Open your arms wide like a hug in reverse, then bring them back together.','Go light. This is a stretch move, not an ego move.','Stop when your upper arms are level with your chest.']},
{id:'db_rdl',next:'bb_rdl',strain:['knees','lower-back','wrists'],mus:{p:['hamstrings','glutes'],s:['lower-back','forearms']},n:'Dumbbell Romanian Deadlift',r:'C',c:'legs',st:'STR',d:'3 × 10',eq:['db'],
 cues:['Dumbbells in front of your thighs, soft knees.','Push your hips straight back, letting the weights slide down your legs.','Stop when you feel the hamstring stretch — back stays flat.','Stand up by squeezing your glutes, not by yanking with your back.']},
{id:'db_lunge',strain:['knees','lower-back','wrists'],mus:{p:['quads','glutes'],s:['hamstrings','forearms']},n:'Dumbbell Lunge',r:'C',c:'legs',st:'STR',d:'3 × 8 each leg',eq:['db'],
 cues:['A dumbbell in each hand, arms just hanging.','Step back and drop the back knee toward the floor.','Torso stays upright, front shin vertical.','Grip usually fails before the legs do. That\'s fine, it\'s training too.']},
{id:'db_tri',sit:1,mus:{p:['triceps'],s:[]},n:'Overhead Triceps Extension',r:'C',c:'push',st:'STR',d:'3 × 12',eq:['db'],
 cues:['One dumbbell held with both hands, straight overhead.','Bend only at the elbows and lower it behind your head.','Elbows stay pointing forward, close to your ears.','Slow and controlled. This joint doesn\'t like sloppy.']},
{id:'db_carry',strain:['lower-back','wrists'],mus:{p:['forearms','traps'],s:['abs','obliques']},n:'Farmer Carry',r:'D',c:'full',st:'END',d:'4 × 40 steps',eq:['db'],
 cues:['Heavy weight in each hand. Stand tall and walk.','Shoulders back, ribs down, don\'t lean to one side.','Walk until your grip is nearly done, then set them down safely.','Stupidly simple and it builds everything.']},
{id:'db_thruster',strain:['knees','shoulders'],mus:{p:['quads','front-delts'],s:['glutes','triceps']},n:'Dumbbell Thruster',r:'B',c:'full',st:'END',d:'4 × 10',eq:['db'],
 cues:['Dumbbells at your shoulders. Squat down.','Drive up out of the squat and press overhead in one motion.','Legs do the work, arms just finish it.','Fastest way to make yourself hate a 10-rep set.']},
{id:'db_bulg',next:'pistol',strain:['knees','lower-back'],mus:{p:['quads','glutes'],s:['hamstrings']},n:'Bulgarian Split Squat',r:'B',c:'legs',st:'STR',d:'3 × 8 each leg',eq:['db','bench'],
 cues:['Back foot up on a bench, front foot two feet out.','Drop straight down, torso slightly forward.','Front heel stays down the entire rep.','One of the hardest things you can do with two dumbbells.']},

/* ================= KETTLEBELL ================= */
{id:'kb_halo',strain:['shoulders'],mus:{p:['side-delts','rear-delts'],s:['traps','abs']},n:'Kettlebell Halo',r:'D',c:'push',st:'AGI',d:'3 × 8 each way',eq:['kb'],
 cues:['Hold the bell upside down by the horns at chest height.','Circle it around your head, staying close.','Ribs stay down, no leaning back.','Best shoulder warm-up before any pressing.']},
{id:'kb_swing',next:'kb_cp',strain:['lower-back','wrists'],mus:{p:['glutes','hamstrings'],s:['lower-back','forearms']},n:'Kettlebell Swing',r:'C',c:'full',st:'END',d:'5 × 15',eq:['kb'],
 cues:['This is a hip snap, not a squat and not a front raise.','Hike the bell back between your legs, then snap your hips forward.','The bell floats to chest height on its own. Arms are ropes.','Squeeze your glutes hard at the top and stand fully upright.']},
{id:'kb_cp',next:'kb_snatch',strain:['knees','shoulders','wrists'],mus:{p:['front-delts','quads'],s:['traps','forearms','glutes']},n:'Kettlebell Clean & Press',r:'B',c:'full',st:'STR',d:'4 × 6 each arm',eq:['kb'],
 cues:['Swing the bell up and catch it in the rack position at your shoulder.','Catch it soft — it shouldn\'t bang your forearm.','From the rack, press it straight overhead.','Learn the clean before you add the press.']},
{id:'kb_tgu',strain:['knees','shoulders'],mus:{p:['abs','obliques'],s:['front-delts','glutes','quads']},n:'Turkish Get-Up',r:'A',c:'full',st:'CORE',d:'3 × 3 each side',eq:['kb'],
 cues:['Start lying down with the bell locked out over your shoulder.','Stand up one deliberate step at a time, eyes on the bell.','Then reverse it back down the exact same way.','Practice with a shoe on your fist before you use weight.']},

/* ================= BARBELL ================= */
{id:'bb_squat',strain:['knees','lower-back'],mus:{p:['quads','glutes'],s:['hamstrings','lower-back','abs']},n:'Barbell Back Squat',r:'B',c:'legs',st:'STR',d:'4 × 6',eq:['bb'],
 cues:['Bar on your upper back, not your neck. Grip it hard.','Big breath, brace, then sit down between your hips.','Knees track over your toes, chest stays up.','Use a rack with safety bars. Always.']},
{id:'bb_dl',strain:['lower-back','shoulders','wrists'],mus:{p:['hamstrings','glutes','lower-back'],s:['traps','forearms','lats']},n:'Barbell Deadlift',r:'B',c:'pull',st:'STR',d:'4 × 5',eq:['bb'],
 cues:['Bar over mid-foot, shins nearly touching it.','Flat back, chest up, take the slack out before you pull.','Push the floor away and drag the bar up your legs.','If your back rounds, the set is over. No hero reps.']},
{id:'bb_bench',strain:['shoulders'],mus:{p:['chest'],s:['triceps','front-delts']},n:'Barbell Bench Press',r:'B',c:'push',st:'STR',d:'4 × 6',eq:['bb','bench'],pp:'bench',
 cues:['Feet flat, shoulder blades pinched together and pulled down.','Lower the bar to your lower chest with control.','Elbows around 45° from your body, not flared out wide.','Use a spotter or safety arms. Every single time.']},
{id:'bb_ohp',strain:['shoulders'],mus:{p:['front-delts','triceps'],s:['side-delts','traps','abs']},n:'Overhead Press',r:'B',c:'push',st:'STR',d:'4 × 6',eq:['bb'],
 cues:['Bar on your front shoulders, hands just outside them.','Squeeze your glutes, press up, move your head back out of the way.','Finish with the bar over the middle of your feet, not in front.','The most honest lift there is. Nothing to hide behind.']},
{id:'bb_row',strain:['lower-back','shoulders'],mus:{p:['lats','midback'],s:['biceps','rear-delts','lower-back']},n:'Bent-Over Row',r:'B',c:'pull',st:'STR',d:'4 × 8',eq:['bb'],
 cues:['Hinge until your torso is around 45°, back flat.','Pull the bar to your belly button, elbows driving back.','Lower it under control — no dropping and bouncing.','Balances out all your pressing.']},
{id:'bb_thrust',strain:['knees','lower-back'],mus:{p:['glutes'],s:['hamstrings','quads']},n:'Barbell Hip Thrust',r:'C',c:'legs',st:'STR',d:'4 × 10',eq:['bb','bench'],pp:'bench',
 cues:['Upper back on a bench, bar across your hips (use a pad).','Drive through your heels and lift until your body is a tabletop.','Squeeze your glutes hard at the top, chin tucked.','The single best glute builder that exists.']},
{id:'bb_front',strain:['knees','shoulders'],mus:{p:['quads'],s:['glutes','abs','front-delts']},n:'Front Squat',r:'A',c:'legs',st:'STR',d:'4 × 5',eq:['bb'],
 cues:['Bar racked on your front delts, elbows high the whole time.','Elbows drop, you drop the bar. Keep them up.','Stay upright and squat straight down.','Punishes any weakness in your upper back.']},
{id:'bb_clean',strain:['knees','lower-back','wrists'],mus:{p:['quads','traps'],s:['hamstrings','glutes','forearms']},n:'Power Clean',r:'A',c:'full',st:'AGI',d:'5 × 3',eq:['bb'],
 cues:['Deadlift speed off the floor, then explode with the hips.','Shrug hard and pull yourself under the bar.','Catch it on your front shoulders in a quarter squat.','Get coached on this one. Video yourself at minimum.']},

/* ================= PULL-UP BAR ================= */
{id:'hang',next:'kneeraise',strain:['shoulders','wrists'],mus:{p:['forearms'],s:['lats','traps']},n:'Dead Hang',r:'D',c:'pull',st:'END',d:'4 × 25s',eq:['bar'],
 cues:['Just hang from the bar with straight arms.','Relax and let your shoulders decompress.','Builds the grip you\'ll need for everything else.','Accumulate two minutes total. However you split it.']},
{id:'kneeraise',next:'chinup',strain:['shoulders','wrists'],mus:{p:['abs'],s:['forearms','lats']},n:'Hanging Knee Raise',r:'C',c:'core',st:'CORE',d:'3 × 10',eq:['bar'],
 cues:['Hang from the bar, no swinging.','Pull your knees up toward your chest using your abs.','Lower slowly. If you swing, you\'re using momentum.','Straighten the legs to level it up.']},
{id:'chinup',next:'ttb',strain:['shoulders','wrists'],mus:{p:['lats','biceps'],s:['midback','forearms']},n:'Chin-Up / Pull-Up',r:'B',c:'pull',st:'STR',d:'4 × 3-6',eq:['bar'],
 cues:['Can\'t do one? Jump to the top and lower as slowly as possible.','From a dead hang, pull your chest toward the bar.','Shoulder blades pull down before the arms bend.','Five slow negatives a day and one day the real rep shows up.']},
{id:'ttb',strain:['shoulders','wrists'],mus:{p:['abs'],s:['lats','forearms','obliques']},n:'Toes to Bar',r:'A',c:'core',st:'CORE',d:'4 × 6',eq:['bar'],
 cues:['Hang, then bring your straight legs all the way to the bar.','Push down on the bar with straight arms to help.','Control the way down — that\'s the hard half.','Knee raises first. This is the boss version.']},

/* ================= BANDS ================= */
{id:'band_pull',strain:['shoulders'],sit:1,mus:{p:['rear-delts'],s:['midback','traps']},n:'Band Pull-Apart',r:'E',c:'pull',st:'VIT',d:'3 × 15',eq:['band'],
 cues:['Hold a band in front of you at chest height, arms straight.','Pull it apart until it touches your chest, squeezing your shoulder blades.','Slow on the way back. Don\'t let it snap you.','Do these before every push workout. Your shoulders will thank you.']},
{id:'band_row',next:'row_table',strain:['shoulders'],sit:1,mus:{p:['midback','lats'],s:['biceps','rear-delts']},n:'Band Row',r:'D',c:'pull',st:'STR',d:'3 × 15',eq:['band'],
 cues:['Anchor the band at chest height — a door, a pole, whatever holds.','Pull the handles to your ribs, elbows driving back.','Squeeze for a second, then let it back out slowly.','Pack a band in your bag. Instant back workout anywhere.']},
{id:'band_face',strain:['shoulders'],sit:1,mus:{p:['rear-delts','traps'],s:['midback']},n:'Face Pull',r:'D',c:'pull',st:'VIT',d:'3 × 15',eq:['band'],
 cues:['Anchor high. Pull the band toward your forehead.','Hands finish beside your ears, elbows high and wide.','Think about pulling the band apart as you pull it in.','The best posture-fixing exercise there is.']},

/* ================= MACHINES / GYM ================= */
{id:'lat_pull',strain:['shoulders'],sit:1,mus:{p:['lats'],s:['biceps','midback']},n:'Lat Pulldown',r:'D',c:'pull',st:'STR',d:'4 × 10',eq:['machine'],
 cues:['Wide grip, chest up, slight lean back.','Pull the bar to your upper chest, elbows driving down.','Don\'t yank with your whole body. The lats do the work.','The training-wheels version of a pull-up. Use it.']},
{id:'cable_row',strain:['shoulders'],sit:1,mus:{p:['midback','lats'],s:['biceps','rear-delts']},n:'Seated Cable Row',r:'D',c:'pull',st:'STR',d:'4 × 10',eq:['machine'],
 cues:['Sit tall, slight knee bend, chest proud.','Pull the handle to your belly button, elbows past your ribs.','Let it stretch your back on the way out, but don\'t slump.','Squeeze your shoulder blades like you\'re holding a pencil between them.']},
{id:'legpress',strain:['knees'],mus:{p:['quads','glutes'],s:['hamstrings']},n:'Leg Press',r:'C',c:'legs',st:'STR',d:'4 × 10',eq:['machine'],
 cues:['Feet shoulder width on the platform, whole foot in contact.','Lower until your knees are around 90° — deeper if your back stays flat.','Never lock your knees hard at the top.','Don\'t let your lower back peel off the pad. That\'s the danger point.']},
{id:'treadmill',strain:['knees'],mus:{p:['quads','calves'],s:['glutes','hamstrings']},n:'Incline Treadmill Walk',r:'E',c:'cardio',st:'END',d:'20 min',eq:['machine'],
 cues:['Steep incline, slow speed. Brutal without the joint pounding.','Don\'t hang off the handrails — it deletes most of the work.','You should be able to talk but not sing.','The most underrated cardio in any gym.'],
 hi:'legs'},
{id:'rowerg',strain:['knees','lower-back','shoulders'],sit:1,mus:{p:['lats','quads'],s:['midback','biceps','lower-back']},n:'Rowing Machine',r:'C',c:'cardio',st:'END',d:'5 × 3 min',eq:['machine'],
 cues:['Legs, then back, then arms. Reverse it on the way in.','Most of the power comes from your legs, not your arms.','Long strokes beat frantic short ones.','500m intervals with a minute rest is a great starting workout.']},
/* ================= MACHINES & CABLES ================= */
{id:'mch_chest',sit:1,n:'Machine Chest Press',r:'E',c:'push',st:'STR',d:'3 × 10',eq:['machine'],
 mus:{p:['chest','triceps'],s:['front-delts']},
 cues:['Set the seat so the handles line up with the middle of your chest.','Press out until your arms are straight but not locked hard.','Let it come back slowly until you feel a stretch across the chest.','The machine holds the path for you, so you can push hard while you learn.']},
{id:'mch_incline',strain:['shoulders'],sit:1,n:'Incline Machine Press',r:'D',c:'push',st:'STR',d:'3 × 10',eq:['machine'],
 mus:{p:['chest','front-delts'],s:['triceps']},
 cues:['Handles start level with your collarbone, not your chin.','Press up and slightly in, following the machine\'s track.','Keep your shoulders pinned back against the pad the whole set.','Hits the upper chest, which most people under-train.']},
{id:'mch_shoulder',strain:['shoulders'],sit:1,n:'Machine Shoulder Press',r:'D',c:'push',st:'STR',d:'3 × 10',eq:['machine'],
 mus:{p:['front-delts','triceps'],s:['side-delts','traps']},
 cues:['Seat height so the handles sit just above your shoulders.','Press up without shrugging your ears toward your hands.','Stop just short of locking out and come straight back down.','Overhead work with a backrest is the safest way to start pressing.']},
{id:'mch_pecdeck',strain:['shoulders'],sit:1,n:'Pec Deck',r:'E',c:'push',st:'STR',d:'3 × 12',eq:['machine'],
 mus:{p:['chest'],s:['front-delts']},
 cues:['Forearms flat on the pads, elbows at chest height.','Bring the pads together in front of you, slowly.','Stop opening when you feel a stretch, not a pull.','A chest exercise with no balance demand at all.']},
{id:'mch_row',sit:1,n:'Chest-Supported Row',r:'E',c:'pull',st:'STR',d:'3 × 10',eq:['machine'],
 mus:{p:['midback','lats'],s:['biceps','rear-delts']},
 cues:['Chest stays on the pad from the first rep to the last.','Pull the handles to your ribs and squeeze the shoulder blades.','Let the weight stretch your back out before the next rep.','The pad takes your lower back out of it entirely.']},
{id:'mch_legcurl',sit:1,n:'Seated Leg Curl',r:'E',c:'legs',st:'STR',d:'3 × 12',eq:['machine'],
 mus:{p:['hamstrings'],s:['calves']},
 cues:['Pad sits just above your heels, knees lined up with the pivot.','Curl your heels under you and pause for a second.','Return slowly — that is where hamstrings actually grow.','Almost nothing else in a gym trains hamstrings directly.']},
{id:'mch_legext',strain:['knees'],sit:1,n:'Leg Extension',r:'E',c:'legs',st:'STR',d:'3 × 12',eq:['machine'],
 mus:{p:['quads'],s:[]},
 cues:['Knees at the pivot point, pad low on the shins.','Straighten your legs and hold the top for a beat.','Lower under control instead of letting the stack drop.','Sore knees? Use a shorter range near the top rather than skipping it.']},
{id:'mch_abduct',sit:1,n:'Hip Abduction Machine',r:'E',c:'legs',st:'STR',d:'3 × 15',eq:['machine'],
 mus:{p:['glutes'],s:[]},
 cues:['Sit tall, pads on the outside of your knees.','Push your knees apart and hold the end position briefly.','Come back slowly rather than letting them snap shut.','Trains the side of the glute, which keeps knees tracking properly.']},
{id:'mch_adduct',sit:1,n:'Hip Adduction Machine',r:'E',c:'legs',st:'STR',d:'3 × 15',eq:['machine'],
 mus:{p:['quads'],s:['glutes']},
 cues:['Pads on the inside of your knees, sit upright.','Squeeze your knees together and pause.','Open slowly and only as far as is comfortable.','The inner thigh is a common weak link in squats and lunges.']},
{id:'mch_calf',sit:1,n:'Seated Calf Raise',r:'E',c:'legs',st:'END',d:'3 × 15',eq:['machine'],
 mus:{p:['calves'],s:[]},
 cues:['Pad across the lower thigh, balls of the feet on the platform.','Push up as high as you can go and hold at the top.','Lower until you feel a stretch, over three seconds.','Bent knees hit the deeper calf muscle that standing raises miss.']},
{id:'mch_hack',strain:['knees'],n:'Hack Squat',r:'C',c:'legs',st:'STR',d:'4 × 8',eq:['machine'],
 mus:{p:['quads','glutes'],s:['hamstrings']},
 cues:['Feet mid-platform, shoulder width, back flat on the pad.','Drop until your thighs are about parallel, deeper if it stays comfortable.','Drive through the whole foot, not just the toes.','Heavy leg work without needing to balance a bar.']},
{id:'mch_assist',strain:['shoulders','wrists'],n:'Assisted Pull-Up',r:'E',c:'pull',st:'STR',d:'3 × 8',eq:['machine'],
 mus:{p:['lats','biceps'],s:['midback','forearms']},
 cues:['More counterweight makes it easier, not harder — start generous.','Pull your chest toward the bar and lead with the elbows.','Lower all the way down until the arms are straight.','The honest path to a real pull-up. Drop the assistance a plate at a time.']},
{id:'mch_crunch',sit:1,n:'Ab Crunch Machine',r:'E',c:'core',st:'CORE',d:'3 × 12',eq:['machine'],
 mus:{p:['abs'],s:['obliques']},
 cues:['Grip the handles and curl your ribs toward your hips.','It is a short movement — you are rounding, not bending at the hips.','Come back slowly and stop before your back arches.','Lets you add weight to ab work, which planks cannot.']},
{id:'mch_hipthrust',strain:['knees'],n:'Hip Thrust Machine',r:'D',c:'legs',st:'STR',d:'3 × 10',eq:['machine'],
 mus:{p:['glutes'],s:['hamstrings','quads']},
 cues:['Pad across the hips, feet flat and about shoulder width.','Drive through your heels until your hips are level with your knees.','Squeeze hard at the top for a full second, then lower under control.','The most direct glute exercise in the building.']},
{id:'mch_shrug',strain:['wrists'],sit:1,n:'Machine Shrug',r:'E',c:'pull',st:'STR',d:'3 × 12',eq:['machine'],
 mus:{p:['traps'],s:['forearms']},
 cues:['Stand tall, arms straight, grip the handles.','Lift your shoulders straight up toward your ears.','No rolling — shoulders go up and down, not around.','Straight up beats heavy and half-moving every time.']},
{id:'cbl_pushdown',sit:1,n:'Triceps Pushdown',r:'E',c:'push',st:'STR',d:'3 × 12',eq:['cable'],
 mus:{p:['triceps'],s:[]},
 cues:['Cable set high, elbows pinned to your sides.','Straighten your arms without letting the elbows drift forward.','Let it come back up until you feel the stretch, then go again.','If your body is swinging, the weight is doing the choosing.']},
{id:'cbl_ohtri',sit:1,n:'Overhead Cable Extension',r:'D',c:'push',st:'STR',d:'3 × 12',eq:['cable'],
 mus:{p:['triceps'],s:[]},
 cues:['Face away from the stack, rope overhead, elbows beside your ears.','Straighten your arms forward and up.','Keep the upper arms still — only the forearms move.','The overhead angle hits the long head that pushdowns miss.']},
{id:'cbl_curl',strain:['wrists'],sit:1,n:'Cable Curl',r:'E',c:'pull',st:'STR',d:'3 × 12',eq:['cable'],
 mus:{p:['biceps'],s:['forearms']},
 cues:['Cable low, elbows at your sides, stand a step back from the stack.','Curl up without letting your elbows travel forward.','Lower slowly all the way to straight arms.','The cable keeps tension on at the bottom, where dumbbells go slack.']},
{id:'cbl_lat',strain:['shoulders'],n:'Cable Lateral Raise',r:'D',c:'push',st:'STR',d:'3 × 12 each arm',eq:['cable'],
 mus:{p:['side-delts'],s:['traps']},
 cues:['Cable low, handle in the far hand, stand side-on.','Raise your arm out to shoulder height, elbow slightly soft.','Lower over three seconds. Light weight, this one is not a lift.','Builds the width of the shoulder rather than the front of it.']},
{id:'cbl_face',strain:['shoulders'],sit:1,n:'Cable Face Pull',r:'E',c:'pull',st:'VIT',d:'3 × 15',eq:['cable'],
 mus:{p:['rear-delts','traps'],s:['midback']},
 cues:['Rope at face height, pull it toward your forehead.','Split the rope apart as you pull and lead with the elbows.','High and wide — this is not a row to the chest.','The best single antidote to a day spent at a desk.']},
{id:'cbl_flyhigh',strain:['shoulders'],n:'High Cable Fly',r:'D',c:'push',st:'STR',d:'3 × 12',eq:['cable'],
 mus:{p:['chest'],s:['front-delts']},
 cues:['Both cables set high, step forward into a split stance.','Bring your hands down and together in front of your hips.','Slight bend in the elbows, held the whole way.','Hits the lower chest that flat pressing under-serves.']},
{id:'cbl_flylow',strain:['shoulders'],n:'Low Cable Fly',r:'D',c:'push',st:'STR',d:'3 × 12',eq:['cable'],
 mus:{p:['chest'],s:['front-delts']},
 cues:['Cables low, palms facing forward, step out into a split stance.','Sweep your hands up and together to chest height.','Control the way back — do not let the stack pull you open.','The upward angle catches the upper chest.']},
{id:'cbl_crossover',strain:['shoulders'],n:'Cable Crossover',r:'C',c:'push',st:'STR',d:'3 × 12',eq:['cable'],
 mus:{p:['chest'],s:['front-delts','abs']},
 cues:['Cables at shoulder height, one foot forward for balance.','Bring the handles together and let them cross slightly.','Keep the elbow angle fixed — you are hugging, not pressing.','The crossing at the end squeezes the chest harder than a fly.']},
{id:'cbl_straight',strain:['shoulders'],sit:1,n:'Straight-Arm Pulldown',r:'D',c:'pull',st:'STR',d:'3 × 12',eq:['cable'],
 mus:{p:['lats'],s:['abs','triceps']},
 cues:['Bar set high, arms straight, hinge forward slightly.','Pull the bar down to your thighs with the arms locked out.','Feel it in the side of your back, not the triceps.','Teaches you where your lats are, which makes every row better.']},
{id:'cbl_pullthrough',strain:['knees','lower-back'],n:'Cable Pull-Through',r:'D',c:'legs',st:'STR',d:'3 × 12',eq:['cable'],
 mus:{p:['glutes','hamstrings'],s:['lower-back']},
 cues:['Face away from a low cable, rope between your legs.','Push your hips back with a flat back, then snap them forward.','Stand tall and squeeze — do not lean back past straight.','A hip hinge you can learn safely before you touch a barbell.']},
{id:'cbl_woodchop',strain:['shoulders'],n:'Cable Woodchop',r:'C',c:'core',st:'CORE',d:'3 × 10 each side',eq:['cable'],
 mus:{p:['obliques','abs'],s:['side-delts']},
 cues:['Stand side-on, cable high, arms straight.','Pull down and across to the opposite hip, pivoting the back foot.','Turn through the ribs, not by yanking with the arms.','Trains the twist your core actually does outside the gym.']},
{id:'cbl_pallof',strain:['shoulders'],n:'Pallof Press',r:'D',c:'core',st:'CORE',d:'3 × 10 each side',eq:['cable'],
 mus:{p:['obliques','abs'],s:['front-delts']},
 cues:['Stand side-on to a chest-height cable, handle at your sternum.','Press it straight out and refuse to let it twist you.','Hold for two seconds at full stretch, then bring it back in.','You are resisting rotation, which is most of what a core is for.']},
{id:'cbl_kick',strain:['knees','lower-back'],n:'Cable Glute Kickback',r:'E',c:'legs',st:'STR',d:'3 × 12 each leg',eq:['cable'],
 mus:{p:['glutes'],s:['hamstrings']},
 cues:['Ankle strap on, face the stack, hold on for balance.','Drive the leg straight back and squeeze at the end.','Keep the low back still — the movement is at the hip.','One leg at a time finds the side that has been coasting.']},
/* ================= LEGS: FREE WEIGHTS ================= */
{id:'db_calf',next:'mch_calf',strain:['knees'],n:'Standing Calf Raise',r:'E',c:'legs',st:'END',d:'3 × 15',eq:['db'],
 mus:{p:['calves'],s:[]},
 cues:['A dumbbell in one hand, the other on a wall for balance.','Rise onto the balls of your feet as high as you can.','Lower over three seconds until you feel the stretch.','Straight legs hit the big calf muscle the seated version misses.']},
{id:'db_walklunge',strain:['knees','lower-back'],n:'Walking Lunge',r:'D',c:'legs',st:'STR',d:'3 × 10 each leg',eq:['db'],
 mus:{p:['quads','glutes'],s:['hamstrings','calves']},
 cues:['Dumbbells at your sides, step forward into a lunge.','Drop the back knee toward the floor, front shin vertical.','Push through the front heel and step straight into the next one.','Moving forward makes balance part of the work.']},
{id:'db_stepup',strain:['knees','lower-back'],n:'Weighted Step-Up',r:'D',c:'legs',st:'STR',d:'3 × 8 each leg',eq:['db','bench'],
 mus:{p:['quads','glutes'],s:['hamstrings','calves']},
 cues:['Box or bench at about knee height, a dumbbell in each hand.','Plant the whole foot and drive up through that heel.','Lower yourself down slowly instead of dropping off.','Do not push off the bottom foot — the top leg does the work.']},
{id:'db_latstep',strain:['knees','lower-back'],n:'Lateral Step-Up',r:'D',c:'legs',st:'AGI',d:'3 × 8 each leg',eq:['db','bench'],
 mus:{p:['glutes','quads'],s:['hamstrings']},
 cues:['Stand side-on to the box, step up sideways onto the near foot.','Keep your chest up and the knee tracking over the foot.','Control the way back down. Wobbling means go lower.','Sideways loading is almost absent from most training.']},
{id:'db_curtsy',strain:['knees','lower-back'],n:'Curtsy Lunge',r:'D',c:'legs',st:'AGI',d:'3 × 10 each leg',eq:['db'],
 mus:{p:['glutes','quads'],s:['hamstrings']},
 cues:['Step one foot back and across behind the other.','Drop straight down, keeping the front knee over the front foot.','Stand back up through the front heel.','The crossing angle catches the side of the glute.']},
{id:'db_sumo',strain:['knees','lower-back'],n:'Dumbbell Sumo Squat',r:'D',c:'legs',st:'STR',d:'3 × 12',eq:['db'],
 mus:{p:['quads','glutes'],s:['hamstrings']},
 cues:['Wide stance, toes turned out, one dumbbell held between your legs.','Sit straight down between your feet, chest tall.','Push the floor apart with your feet as you stand.','The wide stance reaches the inner thigh a normal squat skips.']},
{id:'db_singlerdl',strain:['knees','lower-back'],n:'Single-Leg Romanian Deadlift',r:'C',c:'legs',st:'AGI',d:'3 × 8 each leg',eq:['db'],
 mus:{p:['hamstrings','glutes'],s:['lower-back']},
 cues:['One dumbbell, stand on one leg with a soft knee.','Hinge at the hip and let the free leg travel back as a counterweight.','Back flat throughout. Stop when the hamstring says so.','Balance work and hamstring work in the same exercise.']},
{id:'bb_sumo',strain:['knees','lower-back','wrists'],n:'Sumo Deadlift',r:'B',c:'pull',st:'STR',d:'4 × 5',eq:['bb'],
 mus:{p:['glutes','quads','hamstrings'],s:['lower-back','traps','forearms']},
 cues:['Wide stance, hands inside the knees, shins close to the bar.','Chest up and hips down before anything moves. Take the slack out first.','Push the floor away and stand — do not yank it off the ground.','Kinder to the lower back than a conventional pull for most builds.']},
{id:'bb_frontlunge',strain:['knees','shoulders'],n:'Front-Rack Lunge',r:'B',c:'legs',st:'STR',d:'3 × 6 each leg',eq:['bb'],
 mus:{p:['quads','glutes'],s:['abs','front-delts']},
 cues:['Bar across the front of your shoulders, elbows high.','Step back into a lunge and drop the back knee.','If the elbows drop, the bar rolls forward. Reset before the next rep.','The front rack forces an upright torso, so the legs cannot cheat.']},
{id:'bb_goodmorning',strain:['lower-back'],n:'Good Morning',r:'B',c:'pull',st:'STR',d:'3 × 8',eq:['bb'],
 mus:{p:['hamstrings','lower-back'],s:['glutes']},
 cues:['Light bar on your upper back, soft knees.','Push your hips back and let your chest travel toward the floor.','Stop the moment your back would round. That point is the whole exercise.','Start far lighter than you think. This one punishes ego.']},
{id:'bb_split',strain:['knees','lower-back'],n:'Barbell Split Squat',r:'C',c:'legs',st:'STR',d:'3 × 8 each leg',eq:['bb'],
 mus:{p:['quads','glutes'],s:['hamstrings','abs']},
 cues:['Bar on your back, one foot forward and one back.','Drop straight down until the back knee is near the floor.','Front heel stays planted the whole set.','Loads one leg heavily without needing the balance of a lunge.']},
{id:'tb_dl',strain:['knees','lower-back','wrists'],n:'Trap Bar Deadlift',r:'C',c:'pull',st:'STR',d:'4 × 6',eq:['trapbar'],
 mus:{p:['quads','glutes','hamstrings'],s:['traps','forearms','lower-back']},
 cues:['Stand inside the bar, feet hip width, grip the handles.','Chest up, hips back, take the slack out, then stand.','Handles at your sides means the weight is under you, not in front.','The friendliest deadlift there is. Start here, not with a straight bar.']},
{id:'tb_shrug',strain:['wrists'],n:'Trap Bar Shrug',r:'D',c:'pull',st:'STR',d:'3 × 12',eq:['trapbar'],
 mus:{p:['traps'],s:['forearms']},
 cues:['Stand inside the bar holding the handles, arms straight.','Lift your shoulders straight toward your ears and pause.','Lower under control. No rolling.','Handles at your sides let you load this heavier than dumbbells allow.']},
{id:'ghr',strain:['knees','lower-back'],n:'Glute-Ham Raise',r:'A',c:'legs',st:'STR',d:'3 × 6',eq:['bench'],
 mus:{p:['hamstrings','glutes'],s:['lower-back','calves']},
 cues:['Knees on a pad, ankles anchored under a bench or by a partner.','Lower your torso forward slowly, hips straight and locked.','Pull yourself back up with the hamstrings, hands ready to catch you.','If you cannot come back up yet, only do the lowering half.']},
{id:'nordic',strain:['knees','lower-back'],nf:1,n:'Nordic Curl',r:'A',c:'legs',st:'STR',d:'3 × 5',eq:[],
 mus:{p:['hamstrings'],s:['glutes','abs']},
 cues:['Kneel on something soft with your ankles anchored under a heavy object.','Lower yourself forward as slowly as you can, hips straight.','Catch yourself with your hands and push back up.','The hardest hamstring exercise that needs no equipment at all.']},
{id:'sissy',strain:['knees'],nf:1,n:'Sissy Squat',r:'B',c:'legs',st:'STR',d:'3 × 10',eq:[],
 mus:{p:['quads'],s:['abs']},
 cues:['Hold a doorframe or post for balance, feet hip width.','Rise onto your toes and let your knees travel forward as you lean back.','Head, hips and knees stay in one line the whole way down.','Go shallow at first. Knees need time to tolerate this one.']},
/* ================= DUMBBELL & ISOLATION ================= */
{id:'db_reardelt',strain:['shoulders'],sit:1,n:'Rear Delt Fly',r:'E',c:'pull',st:'VIT',d:'3 × 15',eq:['db'],
 mus:{p:['rear-delts'],s:['midback','traps']},
 cues:['Hinge forward at the hips, light dumbbells hanging straight down.','Raise them out to the sides with a soft, fixed elbow bend.','Lead with the elbows, not the hands.','Go light. Heavy turns this into a bad row every time.']},
{id:'db_incline_curl',strain:['wrists'],sit:1,n:'Incline Curl',r:'D',c:'pull',st:'STR',d:'3 × 10',eq:['db','bench'],
 mus:{p:['biceps'],s:['forearms']},
 cues:['Lie back on an incline bench, arms hanging straight down behind you.','Curl up without letting the elbows travel forward.','Lower all the way until the arms are straight.','The stretched start position is what makes this harder than a standing curl.']},
{id:'db_conc',strain:['wrists'],sit:1,n:'Concentration Curl',r:'E',c:'pull',st:'STR',d:'3 × 12 each arm',eq:['db','bench'],
 mus:{p:['biceps'],s:['forearms']},
 cues:['Sit down, elbow braced against the inside of your thigh.','Curl up slowly and squeeze at the top.','Lower over three seconds. No swinging — the leg is holding you honest.','One arm at a time shows you which side has been coasting.']},
{id:'ez_preacher',strain:['wrists'],sit:1,n:'Preacher Curl',r:'D',c:'pull',st:'STR',d:'3 × 10',eq:['ezbar','bench'],
 mus:{p:['biceps'],s:['forearms']},
 cues:['Upper arms flat on the pad, chest against it.','Curl up, then lower until the arms are almost straight.','Do not bounce out of the bottom — that is where elbows complain.','The pad removes every chance to cheat with your back.']},
{id:'ez_skull',sit:1,n:'Skull Crusher',r:'C',c:'push',st:'STR',d:'3 × 10',eq:['ezbar','bench'],
 mus:{p:['triceps'],s:[]},
 cues:['Lie back, bar held over your chest with straight arms.','Bend only at the elbow and lower the bar toward your forehead.','Keep the upper arms still and pointing at the ceiling.','Elbow pain means go lighter and lower behind your head instead.']},
{id:'ez_curl',strain:['wrists'],sit:1,n:'EZ Bar Curl',r:'E',c:'pull',st:'STR',d:'3 × 10',eq:['ezbar'],
 mus:{p:['biceps'],s:['forearms']},
 cues:['Grip the angled part of the bar, elbows at your sides.','Curl up without letting your back swing.','Lower slowly to straight arms.','The angled grip is kinder to wrists than a straight bar.']},
{id:'db_kickback',n:'Triceps Kickback',r:'E',c:'push',st:'STR',d:'3 × 12 each arm',eq:['db'],
 mus:{p:['triceps'],s:[]},
 cues:['Hinge forward, upper arm tucked against your side and held there.','Straighten the arm behind you and squeeze.','Only the forearm moves. If the shoulder swings, go lighter.','Light weight, high reps. This is a finisher, not a lift.']},
{id:'db_shrug',strain:['wrists'],sit:1,n:'Dumbbell Shrug',r:'E',c:'pull',st:'STR',d:'3 × 15',eq:['db'],
 mus:{p:['traps'],s:['forearms']},
 cues:['Heavy dumbbells at your sides, arms straight, stand tall.','Lift your shoulders straight up and hold for a second.','Lower all the way down. No rolling.','Traps respond to holding the top, not to more weight.']},
{id:'db_wrist',strain:['wrists'],sit:1,n:'Wrist Curl',r:'E',c:'pull',st:'END',d:'3 × 15',eq:['db','bench'],
 mus:{p:['forearms'],s:[]},
 cues:['Forearms resting on a bench, palms up, wrists past the edge.','Let the dumbbells roll to your fingertips, then curl them back up.','Small range, slow tempo.','Grip is the thing that gives out first on rows and deadlifts.']},
{id:'db_arnold',strain:['shoulders'],sit:1,n:'Arnold Press',r:'C',c:'push',st:'STR',d:'3 × 10',eq:['db'],
 mus:{p:['front-delts','side-delts'],s:['triceps','traps']},
 cues:['Start with the dumbbells at your chest, palms facing you.','Rotate the palms out as you press overhead.','Reverse the rotation on the way down.','The turn catches the front and side of the shoulder in one rep.']},
{id:'db_upright',strain:['shoulders'],n:'Upright Row',r:'C',c:'pull',st:'STR',d:'3 × 12',eq:['db'],
 mus:{p:['side-delts','traps'],s:['biceps']},
 cues:['Dumbbells in front of your thighs, pull them up toward your chest.','Elbows lead and stay above the hands.','Stop at chest height. Higher pinches the shoulder.','If it aches in the shoulder joint, use a wider grip or skip it.']},
{id:'db_pullover',strain:['shoulders'],n:'Dumbbell Pullover',r:'C',c:'pull',st:'STR',d:'3 × 12',eq:['db','bench'],
 mus:{p:['lats','chest'],s:['triceps','abs']},
 cues:['Lie across or along a bench, one dumbbell held over your chest.','Lower it back behind your head with a slight elbow bend.','Stop where the stretch is, not where the shoulder complains.','Ribs and lats get a stretch nothing else in the gym provides.']},
{id:'db_gobletlunge',strain:['knees','lower-back'],n:'Goblet Reverse Lunge',r:'D',c:'legs',st:'STR',d:'3 × 8 each leg',eq:['db'],
 mus:{p:['quads','glutes'],s:['abs','hamstrings']},
 cues:['Hold one dumbbell against your chest like a goblet.','Step back and drop the back knee toward the floor.','The weight up front keeps your chest from folding forward.','Easier to balance than dumbbells at your sides.']},
{id:'db_farmerwalk',strain:['lower-back','wrists'],n:'Suitcase Carry',r:'D',c:'full',st:'CORE',d:'3 × 30 m each side',eq:['db'],
 mus:{p:['obliques','forearms'],s:['traps','abs','glutes']},
 cues:['One heavy dumbbell in one hand. Nothing in the other.','Walk tall and refuse to lean toward the weight.','Shoulders level the whole way. Stop when they are not.','Carrying weight on one side is the most honest core test there is.']},
/* ================= BARBELL & LANDMINE ================= */
{id:'bb_incline',strain:['shoulders'],n:'Incline Bench Press',r:'B',c:'push',st:'STR',d:'4 × 8',eq:['bb','bench'],
 mus:{p:['chest','front-delts'],s:['triceps']},
 cues:['Bench at about thirty degrees. Steeper turns it into a shoulder press.','Lower the bar to your upper chest, elbows tucked around forty-five degrees.','Shoulder blades pinned back and down the whole set.','Use a spotter or a rack with pins. Do not fail this one alone.']},
{id:'bb_closegrip',strain:['shoulders'],n:'Close-Grip Bench Press',r:'B',c:'push',st:'STR',d:'3 × 8',eq:['bb','bench'],
 mus:{p:['triceps','chest'],s:['front-delts']},
 cues:['Hands about shoulder width, not touching. Narrower hurts wrists.','Lower to the lower chest with the elbows tucked in tight.','Press straight up and lock out.','The heaviest triceps exercise you can safely load.']},
{id:'bb_pendlay',strain:['lower-back','shoulders'],n:'Pendlay Row',r:'B',c:'pull',st:'STR',d:'4 × 6',eq:['bb'],
 mus:{p:['lats','midback'],s:['biceps','rear-delts','lower-back']},
 cues:['Torso parallel to the floor, bar resting on the ground each rep.','Pull explosively to your lower ribs, then set it back down.','Back stays flat and still — only the arms move.','Starting from a dead stop removes all the bounce and cheating.']},
{id:'bb_rdl',next:'bb_dl',strain:['lower-back','wrists'],n:'Barbell Romanian Deadlift',r:'B',c:'pull',st:'STR',d:'4 × 8',eq:['bb'],
 mus:{p:['hamstrings','glutes'],s:['lower-back','forearms','traps']},
 cues:['Start standing, soft knees, bar against your thighs.','Push the hips back and slide the bar down your legs.','Stop when the hamstrings say stop, not when the bar hits the floor.','Back rounding means you went too far. Shorten the range.']},
{id:'bb_pause_squat',strain:['knees','lower-back'],n:'Pause Squat',r:'A',c:'legs',st:'STR',d:'4 × 4',eq:['bb'],
 mus:{p:['quads','glutes'],s:['abs','lower-back','hamstrings']},
 cues:['Squat to depth and hold there, still, for two full seconds.','Stay tight in the hole. Do not relax and sink.','Drive up out of the pause without bouncing.','Kills the bounce, which exposes exactly how strong you actually are.']},
{id:'bb_ohp_push',strain:['knees','shoulders'],n:'Push Press',r:'A',c:'push',st:'STR',d:'4 × 5',eq:['bb'],
 mus:{p:['front-delts','triceps'],s:['quads','traps','abs']},
 cues:['Bar on the front of your shoulders, a short dip at the knees.','Drive with the legs and punch the bar overhead in one motion.','Lock out with the bar over the middle of your feet, ribs down.','Leg drive lets you handle more than a strict press ever will.']},

/* Working sets a week, not movements — sets are the unit the training research
   uses, so this is a number worth comparing against something. Averaged over a
   representative quest because each movement carries its own set count. */
function weekSets(){
  const q=questToday();
  if(!q.length)return 0;
  const per=q.reduce((n,e)=>n+((doseParts(e)||{}).sets||3),0)/q.length;
  return Math.round(per*questLen()*(S.days||4));
}

/* A movement's TARGET scales with what you have actually done. Its reward never
   does — that stays flat so the numbers on a shared card mean the same thing for
   everyone. `d` stays the base string; this derives what to show today. */
const PROGCAP=6;                       // steps, so a target roughly doubles at most
/* A loaded movement has a second axis, so its reps only climb a short range
   before the weight goes up instead. A bodyweight movement has no second axis,
   so reps are the only thing that can grow and they climb further. */
const loaded=e=>!!(e&&e.eq&&e.eq.length);
const repCap=e=>loaded(e)?3:PROGCAP;
function progStep(e){
  const id=typeof e==='string'?e:e.id;
  const cap=typeof e==='string'?PROGCAP:repCap(e);
  const p=S.prog[id];
  const earned=p?Math.min(cap,p.step||0):0;
  /* A gentle nudge from level on top, so a returning trainee is not stuck on
     beginner numbers, but never enough to be scary: +2 steps at most. */
  return Math.min(cap,earned+Math.min(2,Math.floor(S.lvl/15)));
}
/* Last load used on a movement, for the placeholder and the recall line. */
function lastLoad(e){const a=S.perf[e.id]||[];
  for(let i=a.length-1;i>=0;i--)if(a[i].l>0)return a[i].l;
  return 0}
const fmtPerf=(v,e)=>v.l>0?v.r+(isTimed(e)?'s':'')+' × '+v.l+S.unit
                          :v.r+(isTimed(e)?'s':'');
/* Splits '3 × 12 each leg' into its parts. Anything that is not sets-by-number
   ('20 min', '5 × 3 min') is left exactly as authored. */
function doseParts(e){
  const m=(e.d||'').match(/^(\d+) × (\d+)(s)?( .*)?$/);
  if(!m)return null;
  return {sets:+m[1],reps:+m[2],time:!!m[3],suffix:m[4]||''};
}
function scaledDose(e){
  const p=doseParts(e); if(!p)return e.d;
  const st=progStep(e);
  const reps=p.time?p.reps+st*5:p.reps+st*2;   // holds grow in seconds, reps in reps
  return `${p.sets} × ${reps}${p.time?'s':''}${p.suffix}`;
}
/* Target reps for one set, used by the session to judge a logged result. */
function targetReps(e){const p=doseParts(e);if(!p)return null;
  const st=progStep(e);return p.time?p.reps+st*5:p.reps+st*2}
const isTimed=e=>{const p=doseParts(e);return !!(p&&p.time)};

/* ---- 3b. record what actually happened, and step the target when it is earned. ---- */
function recordPerf(e,actual,load){
  if(!Number.isFinite(actual)||actual<=0)return;
  const a=S.perf[e.id]||(S.perf[e.id]=[]);
  a.push({r:actual, l:Number.isFinite(load)&&load>0?load:0});
  while(a.length>5)a.shift();                     // capped; this never grows
  const t=targetReps(e); if(t===null)return;
  const p=S.prog[e.id]||(S.prog[e.id]={step:0,hits:0});
  if(actual<t){p.hits=0;return}
  p.hits=(p.hits||0)+1;
  if(p.hits<2)return;
  p.hits=0;
  if(p.step<repCap(e)){p.step++;
    toast('Target up · '+e.n+' is now '+scaledDose(e));return}
  /* Top of the rep range on something you can load: the weight goes up and the
     reps go back to the bottom. Bodyweight movements just stay at the cap. */
  if(loaded(e)){p.step=0;
    toast('Add weight on '+e.n+' · back to '+scaledDose(e))}
}
