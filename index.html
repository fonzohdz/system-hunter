/* Reads a pre-v4 save and gives it a class and a palette without touching
   anything else. Everyone lands on Bladebound; the old blade recolour carries
   over as the matching palette so the app looks exactly as it did yesterday. */
function upgradeToV4(o){
  const s=Object.assign(fresh(),o);
  s.class='bladebound';
  s.weapon=CLASSES.bladebound.w;
  s.palette=BLADEPAL[o.blade]||'crimson';   // their colour is unchanged, and now free
  s.owned=Array.isArray(o.owned)?o.owned.slice():[];
  delete s.theme;
  return s;
}
/* Palettes used to cost gold and no longer do. Anyone who bought one — as a v3
   blade or a v4 palette — gets the price back and the dead entry dropped, so the
   gold isn't stranded in something that's now free. Runs once: the entry is
   removed, so a second pass finds nothing. */
function refundOldCosmetics(s){
  let back=0;
  s.owned=(s.owned||[]).filter(id=>{
    if(BLADEREFUND[id]){back+=BLADEREFUND[id];return false}
    if(id.indexOf('pal_')===0){back+=PALREFUND[id.slice(4)]||0;return false}
    return true;
  });
  if(back>0){s.gold=(s.gold||0)+back;s.refund=back}
  return back;
}
/* Puts any save into a shape the app can run on. Everything here is a container
   that later code calls a method on — a null `owned` from a half-written save
   used to throw and take the whole load down with it. */
function heal(){
  const f=fresh();
  if(!Array.isArray(S.owned))S.owned=[];
  if(!Array.isArray(S.eq))S.eq=[];
  if(!Array.isArray(S.questDone))S.questDone=[];
  if(!Array.isArray(S.limits))S.limits=[];
  if(!Array.isArray(S.outgrown))S.outgrown=[];
  if(!Array.isArray(S.ach))S.ach=[];
  if(!Array.isArray(S.catsLogged))S.catsLogged=[];
  if(typeof S.dgBest!=='number')S.dgBest=0;
  if(!Array.isArray(S.foodEq))S.foodEq=['kettle'];
  if(!Array.isArray(S.diet))S.diet=[];
  if(!S.prFirst||typeof S.prFirst!=='object')S.prFirst={};
  for(const k of ['perf','prog','avoid'])if(!S[k]||typeof S[k]!=='object')S[k]={};
  /* perf entries used to be bare rep counts and now carry a load. Read the old
     shape and upgrade it — this runs on every load, so a save written by an
     older build is repaired rather than discarded. */
  for(const id in S.perf){
    const a=S.perf[id];
    if(!Array.isArray(a)){delete S.perf[id];continue}
    S.perf[id]=a.map(v=>typeof v==='number'?{r:v,l:0}
      :(v&&typeof v==='object'&&Number.isFinite(v.r)?{r:v.r,l:+v.l||0}:null)).filter(Boolean);
  }
  if(S.unit!=='kg'&&S.unit!=='lb')S.unit='lb';
  if(S.split!=='split')S.split='random';
  if(!VOLN[S.vol])S.vol='auto';
  if(typeof S.newsSeen!=='number')S.newsSeen=0;
  if(typeof S.qroll!=='number'||!(S.qroll>=0))S.qroll=0;
  if(S.auraStyle&&!AURASTYLE[S.auraStyle])S.auraStyle=null;
  /* A routine is {id, n, ids}. Drop anything malformed and any movement id
     that no longer exists, rather than letting a bad entry break the runner. */
  if(!Array.isArray(S.routines))S.routines=[];
  S.routines=S.routines.filter(r=>r&&typeof r==='object'&&r.id).map(r=>({
    id:String(r.id), n:String(r.n||'Routine').slice(0,40),
    ids:(Array.isArray(r.ids)?r.ids:[]).filter(id=>EX.some(x=>x.id===id)).slice(0,20)
  }));
  if(typeof S.cycle!=='number'||!(S.cycle>=0))S.cycle=0;
  if(!S.stats||typeof S.stats!=='object')S.stats=f.stats;
  if(!S.prs||typeof S.prs!=='object')S.prs=f.prs;
  if(!S.history||typeof S.history!=='object')S.history={};
  if(!CLASSES[S.class])S.class='bladebound';
  if(!PALETTES[S.palette])S.palette='crimson';
  if(!WEAPONS[S.weapon]||!wepOwned(S.weapon))S.weapon=cls().w;
  if(!wepOwned(S.weapon))S.weapon='longsword';   // class default can itself be locked
}
async function load(){
  let raw=null;
  try{const r=await DB.get(KEY);if(r&&r.value)raw=r.value}catch(e){}
  if(raw!==null){
    /* A current save exists. Even if it parses badly we must NOT fall through to
       an older key — that would overwrite good progress with a stale save, and
       there is no server backup to undo it with. */
    try{S=Object.assign(fresh(),JSON.parse(raw))}catch(e){console.error('save unreadable',e)}
    heal();
    if(refundOldCosmetics(S))save();
    return;
  }
  for(const k of [KEY3,KEY2]){            // migrate forward so nobody loses progress
    try{const r=await DB.get(k);
      if(r&&r.value){S=upgradeToV4(JSON.parse(r.value));heal();refundOldCosmetics(S);save();return}
    }catch(e){}
  }
}
let sT;function save(){clearTimeout(sT);sT=setTimeout(async()=>{
  try{await DB.set(KEY,JSON.stringify(S))}catch(e){console.error('save failed',e)}},250)}

/* ---------------- pixel bodies ----------------
   Two silhouettes on a 36 x 78 lattice. Every region is a list of [x,y,w,h]
   cells authored on the RIGHT half only and mirrored about the centre line:
   a body hand-authored on both sides drifts a pixel somewhere, and on a
   symmetric figure a one-pixel drift reads as a mistake rather than a style.

   The cells tile the body with no gaps — head into neck into traps into
   chest into abs into hips into quads into knees into calves into feet — so
   the silhouette is whole whether a group is lit or not. A group appears on
   whichever view actually shows it, which is why both views are always drawn
   together, and every term in MUSCLES appears on at least one of them or the
   library's muscle filter would have a dead option.

   These are drawn on a grid and rendered with shape-rendering:crispEdges, so
   they are the same artwork grammar as the icons. Nothing here is smoothed. */
/* The filter vocabulary, in head-to-toe order so the row reads like a body.
   Every term here must stay reachable by at least one exercise's `mus`, or
   the library filter offers an option that returns nothing. */
const MUSCLES=['traps','chest','front-delts','side-delts','rear-delts','lats',
  'midback','biceps','triceps','forearms','abs','obliques','lower-back',
  'glutes','quads','hamstrings','calves'];
const MUSNAME={'front-delts':'front delts','side-delts':'side delts',
  'rear-delts':'rear delts','lower-back':'lower back',midback:'mid back'};
const musName=g=>MUSNAME[g]||g;
const BGW=36,BGH=78;
const BODYPX={
 front:{
  /* not a muscle: head, neck, pelvis, hands, knees, feet */
  shell:{c:[[14,2,8,8],[16,10,4,2],[12,38,12,5]],
         m:[[26,40,4,4],[19,58,6,3],[19,73,6,3]]},
  mus:{
   traps:[[18,12,6,3]],
   'front-delts':[[24,14,4,5]],
   'side-delts':[[28,15,3,5]],
   chest:[[18,15,6,6]],
   biceps:[[25,20,4,8]],
   forearms:[[26,28,4,12]],
   abs:[[18,21,4,17]],
   obliques:[[22,22,2,16]],
   quads:[[19,43,6,15]],
   calves:[[19,61,5,12]]
  }
 },
 back:{
  shell:{c:[[14,2,8,8],[16,10,4,2]],
         m:[[26,40,4,4],[19,58,6,3],[19,73,6,3],[22,31,2,6]]},
  mus:{
   traps:[[18,12,6,5]],
   'rear-delts':[[24,14,4,5]],
   'side-delts':[[28,15,3,5]],
   midback:[[18,17,6,4]],
   lats:[[18,21,6,10]],
   triceps:[[25,20,4,8]],
   forearms:[[26,28,4,12]],
   'lower-back':[[18,31,4,6]],
   glutes:[[18,37,6,6]],
   hamstrings:[[19,43,6,15]],
   calves:[[19,61,5,12]]
  }
 }
};
const bmir=r=>[BGW-r[0]-r[2],r[1],r[2],r[3]];
const brect=r=>'<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'"/>';
function bcells(list,mirrored){
  let o='';
  for(const r of list){o+=brect(r);if(mirrored)o+=brect(bmir(r))}
  return o;
}
/* One view. Primary lights up, secondary sits behind it, everything else
   stays in the dim body colour so the figure still reads as a figure. */
function bodyView(v,mus){
  const B=BODYPX[v];
  const cl=g=>mus.p.indexOf(g)>=0?'mp':mus.s.indexOf(g)>=0?'ms':'mo';
  let g='<g class="bshell">'+bcells(B.shell.c||[],false)+bcells(B.shell.m||[],true)+'</g>';
  for(const k in B.mus)
    g+='<g class="'+cl(k)+'" data-m="'+k+'">'+bcells(B.mus[k],true)+'</g>';
  return '<figure class="bodyfig"><svg viewBox="0 0 '+BGW+' '+BGH+'" aria-hidden="true">'+g+
    '</svg><figcaption>'+v+'</figcaption></figure>';
}
/* A card is small, so it gets both views with no captions — enough to say at
   a glance what a movement works. */
function bodyCard(mus){
  return '<div class="bodycard">'+bodyView('front',mus)+bodyView('back',mus)+'</div>';
}

function bodyMap(mus){
  return `<div class="bodymap">${bodyView('front',mus)}${bodyView('back',mus)}</div>`;
}



/* ---------------- the hunter ----------------
   Twelve tiers on one 88x136 canvas: same size, centred, feet on a
   shared baseline. That alignment is the whole reason they are cut this way —
   tiers cropped to their own bounding boxes would make the character jump and
   resize every time you crossed a threshold, which reads as a glitch rather
   than as progress. One 26-colour palette is shared across all twelve so he
   does not change hue as he levels.

   These are NOT the exercise figures CLAUDE.md retired. That was eleven
   keypoints trying to demonstrate 155 movements at 52px. This is one person
   at one pose whose only job is to be you.

   HUNTLV holds the level each tier arrives at. The early ones land on the
   rank boundaries so a tier change coincides with a rank-up; the later ones
   spread out, because a reward that arrives every level stops being one. */
const HUNTW=88,HUNTH=136;

/* Which tier a level is standing in. */
function huntTier(lv){
  let i=0;
  for(let k=0;k<HUNTLV.length;k++)if(lv>=HUNTLV[k])i=k;
  return i;
}
/* Decoded once. They are data URIs, so nothing here touches the network. */
const HUNTIMG=HUNTERS.map(src=>{const im=new Image();im.src=src;return im});

/* ---- the hunter moves ----
   One frame of art, deformed every frame, rather than a sprite sheet. A
   sheet is the traditional answer and the wrong one here: nothing can hold a
   generated character consistent across frames, so cycling them would make
   the armour reshuffle twice a second. Deforming a single frame cannot drift,
   because there is only ever one drawing.

   Two motions, both integer-rounded in SOURCE pixels so the art stays on its
   own grid and never blurs:
     breathing - the whole figure rises and falls one pixel, slowly
     cloak     - rows below the waist take a horizontal offset that grows
                 toward the hem, on a sine travelling downward, so the cloth
                 ripples instead of sliding sideways as one board
   Drawn in two-row bands: per-row would be 136 drawImage calls a frame for
   motion nobody can see at that resolution.

   A tier change cross-fades over 900ms instead of cutting, so levelling up
   reads as the character being re-equipped. */
let hc,hx,hRun=false,hTier=-1,hPrev=-1,hFade=0,hScale=1;
const WAIST=0.44, BAND=2;
function bindHunter(){
  hc=document.getElementById("hunter");
  if(!hc){hRun=false;return}
  hx=hc.getContext("2d");
  const d=Math.min(2,window.devicePixelRatio||1);
  hScale=2*d;
  hc.width=HUNTW*hScale;hc.height=HUNTH*hScale;
  hx.imageSmoothingEnabled=false;
  const t=huntTier(S.lvl);
  if(hTier<0){hTier=t;hPrev=t;hFade=1}
  else if(t!==hTier){hPrev=hTier;hTier=t;hFade=0}
  if(REDUCED){hFade=1;drawHunter(0);return}
  if(!hRun){hRun=true;requestAnimationFrame(huntLoop)}
}
/* The centre column never moves. The first version swayed every row below
   the waist, which on a tier with bare legs made the legs ripple like cloth —
   the motion was right and the thing it was applied to was wrong. Cloth hangs
   at the sides, so only the outer columns sway, in opposite directions, which
   reads as a cloak catching air rather than the whole figure sliding.
   CLOTH ramps the amplitude in as the tiers actually acquire a cloak, so the
   rag-wearing early hunter just breathes. */
function paintHunter(im,now,alpha,tier){
  if(!im||!im.complete||!im.naturalWidth)return;
  hx.globalAlpha=alpha;
  const breathe=Math.round(Math.sin(now/1900));
  const cloth=Math.max(0,Math.min(1,(tier-4)/4));
  const EDGE=Math.round(HUNTW*0.30);
  const MIDW=HUNTW-EDGE*2;
  for(let y=0;y<HUNTH;y+=BAND){
    const hgt=Math.min(BAND,HUNTH-y);
    const f=y/HUNTH;
    const dy=(y+breathe)*hScale;
    let dx=0;
    if(cloth>0&&f>WAIST){
      const k=(f-WAIST)/(1-WAIST);
      dx=Math.round(Math.sin(now/820-f*6.4)*Math.pow(k,1.7)*2.2*cloth);
    }
    hx.drawImage(im,EDGE,y,MIDW,hgt,EDGE*hScale,dy,MIDW*hScale,hgt*hScale);
    hx.drawImage(im,0,y,EDGE,hgt,(-dx)*hScale,dy,EDGE*hScale,hgt*hScale);
    hx.drawImage(im,HUNTW-EDGE,y,EDGE,hgt,(HUNTW-EDGE+dx)*hScale,dy,EDGE*hScale,hgt*hScale);
  }
  hx.globalAlpha=1;
}

/* ---- frame animation ----
   A tier can ship a real animation instead of a deformed still. HUNTFRAMES
   maps a tier index to a horizontal strip: N frames of HUNTW x HUNTH laid
   side by side on one image, played on a fixed clock.

   One strip, not N images. Frames drawn together in a single pass hold the
   character far better than frames generated one at a time, and a strip is
   also one decode and one upload instead of N.

   Tiers without a strip keep the procedural rig, so strips can land one at a
   time rather than all twelve or nothing. A tier WITH a strip gets no
   procedural motion on top: the frames already contain the motion, and
   deforming them as well would fight the animator. */
const HUNTFRAMES={};        // tier index -> {src, frames, fps}
const HUNTFIMG={};
function huntAnim(t){
  const a=HUNTFRAMES[t];
  if(!a)return null;
  if(!HUNTFIMG[t]){const im=new Image();im.src=a.src;HUNTFIMG[t]=im}
  const im=HUNTFIMG[t];
  if(!im.complete||!im.naturalWidth)return null;   // still decoding: hold the rig
  return {im,frames:a.frames,fps:a.fps||12,pong:a.pong};
}
/* Ping-pong plays 1..N then N..1. It costs nothing, it guarantees the loop
   closes even when the last frame does not lead back into the first, and for
   a breathing idle it is arguably more correct anyway: inhale and exhale are
   the same motion reversed. */
function paintFrames(a,now,alpha){
  const step=Math.floor(now/(1000/a.fps));
  let i;
  if(a.pong){
    const span=a.frames*2-2;
    const p=((step%span)+span)%span;
    i=p<a.frames?p:span-p;
  }else i=((step%a.frames)+a.frames)%a.frames;
  hx.globalAlpha=alpha;
  hx.drawImage(a.im,i*HUNTW,0,HUNTW,HUNTH,0,0,HUNTW*hScale,HUNTH*hScale);
  hx.globalAlpha=1;
}
function drawHunter(now){
  if(!hx)return;
  hx.clearRect(0,0,hc.width,hc.height);
  const lay=(t,alpha)=>{
    const a=huntAnim(t);
    if(a)paintFrames(a,now,alpha);
    else paintHunter(HUNTIMG[t],now,alpha,t);
  };
  if(hFade<1&&hPrev!==hTier)lay(hPrev,1-hFade);
  lay(hTier,hFade<1?hFade:1);
}
/* Attach a strip to a tier at runtime. Kept as a function rather than a
   literal so a strip can be added without touching drawHunter. */
function setHunterFrames(tier,src,frames,fps,pong){
  HUNTFRAMES[tier]={src,frames,fps:fps||12,pong:!!pong};
  delete HUNTFIMG[tier];
}
function huntLoop(now){
  if(!hc||!hc.isConnected){hRun=false;return}
  if(hFade<1)hFade=Math.min(1,hFade+1/54);          // ~900ms at 60fps
  drawHunter(now);
  requestAnimationFrame(huntLoop);
}
/* ---------------- pixel icons ----------------
   Every icon is a 12x12 character grid: '#' is a lit pixel, '+' a dimmer one.
   They are emitted as <rect> runs with shape-rendering:crispEdges, so they are
   artwork on the same lattice as the muscle bodies rather than a font glyph
   or an emoji standing in for one. currentColor means they inherit whatever
   the surrounding text is doing, including the palette swap. */
const ICONS={

      '...##.##.##.','...##.##.##.','...##.##.##.','...##.##.##.','.##########.',
      '............','............'],

        '.#..#..#..#.','.#..####..#.','.#++++++++#.','.##########.','............',

       '.#+##++##+#.','.#+##++##+#.','.#++#++#++#.','.##+####+##.','..##++++##..',
       '....####....','............'],
 tick:['............','............','..........#.','.........##.','.#......##..',
       '.##....##...','..##..##....','...####.....','....##......','............',
       '............','............'],

        '....####....','....####....','...######...','..###..###..','.###....###.',
        '.##......##.','............'],

       '...########.','...######...','...####.....','...##.......','............',
       '............','............'],
 pause:['............','..###..###..','..###..###..','..###..###..','..###..###..',
        '..###..###..','..###..###..','..###..###..','..###..###..','............',
        '............','............'],

        '..######..#.','..######.#.#','..######....','....####....','......##....',
        '............','............'],

       '..######.#.#','..######..#.','..######.#.#','....####....','......##....',
       '............','............']
};
function pxIcon(k,extra){
  const g=ICONS[k]; if(!g)return '';
  let r='';
  for(let y=0;y<g.length;y++){
    let x=0;
    while(x<g[y].length){
      const c=g[y][x];
      if(c==='.'){x++;continue}
      let w=1; while(g[y][x+w]===c)w++;
      r+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1"'+(c==='+'?' opacity=".42"':'')+'/>';
      x+=w;
    }
  }
  return '<svg viewBox="0 0 12 12" '+(extra||'')+' aria-hidden="true" fill="currentColor" '+
         'shape-rendering="crispEdges">'+r+'</svg>';
}

/* ---------------- aura canvas ----------------
   Every class draws differently, but all six read the same intensity from
   auraIdx(). A dead streak looks dead no matter what you picked. */
let ac,ax,AW=0,AH=0,auraRunning=false;
const rnd=n=>Math.random()*n, coin=()=>Math.random()<.5?-1:1;
const tendrils=[],motes=[],embers=[],slashes=[],orbits=[],flecks=[];
for(let i=0;i<7;i++)tendrils.push({a:rnd(6.3),sp:(.0016+rnd(.0028))*coin(),

for(let i=0;i<24;i++)motes.push({x:Math.random(),y:Math.random(),v:.0006+rnd(.0018),r:.6+rnd(1.6),a:.2+rnd(.6)});
for(let i=0;i<48;i++)embers.push({x:Math.random(),y:Math.random(),v:.0010+rnd(.0028),
  sw:rnd(6.3),sa:.4+rnd(1.3),r:.5+rnd(1.7),a:.25+rnd(.7),hot:Math.random()<.34});
for(let i=0;i<22;i++)slashes.push({p:Math.random(),sp:.007+rnd(.016),y:.44+rnd(.5),
  dir:coin(),len:.05+rnd(.12),w:.7+rnd(1.5),a:.3+rnd(.7)});

const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#FF3D7F';
const rgbOf=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgba=(hex,a)=>{const c=rgbOf(hex);return `rgba(${c[0]},${c[1]},${c[2]},${a})`};

/* An aura style used to be welded to your class, so wanting Embers meant
   becoming a Ronin and taking its tier names and titles with it. Your class's
   own aura is free; the other five are the Vault's new paid axis. */
const AURAPRICE=300;
const AURALIST=()=>CLSKEYS.map(k=>({k:CLASSES[k].aura, n:CLASSES[k].an, from:CLASSES[k].n}));
const auraOwned=k=>k===cls().aura||S.owned.includes('aur_'+k);
const auraKey=()=>{const k=S.auraStyle;return k&&AURASTYLE[k]&&auraOwned(k)?k:cls().aura};
const AURASTYLE={
  /* Bladebound — curling tendrils reaching outward, plus rising motes. */
  tendrils(C){
    for(const t of tendrils){
      t.a+=t.sp;ax.beginPath();
      for(let s=0;s<=38;s++){
        const f=s/38,ang=t.a+f*t.len*2.6;
        const wob=Math.sin(C.now/700+t.ph+f*7)*t.wob*24*C.I;
        const rr=(t.rad+wob)*(.5+f*.62)*C.I;
        const x=C.cx+Math.cos(ang)*rr,y=C.cy+Math.sin(ang)*rr*.78;
        s?ax.lineTo(x,y):ax.moveTo(x,y);
      }
      const g=ax.createLinearGradient(C.cx-t.rad,C.cy,C.cx+t.rad,C.cy);
      g.addColorStop(0,'rgba(0,0,0,0)');
      g.addColorStop(.5,rgba(C.mag,C.I*.5));
      g.addColorStop(1,'rgba(0,0,0,0)');
      ax.strokeStyle=g;ax.lineWidth=t.w*2;ax.lineCap='round';ax.stroke();
    }
    for(const m of motes){
      m.y-=m.v;if(m.y<0){m.y=1;m.x=Math.random()}
      ax.globalAlpha=m.a*C.I*(m.y<.3?m.y/.3:1);
      ax.fillStyle=m.a>.55?C.core:C.mag;
      ax.beginPath();ax.arc(m.x*C.W,m.y*C.H,m.r*2,0,6.3);ax.fill();
    }
  },
  /* Ronin — embers falling and ash drifting, with a few hot sparks off the edge. */
  embers(C){
    for(const e of embers){
      e.y+=e.v*(.45+C.I);
      if(e.y>1.04){e.y=-.05;e.x=Math.random()}
      const x=(e.x+Math.sin(C.now/900*e.sa+e.sw)*.055)*C.W, y=e.y*C.H;
      const fade=e.y<.1?Math.max(0,e.y)/.1:e.y>.82?(1.04-e.y)/.22:1;
      ax.globalAlpha=Math.max(0,e.a*C.I*fade);
      ax.fillStyle=e.hot?C.core:C.mag;
      ax.beginPath();ax.arc(x,y,e.r*2*(e.hot?1.3:1),0,6.3);ax.fill();
    }
    for(const m of motes){                       // sparks lifting off the blade
      m.y-=m.v*1.7;if(m.y<0){m.y=1;m.x=.5+(Math.random()-.5)*.34}
      const d=Math.abs(m.x-.5);
      ax.globalAlpha=m.a*C.I*(m.y<.35?m.y/.35:1)*Math.max(0,1-d*3.6);
      ax.fillStyle=C.core;
      ax.beginPath();ax.arc(m.x*C.W,m.y*C.H,m.r*1.5,0,6.3);ax.fill();
    }
  },
  /* Warden — slow heavy pulse rings, few and thick. */
  pulse(C){
    const maxR=Math.min(C.W,C.H)*.78;
    ax.lineCap='butt';
    for(let k=0;k<4;k++){
      const t=((C.now/3600)+k/4)%1;
      const r=maxR*(.14+t*.86)*(.5+C.I*.5);
      const a=(1-t)*(1-t)*C.I*.6;
      if(a<.004)continue;
      ax.beginPath();ax.ellipse(C.cx,C.cy,r,r*.58,0,0,6.3);
      ax.strokeStyle=rgba(k?C.mag:C.core,a);
      ax.lineWidth=(10-k*1.8)*(.45+C.I*.55);ax.stroke();
    }
    for(const m of motes){                       // dust shaken loose, drifting up slowly
      m.y-=m.v*.45;if(m.y<0){m.y=1;m.x=Math.random()}
      ax.globalAlpha=m.a*C.I*.55*(m.y<.3?m.y/.3:1);
      ax.fillStyle=C.mag;
      ax.beginPath();ax.arc(m.x*C.W,m.y*C.H,m.r*1.8,0,6.3);ax.fill();
    }
  },
  /* Arcanist — orbiting motes around a slowly rotating glyph. */
  motes(C){
    const gr=Math.min(C.W,C.H)*.34*(.55+C.I*.45);
    ax.save();ax.translate(C.cx,C.cy);ax.scale(1,.62);
    ax.rotate(C.now/9000);
    ax.strokeStyle=rgba(C.mag,C.I*.34);ax.lineWidth=2.4;
    ax.beginPath();ax.arc(0,0,gr,0,6.3);ax.stroke();
    for(let k=0;k<12;k++){                       // tick marks on the outer ring
      const a=k/12*6.3,s=k%3?1.06:1.16;
      ax.beginPath();ax.moveTo(Math.cos(a)*gr,Math.sin(a)*gr);
      ax.lineTo(Math.cos(a)*gr*s,Math.sin(a)*gr*s);ax.stroke();
    }
    ax.restore();
    ax.save();ax.translate(C.cx,C.cy);ax.scale(1,.62);
    ax.rotate(-C.now/5200);
    ax.strokeStyle=rgba(C.core,C.I*.26);ax.lineWidth=1.8;
    ax.beginPath();
    for(let k=0;k<6;k++){                        // inner hexagram
      const a=k*2*Math.PI/3, r2=gr*.66;
      k?ax.lineTo(Math.cos(a)*r2,Math.sin(a)*r2):ax.moveTo(Math.cos(a)*r2,Math.sin(a)*r2);
    }
    ax.closePath();ax.stroke();ax.restore();
    for(const o of orbits){
      o.a+=o.sp*(.35+C.I);
      const rr=Math.min(C.W,C.H)*o.rad*(.4+C.I*.75);
      const x=C.cx+Math.cos(o.a)*rr,y=C.cy+Math.sin(o.a)*rr*o.tilt;
      ax.globalAlpha=o.al*C.I;
      ax.fillStyle=o.al>.7?C.core:C.mag;
      ax.beginPath();ax.arc(x,y,o.r*2,0,6.3);ax.fill();
    }
  },
  /* Stalker — fast flat shards, low in the frame, gone before you track them. */
  shards(C){
    ax.lineCap='butt';
    for(const s of slashes){
      s.p+=s.sp*(.5+C.I*1.8);
      if(s.p>1){s.p=0;s.y=.44+rnd(.5);s.dir=coin();s.len=.05+rnd(.12);s.a=.3+rnd(.7)}
      const life=s.p<.14?s.p/.14:(1-s.p)/.86;
      const x=C.cx+s.dir*(.03+s.p*.64)*C.W, y=s.y*C.H;
      ax.globalAlpha=s.a*C.I*life;
      ax.strokeStyle=s.a>.78?C.core:C.mag;
      ax.lineWidth=s.w*2;
      ax.beginPath();ax.moveTo(x,y);ax.lineTo(x-s.dir*s.len*C.W,y);ax.stroke();
    }
  },
  /* Ironclad — a tight shimmer worn close to the body. No reaching, no drift. */
  shimmer(C){
    const rw=C.W*.17*(.72+C.I*.38), rh=C.H*.40*(.74+C.I*.3);
    for(let k=0;k<3;k++){
      const o=1+k*.11;
      ax.beginPath();ax.ellipse(C.cx,C.cy,rw*o,rh*(1+k*.05),0,0,6.3);
      ax.strokeStyle=rgba(C.mag,C.I*(.22-k*.06));ax.lineWidth=2.2-k*.5;ax.stroke();
    }
    for(let k=0;k<4;k++){                        // highlights running around the shell
      const t=((C.now/1600)+k/4)%1,a0=t*6.3;
      ax.beginPath();ax.ellipse(C.cx,C.cy,rw*1.07,rh*1.03,0,a0,a0+.55);
      ax.strokeStyle=rgba(C.core,C.I*.45*Math.sin(t*Math.PI));
      ax.lineWidth=2.8;ax.lineCap='round';ax.stroke();
    }
    for(const f of flecks){
      const a=f.a+C.now/2600*f.sp;
      const x=C.cx+Math.cos(a)*rw*f.rad*1.2, y=C.cy+Math.sin(a)*rh*f.rad;
      ax.globalAlpha=f.al*C.I*(.45+.55*Math.sin(C.now/420+f.ph));
      ax.fillStyle=C.core;
      ax.beginPath();ax.arc(x,y,f.r*1.7,0,6.3);ax.fill();
    }
  }
};

/* ---------------- atmosphere ----------------
   The depth the whole look rests on. Bokeh at three distances drifting up
   through a lit ground, plus a few four-point sparks. It sits behind every
   screen, never scrolls, and never takes a pointer event. Under reduced
   motion it paints one still frame and stops, which is the same picture
   without the drift. */
let atc,atx,ATW=0,ATH=0,atRunning=false;
const motes3=[];
for(let i=0;i<70;i++)motes3.push({
  x:Math.random(), y:Math.random(), z:Math.random(),
  ph:Math.random()*6.3, sw:Math.random()*6.3, gold:Math.random()<.22});
const sparks=[];
for(let i=0;i<7;i++)sparks.push({x:Math.random(),y:Math.random(),ph:Math.random()*6.3});

function sizeAtmos(){
  if(!atc)return;
  const d=Math.min(2,window.devicePixelRatio||1);
  ATW=atc.width=Math.max(2,Math.round(innerWidth*d));
  ATH=atc.height=Math.max(2,Math.round(innerHeight*d));
}
function drawAtmos(now){
  if(!atx)return;
  atx.clearRect(0,0,ATW,ATH);
  const lume=cssv('--magenta'), core=cssv('--core'), gold=cssv('--gold');
  for(const m of motes3){
    // near motes are bigger, brighter and drift faster: that is the depth cue
    const r=(0.5+m.z*3.2)*(ATW/760);
    const x=(m.x+Math.sin(now/5200+m.sw)*0.012*m.z)*ATW;
    const y=m.y*ATH;
    const tw=0.55+0.45*Math.sin(now/1400+m.ph);
    atx.globalAlpha=(0.10+m.z*0.42)*tw;
    atx.fillStyle=m.gold?gold:(m.z>0.72?core:lume);
    atx.beginPath();atx.arc(x,y,r,0,6.3);atx.fill();
  }
  atx.globalAlpha=1;
  // four-point sparks, the reference's own punctuation
  for(const sp of sparks){
    const t=0.5+0.5*Math.sin(now/2300+sp.ph);
    if(t<.25)continue;
    const x=sp.x*ATW, y=sp.y*ATH, a=(2+t*7)*(ATW/760);
    atx.globalAlpha=t*.5;atx.fillStyle=gold;
    atx.beginPath();
    atx.moveTo(x,y-a);atx.lineTo(x+a*.22,y-a*.22);atx.lineTo(x+a,y);
    atx.lineTo(x+a*.22,y+a*.22);atx.lineTo(x,y+a);atx.lineTo(x-a*.22,y+a*.22);
    atx.lineTo(x-a,y);atx.lineTo(x-a*.22,y-a*.22);atx.closePath();atx.fill();
  }
  atx.globalAlpha=1;
}
function atmosLoop(now){
  if(!atc||!atc.isConnected){atRunning=false;return}
  for(const m of motes3){m.y-=(0.00004+m.z*0.00016);if(m.y<-0.02){m.y=1.02;m.x=Math.random()}}
  drawAtmos(now);
  requestAnimationFrame(atmosLoop);
}
function bindAtmos(){
  atc=document.getElementById('atmos');if(!atc)return;
  atx=atc.getContext('2d');sizeAtmos();
  if(REDUCED){drawAtmos(0);return}          // one still frame, then nothing
  if(!atRunning){atRunning=true;requestAnimationFrame(atmosLoop)}
}
addEventListener('resize',()=>{sizeAtmos();if(REDUCED)drawAtmos(0)});

function bindAura(){
  ac=document.getElementById('aura');if(!ac){auraRunning=false;return}
  ax=ac.getContext('2d');sizeAura();
  if(!auraRunning){auraRunning=true;requestAnimationFrame(auraLoop)}
}
function sizeAura(){if(!ac)return;const r=ac.getBoundingClientRect();AW=ac.width=Math.max(2,r.width*2);AH=ac.height=Math.max(2,r.height*2)}
addEventListener('resize',()=>{sizeAura()});
function auraLoop(now){
  if(!ac||!ac.isConnected){auraRunning=false;return}
  ax.clearRect(0,0,AW,AH);
  const I=Math.min(1,auraIdx()/3.2);
  if(I>0&&!REDUCED){
    const draw=AURASTYLE[auraKey()]||AURASTYLE.tendrils;
    draw({now,I,cx:AW/2,cy:AH*.46,W:AW,H:AH,
          mag:cssv('--magenta'),core:cssv('--core'),crim:cssv('--crimson')});
    ax.globalAlpha=1;
  }
  requestAnimationFrame(auraLoop);
}


/* ---------------- the horizon ----------------
   The one thing the home screen exists to show. Expressed in SESSIONS rather
   than XP on purpose: "340 / 1000 XP" is a loading bar, "9 sessions" is a
   thing you can picture doing. The pace line is honest — it reads S.days, so
   it says three weeks only if you actually train five times a week. */
function xpToLevel(target){
  let t=0; for(let l=S.lvl;l<target;l++)t+=need(l);
  return Math.max(0,t-S.xp);
}
/* what one cleared quest is worth, so the estimate tracks session length */
const sessionXP=()=>questLen()*25+80;
function horizon(){
  const r=rankOf(S.lvl), i=RANKS.indexOf(r);
  if(i>=RANKS.length-1)return null;                 // already at the top
  const to=RANKS[i+1];
  const sessions=Math.max(1,Math.ceil(xpToLevel(RANK_LV[to])/sessionXP()));
  const wk=Math.max(1,Math.round(sessions/(S.days||4)));
  return {from:r,to,sessions,weeks:wk,lv:RANK_LV[to]};
}
/* Requirements shown under the number. Real values, not decoration. */
function rankReqs(h){
  const done=S.clears, needC=S.clears+h.sessions;
  const out=[
    {n:'Sessions cleared', v:done+' / '+needC, ok:false},
    {n:'Level', v:S.lvl+' / '+h.lv, ok:S.lvl>=h.lv}
  ];
  const nextUp=EX.filter(e=>RANK_LV[e.r]===h.lv);
  if(nextUp.length)out.push({n:nextUp[0].n, v:h.to+'-RANK', lock:true});
  return out;
}

/* ---------------- quest ---------------- */
function seeded(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return()=>{h=Math.imul(h^h>>>15,2246822507);h^=h>>>13;return(h>>>0)/4294967296}}
/* Quietly stepped past for two weeks after someone said a movement hurt. */
const avoided=e=>{const d=S.avoid[e.id];return !!d&&d>today()};
/* Already outgrown, and the successor is available — prefer the successor. */
function supersededy(e){
  if(!S.outgrown.includes(e.id)||!e.next)return false;
  const nx=EX.find(x=>x.id===e.next);
  return !!(nx&&unlocked(nx.r)&&hasEq(nx)&&fitsLimits(nx));
}
function pool(){
  const p=EX.filter(e=>unlocked(e.r)&&hasEq(e)&&fitsLimits(e)&&!avoided(e)&&!supersededy(e));
  if(p.length)return p;
  /* Last resort: never hand back an empty quest. Relax equipment before
     relaxing what someone told us to work around. */
  const q=EX.filter(e=>!e.eq.length&&e.r==='E'&&!(floorOnly()&&e.nf)&&fitsLimits(e));
  return q.length?q:EX.filter(e=>!e.eq.length&&e.r==='E'&&!(floorOnly()&&e.nf));
}
function questFor(d){
  /* Preset is in the seed as well as the equipment, because hotel and floor
     produce the same equipment list but different pools. */
  /* The plan is part of the seed, so the quest is stable through the day but a
     different training day genuinely rolls a different quest. */
  const plan=splitToday();
  const rnd=seeded(d+'|'+S.lvl+'|'+effEq().join('')+'|'+S.goal+'|'+curPreset()+'|'
    +limitsOn().join('')+'|'+(plan?plan.k+S.cycle:'')+'|'+questLen()+'|'+(S.qroll||0)),
        pl=pool(),w=plan?plan.w:GOALS[S.goal].w;
  const bag=[];for(const c in w)for(let i=0;i<w[c];i++)bag.push(c);
  const out=[],used=new Set();let guard=0;
  while(out.length<questLen()&&guard++<200){
    const c=bag[Math.floor(rnd()*bag.length)];
    let opts=pl.filter(e=>e.c===c&&!used.has(e.id));
    if(!opts.length)opts=pl.filter(e=>!used.has(e.id));
    if(!opts.length)break;
    const pick=opts[Math.floor(rnd()*opts.length)];used.add(pick.id);out.push(pick);
  }
  return out;
}
const REROLL=40;
/* Only while nothing has been cleared, so it cannot be used to walk away from
   work already started. */
const canReroll=()=>{const q=questFor(today());
  return S.gold>=REROLL && !q.some(e=>S.questDone.includes(e.id))};
function rollQuest(){const d=today();
  if(S.questDate!==d){S.questDate=d;S.questDone=[];S.questBonus=false;S.qroll=0;save()}
  return questFor(d)}

/* ---------------- progression ---------------- */
let pendingLevel=null;
/* Called wherever a movement is logged, so milestones see everything. */
function noteLogged(e){
  if(e&&!S.catsLogged.includes(e.c))S.catsLogged.push(e.c);
  if(curPreset()!=='kit')S.travelClear=true;
}
/* `counts` says whether this payout was a piece of training. A milestone and an
   outgrown movement pay XP and gold but are not themselves work, so they must
   not bump the logged tally or draw a square on the heatmap — doing so put
   training on the calendar that never happened, and fed the count back into the
   very milestones that measure it. */
function award(xp,gold,stat,counts){
  S.xp+=xp;S.gold+=gold;
  if(counts!==false){S.logs++;const d=today();S.history[d]=(S.history[d]||0)+1}
  if(stat&&S.stats[stat]!==undefined)S.stats[stat]+=1;
  let g=0;
  while(S.xp>=need(S.lvl)){S.xp-=need(S.lvl);S.lvl++;g++;for(const k in S.stats)S.stats[k]+=1}
  save();if(g)pendingLevel=S.lvl;return g;
}
const gapAllowed=()=>Math.max(1,7-(S.days||4));
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function touchStreak(){
  const d=today();if(S.last===d)return;
  if(!S.last)S.streak=1;
  else{
    const n=daysBetween(S.last,d);
    if(n<=gapAllowed())S.streak++;
    else if(S.potions>0){S.potions--;S.streak++;toast('Elixir of Rest consumed — streak held')}
    else S.streak=1;
  }
  S.best=Math.max(S.best,S.streak);S.last=d;save();
}

/* ---------------- swapping ----------------
   A movement that hurts, or that you cannot do today, must never mean failing
   the quest. Swaps last for the day and cost nothing. */
const swapMap=()=>{const o=S.swaps;return o&&o.d===today()?o.m:null};
function swapped(e){
  const m=swapMap(); if(!m||!m[e.id])return e;
  return EX.find(x=>x.id===m[e.id])||e;
}
/* Three alternatives: same category, same or adjacent rank, doable with what
   they have today, and not already in the quest. */
function altsFor(e){
  const RK=['E','D','C','B','A'], ri=RK.indexOf(e.r);
  const inQ=new Set(rollQuest().map(x=>swapped(x).id));
  const ok=x=>x.id!==e.id&&!inQ.has(x.id)&&unlocked(x.r)&&hasEq(x)&&fitsLimits(x)&&!avoided(x);
  const near=x=>Math.abs(RK.indexOf(x.r)-ri);
  let pool=EX.filter(x=>ok(x)&&x.c===e.c);
  pool.sort((a,b)=>near(a)-near(b)||
    (b.mus.p.filter(m=>e.mus.p.includes(m)).length)-(a.mus.p.filter(m=>e.mus.p.includes(m)).length));
  if(pool.length<3)pool=pool.concat(EX.filter(x=>ok(x)&&x.c!==e.c&&
    x.mus.p.some(m=>e.mus.p.includes(m))));
  return pool.slice(0,3);
}
function doSwap(fromId,toId,hurts){
  if(!S.swaps||S.swaps.d!==today())S.swaps={d:today(),m:{}};
  S.swaps.m[fromId]=toId;
  if(hurts){
    const d=new Date();d.setDate(d.getDate()+14);
    S.avoid[fromId]=d.toLocaleDateString('en-CA');   // a quiet nudge, not a setting
  }
  const o=sess(); if(o){o.set=1;o.st='brief';o.endAt=0}
  save();closeSheet();render();
  toast(hurts?'Swapped · stepping around that one for a while':'Swapped for today');
}
function viewSwap(e){
  const alts=altsFor(e);
  const v=document.createElement('div');v.className='veil';v.dataset.veil='1';
  v.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Swap ${esc(e.n)}">
    <h2>Swap ${esc(e.n)}</h2>
    <div class="sub">Same credit, same reward. Pick whatever works today.</div>
    ${alts.length?alts.map(a=>`<button class="opt" data-swapto="${e.id}|${a.id}">
      <span>${esc(a.n)}<small>${esc(scaledDose(a))} · ${a.mus.p.map(musName).join(', ')}</small></span>
      <span class="tick">${pxIcon('tick')}</span></button>`).join('')
      :'<p class="note">Nothing else fits your kit right now. Widen your equipment or skip this one.</p>'}
    <p class="note">Is it bothering you? Swapping for that reason also steps around it for the next two weeks.</p>
    ${alts.length?`<button class="btn ghost" data-swaphurt="${e.id}|${alts[0].id}">This one hurts — swap and step around it</button>`:''}
    <button class="btn ghost" data-close>Keep it</button></div>`;
  document.body.appendChild(v);trapFocus(v);
}

/* ---------------- guided session ----------------
   A fullscreen run of today's quest, one movement at a time. Everything about
   it is designed for a phone propped on a bench: big targets, readable at a
   metre, and it survives being closed mid-workout. */
const RESTFOR={push:75,pull:75,legs:90,core:45,cardio:35,full:90};
const restLen=e=>RESTFOR[e.c]||60;
const sess=()=>{const o=S.sess;return o&&o.d===today()?o:null};

/* Keep the screen on. Feature-detected; a browser without it just works. */
let wakeLock=null;
async function keepAwake(on){
  try{
    if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener&&wakeLock.addEventListener('release',()=>{wakeLock=null})}
    else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}
  }catch(e){wakeLock=null}          // denied or unsupported: not worth telling anyone
}
addEventListener('visibilitychange',()=>{if(!document.hidden&&sess()&&tab==='run')keepAwake(true)});

/* A short tone, generated rather than shipped as a file. Off unless asked for. */
function beep(){
  if(!S.sound)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const a=new C(),o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=880;o.connect(g);g.connect(a.destination);
    g.gain.setValueAtTime(0.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,a.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.45);
    o.start();o.stop(a.currentTime+0.5);
    setTimeout(()=>a.close&&a.close(),800);
  }catch(e){}
}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

function questToday(){return rollQuest().map(e=>swapped(e))}
const routine=id=>S.routines.find(r=>r.id===id)||null;
const routineEx=r=>(r?r.ids:[]).map(id=>EX.find(x=>x.id===id)).filter(Boolean).map(swapped);
/* What the running session is working through. A routine brings its own list;
   otherwise it is today's quest. Swaps apply to both. */
function sessList(){
  const o=sess();
  if(o&&o.r){const r=routine(o.r); if(r)return routineEx(r)}
  return questToday();
}
/* The name field is uncontrolled, so grab whatever is in it before any action
   that re-renders — otherwise typing a name and tapping Add silently loses it. */
function saveName(){
  const el=document.getElementById('rname'), r=routine(editing);
  if(el&&r)r.n=(el.value||'').trim().slice(0,40)||'Routine';
}
function startSession(rid){
  const r=rid?routine(rid):null;
  const q=r?routineEx(r):questToday();
  S.sess={d:today(),i:0,set:1,st:'brief',endAt:0,paused:0,left:0,r:r?r.id:null,
          xp:0,gold:0,cleared:[],began:Date.now()};
  /* Skip straight past anything already logged from the checklist today — but
     only for the quest. A routine is yours to repeat if you want to. */
  if(!r){while(S.sess.i<q.length&&S.questDone.includes(q[S.sess.i].id))S.sess.i++;}
  if(S.sess.i>=q.length)S.sess.st='done';
  save();keepAwake(true);tab='run';render();
}
function endSession(keep){
  keepAwake(false);
  if(!keep)S.sess=null;
  save();tab='quest';render();
}
/* Advance past the current movement, logging it unless it was already logged. */
function clearMovement(e,actual,load){
  const o=sess();if(!o)return;
  /* Two different lists, and they are not interchangeable. `q` is today's quest
     and only ever answers "does this pay quest XP" and "is the quest cleared".
     `list` is what this session is actually working through — the routine's
     movements when one is running — and it is the only thing the cursor may be
     advanced against. Indexing the cursor into `q` ended a ten-movement routine
     at whatever questLen() happened to be, and skipped routine entries based on
     whether an unrelated quest movement had been logged. */
  const q=questToday(),inQ=q.some(x=>x.id===e.id);
  const list=sessList();
  if(!S.questDone.includes(e.id)){          // never pay twice for the same movement
    touchStreak();
    /* Everything logged goes in the ledger, not just quest movements —
       otherwise anything outside the quest pays again on every tap. */
    S.questDone.push(e.id);
    const xp=inQ?25:15;
    award(xp,5,e.st);
    o.xp+=xp;o.gold+=5;
    if(q.every(x=>S.questDone.includes(x.id))&&!S.questBonus){
      S.questBonus=true;S.clears++;S.cycle=(S.cycle||0)+1;award(80,25,null,false);o.xp+=80;o.gold+=25;
    }
  }
  if(actual!=null)recordPerf(e,actual,load);
  noteLogged(e);
  const nx=checkOutgrown(e);
  if(nx)toast('You have outgrown '+e.n+' · '+nx.n+' unlocked');
  checkAch();
  if(!o.cleared.includes(e.id))o.cleared.push(e.id);
  o.i++;o.set=1;o.st='brief';o.endAt=0;
  /* Step past anything already paid for today — but only on a quest run. A
     routine is yours to repeat, which is the same rule startSession() uses. */
  if(!o.r)while(o.i<list.length&&S.questDone.includes(list[o.i].id))o.i++;
  if(o.i>=list.length)o.st='done';
  save();render();
}
function beginRest(secs){
  const o=sess();if(!o)return;
  o.st='rest';o.endAt=Date.now()+secs*1000;o.paused=0;save();render();
}
function restLeft(){
  const o=sess();if(!o||!o.endAt)return 0;
  if(o.paused)return Math.max(0,Math.round(o.left));
  return Math.max(0,Math.round((o.endAt-Date.now())/1000));
}
/* One ticker for both the rest countdown and timed holds. */
let ticker=null,fired=false;
function runTicker(){
  clearInterval(ticker);
  ticker=setInterval(()=>{
    const o=sess();
    if(!o||tab!=='run'||(o.st!=='rest'&&o.st!=='hold')){clearInterval(ticker);ticker=null;return}
    const el=document.querySelector('[data-count]');
    const left=restLeft();
    if(el)el.textContent=left;
    const ring=document.querySelector('[data-ring]');
    if(ring&&o.total)ring.style.strokeDashoffset=String(2*Math.PI*52*(1-left/o.total));
    if(left<=0&&!fired){
      fired=true;buzz([0,60,50,120]);beep();
      clearInterval(ticker);ticker=null;
      if(o.st==='rest'){o.st='work';o.endAt=0;save();render()}
      else render();
    }
  },250);
}

/* ---------------- instant dungeon ----------------
   Six minutes, three stations, as many rounds as you can. It used to be a
   paragraph and a button that paid out instantly, which is exactly the problem
   the guided session was built to fix. Bodyweight on purpose: a dungeon you
   cannot enter in a hotel room is not instant. */
const DGLEN=360;
const dg=()=>{const o=S.dg;return o&&o.d===today()?o:null};
/* Three stations, picked to match the hunter's rank so it stays hard but doable. */
function dgStations(){
  /* Same test as a quest movement. hasEq() is the one that was missing, and it
     is the one that carries floor-only — without it the dungeon offered a wall
     push-up and a chair squat to someone with neither. */
  const ok=e=>!!e&&unlocked(e.r)&&hasEq(e)&&fitsLimits(e);
  const RK=['E','D','C','B','A'];
  const pick=(cat,...ids)=>{
    for(const id of ids){const e=EX.find(x=>x.id===id); if(ok(e))return e}
    /* Nothing preferred fits: take the easiest bodyweight movement in the
       category that does. Returning the last id regardless is what caused the
       bug, so there is deliberately no unconditional fallback here. */
    return EX.filter(e=>e.c===cat&&!(e.eq||[]).length&&ok(e))
      .sort((a,b)=>RK.indexOf(a.r)-RK.indexOf(b.r))[0]||null;
  };
  return [
    {e:pick('push','pushup','kneepush','incpush','wallpush'),label:'5 reps'},
    {e:pick('legs','squat','chairsq'),                       label:'8 reps'},
    {e:pick('core','plank','kneeplank'),                     label:'20 seconds'}
  ].filter(s=>s.e);
}
function dgLeft(){
  const o=dg(); if(!o||!o.endAt)return 0;
  if(o.paused)return Math.max(0,Math.round(o.left));
  return Math.max(0,Math.round((o.endAt-Date.now())/1000));
}
function startDungeon(){
  S.dg={d:today(),st:'run',endAt:Date.now()+DGLEN*1000,paused:0,left:DGLEN,step:0,rounds:0};
  save();keepAwake(true);dgFired=false;tab='dungeon';render();
}
function endDungeon(){
  const o=dg(); if(!o)return;
  o.st='done';
  if(!o.paid){
    o.paid=1;
    touchStreak();award(60,20,'END');
    if((S.dgBest||0)<o.rounds)S.dgBest=o.rounds;
    checkAch();
  }
  keepAwake(false);save();render();
}
let dgTicker=null,dgFired=false;
function runDgTicker(){
  clearInterval(dgTicker);
  dgTicker=setInterval(()=>{
    const o=dg();
    if(!o||tab!=='dungeon'||o.st!=='run'){clearInterval(dgTicker);dgTicker=null;return}
    const left=dgLeft();
    const el=document.querySelector('[data-count]');
    if(el)el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    const ring=document.querySelector('[data-ring]');
    if(ring)ring.style.strokeDashoffset=String(2*Math.PI*52*(1-left/DGLEN));
    if(left<=0&&!dgFired){dgFired=true;buzz([0,80,60,140]);beep();
      clearInterval(dgTicker);dgTicker=null;endDungeon()}
  },250);
}
function viewDungeon(){
  const o=dg(); if(!o)return viewQuest();
  const st=dgStations();
  if(o.st==='done'){
    const best=S.dgBest||0;
    return `<div class="runwrap"><div class="run center">
      <p class="runstep">Dungeon cleared</p>
      <h2 class="runh">${o.rounds} round${o.rounds===1?'':'s'}</h2>
      <div class="sumgrid">
        <div><span>Rounds</span><b>${o.rounds}</b></div>
        <div><span>Best</span><b>${best}</b></div>
        <div><span>Earned</span><b>+60</b></div>
      </div>
      <p class="nextup" style="margin-top:20px"><span>${o.rounds>=best&&o.rounds>0?'New best':'Beat next time'}</span>
        <b>${o.rounds>=best&&o.rounds>0?'That is the number to beat.':best+' rounds'}</b></p>
      <button class="btn big" data-dgdone>Done</button>
    </div></div>`;
  }
  /* st can be shorter than three if a category has nothing you can do today. */
  if(!st.length)return viewQuest();
  const n=st.length;
  const left=dgLeft(), cur=st[o.step%n], nextS=st[(o.step+1)%n];
  return `<div class="runwrap">
    <div class="runtop">
      <button class="runx" data-dgexit aria-label="Leave the dungeon">${pxIcon('close')}</button>
      <span class="runpos">Round ${o.rounds+1}</span>
      <button class="runx" data-dgpause aria-label="${o.paused?'Resume':'Pause'}">${pxIcon(o.paused?'play':'pause')}</button>
    </div>
    <div class="run center">
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="52" class="ring-bg"/>
          <circle cx="60" cy="60" r="52" class="ring-fg" data-ring
            style="stroke-dasharray:${2*Math.PI*52};stroke-dashoffset:${2*Math.PI*52*(1-left/DGLEN)}"/></svg>
        <div class="ringnum"><b data-count>${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b>
          <span>remaining</span></div>
      </div>
      <p class="runstep" style="margin-top:14px">Station ${(o.step%n)+1} of ${n}</p>
      <h2 class="runh">${esc(cur.e.n)}</h2>
      <p class="bignum" style="font-size:clamp(40px,14vw,68px);margin-top:4px">${cur.label}</p>
      <button class="btn big" data-dgnext>Station done</button>
      <p class="nextup"><span>Then</span><b>${esc(nextS.e.n)} · ${nextS.label}</b></p>
      <button class="btn ghost" data-dgstop>End it here</button>
    </div></div>`;
}

/* ---------------- UI ---------------- */
let tab='quest',filt={r:'all',c:'all',eq:'mine',m:'all'},open=null,ob,editing=null,filtOpen=false;
ob={step:0,name:'',exp:null,goal:null,eq:[],days:null,limits:[],class:'bladebound',weapon:'longsword',palette:'crimson'};
const root=document.getElementById('root');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const PALVARS=['crimson','magenta','core','line','deepblade','guard','grip','pommel',
  'void','deep','ash','ash2','bone'];
function applyLook(id){
  const p=PALETTES[id]||pal(),r=document.documentElement.style;
  PALVARS.forEach(k=>r.setProperty('--'+k,p[k]));
  r.setProperty('--c1',rgbOf(p.crimson).join(','));
  r.setProperty('--m1',rgbOf(p.magenta).join(','));
}
/* A palette is usable if it's one of the free three, your class's own colour,
   or something you bought. Cosmetic only — none of this touches progression. */
const palList=()=>Object.keys(PALETTES);
const wepOwned=id=>!WEAPONPRICE[id]||S.owned.includes('wep_'+id);
function palSwatch(id,on,attr){
  const p=PALETTES[id];
  return `<button class="palb ${on?'on':''}" ${attr} title="${esc(p.n)}"
    aria-label="${esc(p.n)} palette${on?', selected':''}" aria-pressed="${on?'true':'false'}"
    style="--pa:${p.core};--pb:${p.magenta};--pc:${p.deepblade}"><i></i></button>`;
}
/* Class, weapon and palette pickers are identical in onboarding and the vault —
   only the data attribute differs, so the markup lives in one place. */
const clsGrid=(sel,attr)=>`<div class="clsgrid">${CLSKEYS.map(k=>
  `<button class="clsb ${sel===k?'on':''}" data-${attr}="${k}">${CLASSES[k].n}<small>${CLASSES[k].an}</small></button>`).join('')}</div>`;
/* Locked weapons still show — you can see what you're saving for. In the vault
   they're buyable in place; during onboarding you have no gold, so they read
   as locked and nothing more. */
const wepGrid=(sel,attr,buy)=>`<div class="clsgrid">${WEPKEYS.map(k=>{
  const own=wepOwned(k),p=WEAPONPRICE[k];
  return `<button class="clsb ${sel===k&&own?'on':''} ${own?'':'lock'}"
    data-${attr}="${k}" ${own||buy?'':'disabled'}>${WEAPONNAME[k]}${
    own?'':`<small>${coinIco()}${p}</small>`}</button>`}).join('')}</div>`;

function titleName(){
  const t=ALLTITLES[S.title]||EARNED[S.title];
  return t?t.n:RANK_TITLE[rankOf(S.lvl)];
}

/* ----- onboarding ----- */
function viewOB(){
  const s=ob.step;
  const wrap=(n,title,lead,body,btn,ok)=>`<div class="ob">
    <div class="obstep">${n} of 7</div><h2>${title}</h2><p class="oblead">${lead}</p>${body}
    <button class="btn" data-obnext ${ok?'':'disabled'}>${btn}</button>
    ${s>0?'<button class="btn ghost" data-obback>Back</button>':''}</div>`;
  const opt=(v,k,label,sub,multi)=>{
    const on=multi?ob.eq.includes(v):ob[k]===v;
    return `<button class="opt ${on?'on':''}" data-ob="${k}:${v}">
      <span>${label}${sub?`<small>${sub}</small>`:''}</span><span class="tick">${pxIcon('tick')}</span></button>`};
  if(s===0)return wrap(1,'The blade has chosen you.',
    'Every ascendant needs a name. Yours gets etched into the steel.',
    `<input class="namein" id="obname" maxlength="18" placeholder="Enter your name" value="${esc(ob.name)}" autocomplete="off">`,
    'Begin',ob.name.trim().length>0);
  if(s===1){
    const c=CLASSES[ob.class];
    return wrap(2,'Choose your class.',
      'Cosmetic only. Class sets your aura and what your tiers are called. Every class earns XP, gold and ranks at exactly the same rate — nobody gets an easier curve.',
      `<div class="wprev">${bladeSVG(ob.weapon)}</div>
       <p class="picklab">Class</p>
       ${clsGrid(ob.class,'obcls')}
       <p class="clsline"><b>${esc(c.n)}.</b> ${esc(c.d)} Aura tiers run ${esc(c.tiers[0])} to ${esc(c.tiers[4])}.</p>
       <p class="picklab" style="margin-top:20px">Weapon</p>
       ${wepGrid(ob.weapon,'obwep')}
       <p class="picklab" style="margin-top:20px">Palette</p>
       <div class="palrow">${palList().map(p=>palSwatch(p,ob.palette===p,`data-obpal="${p}"`)).join('')}</div>
       <p class="clsline"><b>${esc(PALETTES[ob.palette].n)}.</b> ${esc(PALETTES[ob.palette].d)} All eight are yours from the start.</p>`,

  }

    'Sets your starting level and which skills unlock now. Be honest, nobody is watching.',
    `<div class="opts">
      ${opt('new','exp','Brand new','Never really trained, or years off')}
      ${opt('some','exp','A little','On and off. You know a squat from a deadlift')}
      ${opt('trained','exp','Trained','Consistent for a while, comfortable in a gym')}
      ${opt('adv','exp','Advanced','Years in. You have numbers you care about')}
    </div>`,'Continue',!!ob.exp);
  if(s===3)return wrap(4,'What are you chasing?',
    'Your daily quests get built around this. Changeable any time.',
    `<div class="opts">
      ${opt('muscle','goal','Build muscle','More pressing and pulling volume')}
      ${opt('strong','goal','Get stronger','Heavier compounds, lower reps')}
      ${opt('cond','goal','Conditioning','More cardio and full-body work')}
      ${opt('consist','goal','Just move more','Balanced and forgiving. Habit first')}
    </div>`,'Continue',!!ob.goal);
  if(s===5)return wrap(6,'Anything to work around?',
    'Optional. Pick any area you would rather not load and the app will build around it. You can change this any time.',
    `<div class="opts">${LIMITS.map(l=>
      `<button class="opt ${ob.limits.includes(l.k)?'on':''}" data-oblim="${l.k}">
        <span>${l.n}${l.d?`<small>${l.d}</small>`:''}</span><span class="tick">${pxIcon('tick')}</span></button>`).join('')}</div>`,
    ob.limits.length?'Continue':'Nothing to work around',true);
  if(s===4)return wrap(5,'What can you get to?',
    'Pick everything you have access to. Nothing selected is fine — the bodyweight library is huge.',
    eqPicker(ob.eq,'obeq'),
    ob.eq.length?'Continue':'I train with nothing but my body',true);
  return wrap(7,'How many days a week?',
    'Decides how forgiving your streak is. Rest days are part of the plan, not a failure.',
    `<div class="opts">
      ${opt(3,'days','3 days','Aura survives up to 4 idle days')}
      ${opt(4,'days','4 days','Aura survives up to 3 idle days')}
      ${opt(5,'days','5 days','Aura survives up to 2 idle days')}
      ${opt(6,'days','6 days','Aura survives 1 idle day')}
    </div>`,'Awaken',!!ob.days);
}
function finishOB(){
  S.setup=true;S.newsSeen=NEWS.v;   // a new hunter just saw the tour, not a changelog
  S.name=ob.name.trim().slice(0,18);S.exp=ob.exp;S.goal=ob.goal;
  S.eq=ob.eq.slice();S.days=ob.days;S.lvl=XPLEVEL[ob.exp]||1;
  S.class=ob.class;S.weapon=ob.weapon;S.palette=ob.palette;S.limits=ob.limits.slice();
  const bump={new:0,some:2,trained:5,adv:9}[ob.exp]||0;
  for(const k in S.stats)S.stats[k]+=bump;
  save();tab='quest';render();showIntro();
}

/* ----- weapons -----
   Every weapon lives in the same 120x300 box, so the hero, the preview and the
   shareable card all take one without any layout change. Fills come from the
   palette custom properties only — never a literal hex — so recolouring is free. */
const WEAPONDEFS=`<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="var(--core)"/>

/* The hero is the first viewport's whole argument: who you are, what today
   is, how alive the streak is, and the one control that starts it. The primary
   action lives inside the volume rather than below it, because a screen that
   offers six equally-weighted things offers none. */
function heroBlock(){
  const i=auraIdx(),pct=Math.min(100,(i/(AURA.length-1))*100);
  const dead=S.streak===0;
  const plan=splitToday();
  const q=rollQuest(),cleared=q.filter(e=>S.questDone.includes(e.id)).length;
  const all=q.length&&cleared===q.length;
  const o=sess();
  return `<section class="hero">
    <canvas id="aura"></canvas>
    <div class="sigil" style="--sig:${dead?.12:.35+i*.14}"></div>
    <div class="blade">
      <div class="blade-halo" style="--glo:${dead?0:.3+i*.18}"></div>
      <canvas id="hunter" class="hunter" aria-hidden="true"></canvas>
    </div>
    <div class="name-etch">${esc(S.name||'HUNTER')}</div>
    <p class="heroplan">${plan?`<b>${esc(plan.n)}</b> · day ${plan.i+1} of ${plan.len}`
      :`<b>${q.length} exercise${q.length===1?'':'s'}</b> today`}${
      cleared?` · ${cleared} cleared`:''}</p>
    <div class="aurawrap">
      <div class="aurascale">
        ${AURA.map((a,k)=>`<span class="as ${k<=i?'on':''} ${k===i?'cur':''}">`+
          `<i></i>${esc(tierName(k))}</span>`).join('')}
      </div>
      <div class="aurabar" role="progressbar" aria-valuenow="${i}" aria-valuemin="0"
           aria-valuemax="${AURA.length-1}" aria-valuetext="${esc(tierName(i))}"
           aria-label="Aura tier"><i style="clip-path:inset(0 ${100-pct}% 0 0)"></i></div>
      <p class="auranote">${dead
        ? 'Your aura has gone out. Clear anything today to relight it.'
        : `<b>${S.streak}</b> day streak · fades after ${gapAllowed()} idle day${gapAllowed()>1?'s':''}`}</p>
      ${all?'<div class="cleared">Quest cleared</div>'
        :`<button class="btn big" data-begin>${o?'Resume quest':'Begin quest'}</button>`}
    </div>
  </section>`;
}

/* The HUD: who you are and how charged you are, in four lines. No gold, no
   brand mark — the screen belongs to the work, not to the app's name. */
function crestBlock(){
  const r=rankOf(S.lvl), n=need(S.lvl);
  const xpPct=Math.min(100,Math.round(S.xp/n*100));
  const bodyPct=Math.min(100,Math.round((S.streak/Math.max(1,AURA[AURA.length-1].min))*100));
  const stmPct=Math.min(100,Math.round((S.questDone.length/Math.max(1,questLen()))*100));
  return `<header class="mast">
    <div class="lvlrow">
      <div class="lvlbadge"><div class="ab">L V</div><span>${S.lvl}</span></div>
      <div class="lvlmeta"><div class="ab">H U N T E R</div>
        <div class="lvlline"><b>${esc(S.name||'HUNTER')}</b></div></div>
      <div style="text-align:right"><div class="ab" style="letter-spacing:.3em">R A N K</div>
        <div class="rkbig">${r}</div></div>
    </div>
    <div class="gauges">
      <div class="g"><u>BODY</u><div class="track"><i style="width:${bodyPct}%"></i></div><em>${bodyPct}%</em></div>
      <div class="g"><u>STM</u><div class="track"><i style="width:${stmPct}%"></i></div><em>${stmPct}%</em></div>
      <div class="g"><u>EXP</u><div class="track"><i class="a" style="width:${xpPct}%"></i></div><em>${xpPct}%</em></div>
    </div>
  </header>`;
}

function statsBlock(){
  const max=Math.max(...Object.values(S.stats),20);
  return `<section class="props">${Object.entries(S.stats).map(([k,v])=>
    `<div class="prop"><span>${k}</span><b>${v}</b>
      <i style="--v:${Math.round(v/max*100)}%" role="img" aria-label="${k} ${v}"></i></div>`).join('')}</section>`;
}

/* Ring used by both timers. 120x120, stroke dashed to the remaining fraction. */

}
function viewKitCheck(){

function viewRun(){
  const o=sess(); if(!o)return viewQuest();
  const q=sessList();
  if(o.st==='done'||o.i>=q.length)return viewRunDone(o,q);
  const e=q[o.i], sets=(doseParts(e)||{}).sets||3, tgt=targetReps(e);
  const head=`<div class="runtop">
    <button class="runx" data-runexit aria-label="Leave the session">${pxIcon('close')}</button>
    <span class="runpos">${o.i+1} of ${q.length}</span>
    <button class="runx" data-sound aria-label="${S.sound?'Sound on':'Sound off'}"
      aria-pressed="${S.sound?'true':'false'}">${pxIcon(S.sound?'sound':'mute')}</button>
  </div>`;

  if(o.st==='brief')return `<div class="runwrap">${head}<div class="run">
    <p class="runstep">Exercise ${o.i+1}</p>
    <h2 class="runh">${esc(e.n)}</h2>
    <p class="runsub">${CATS[e.c]} · builds ${e.st} · ${esc(scaledDose(e))}</p>
    ${(S.perf[e.id]||[]).length?`<p class="lastlog"><span>Last time</span>
      ${S.perf[e.id].slice(-3).map(v=>fmtPerf(v,e)).join(' · ')}</p>`:''}
    ${bodyMap(e.mus)}
    <ul class="cues">${e.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
    <button class="btn big" data-runstart>Start · ${esc(scaledDose(e))}</button>
    <button class="btn ghost" data-swap="${e.id}">Swap this exercise</button>
    <button class="btn ghost" data-runskip>Skip it</button>
  </div></div>`;

  if(o.st==='hold'){
    const left=restLeft();
    return `<div class="runwrap">${head}<div class="run center">
      <p class="runstep">Set ${o.set} of ${sets}</p>
      <h2 class="runh">${esc(e.n)}</h2>
      <div class="ringwrap">${ringSVG(left,o.total||tgt)}</div>
      <button class="btn big" data-holddone>${left>0?'Done early':'Set complete'}</button>
      <button class="btn ghost" data-holdpause>${o.paused?'Resume':'Pause'}</button>
    </div></div>`;
  }

  if(o.st==='work')return `<div class="runwrap">${head}<div class="run center">
    <p class="runstep">Set ${o.set} of ${sets}</p>
    <h2 class="runh">${esc(e.n)}</h2>
    <p class="bignum">${tgt===null?esc(scaledDose(e)):tgt}</p>
    <p class="runsub">${tgt===null?'':'reps'}</p>
    <button class="btn big" data-setdone>Set complete</button>
    ${tgt===null?'':`<div class="logrow">
      <label for="actual">Got a different number?</label>
      <input class="prin" id="actual" type="number" inputmode="numeric" min="0" placeholder="${tgt}">
    </div>`}
    ${loaded(e)?`<div class="logrow">
      <label for="load">Weight, in ${S.unit}</label>
      <div class="prin-wrap"><input class="prin" id="load" type="number" inputmode="decimal"
        min="0" step="0.5" placeholder="${lastLoad(e)||'—'}" value="${o.load||''}"></div>
    </div>`:''}
    <button class="btn ghost" data-runskip>Skip the rest of this exercise</button>
  </div></div>`;

  if(o.st==='rest'){
    const left=restLeft(), nextSet=o.set<=sets;
    const nxt=nextSet?`Set ${o.set} of ${sets} · ${esc(e.n)}`
      :(q[o.i+1]?esc(q[o.i+1].n):'Quest complete');
    return `<div class="runwrap">${head}<div class="run center">
      <p class="runstep">Rest</p>
      <div class="ringwrap">${ringSVG(left,o.total||60)}</div>
      <p class="nextup"><span>Next</span><b>${nxt}</b></p>
      <button class="btn big" data-restskip>Skip rest</button>
    </div></div>`;
  }
  return '';
}

/* Everything logged, newest movement first. Direction compares the most recent
   entry with the one before it on the same movement — weight first, because on
   a loaded lift more weight at fewer reps is still progress and the reverse
   reading would be wrong. */
function liftsBlock(){
  const ids=Object.keys(S.perf).filter(id=>(S.perf[id]||[]).length);
  if(!ids.length)return `<section class="block">
    <div class="blockhead"><h2>Lifts</h2></div>
    <p class="note">Nothing logged yet. Numbers you enter during a quest show up here,
    with what you did last time next to them.</p></section>`;
  const rows=ids.map(id=>{
    const e=EX.find(x=>x.id===id); if(!e)return null;
    const a=S.perf[id], last=a[a.length-1], prev=a.length>1?a[a.length-2]:null;
    let dir=0;
    if(prev){ dir = last.l!==prev.l ? Math.sign(last.l-prev.l) : Math.sign(last.r-prev.r) }
    return {e,a,last,prev,dir};
  }).filter(Boolean);
  rows.sort((x,y)=>y.a.length-x.a.length||x.e.n.localeCompare(y.e.n));
  return `<section class="block">
    <div class="blockhead"><h2>Lifts</h2><span class="tally">${rows.length} tracked</span></div>
    ${rows.map(r=>`<div class="lift">
      <div class="liftn"><h4>${esc(r.e.n)}</h4>
        <p>Target now <b>${esc(scaledDose(r.e))}</b></p></div>
      <div class="liftv">
        <b class="${r.dir>0?'up':r.dir<0?'dn':''}">${fmtPerf(r.last,r.e)}${
          r.dir>0?' ▲':r.dir<0?' ▼':''}</b>
        <span>${r.prev?'was '+fmtPerf(r.prev,r.e):'first time'}</span>
      </div></div>`).join('')}
    <p class="note">The last five results per exercise are kept. Two sessions at target
    steps it up${'\u2009'}— on anything you can load, that means weight, not more reps.</p>
  </section>`;
}
function heatmap(){
  const cells=[];const now=new Date();
  for(let i=69;i>=0;i--){
    const d=new Date(now.getTime()-i*864e5).toLocaleDateString('en-CA');
    const n=S.history[d]||0;
    const lv=n?(n>=4?3:n>=2?2:1):0;
    cells.push(`<i class="hm${lv}" data-lv="${lv}" role="img"
      aria-label="${d}: ${n} logged" title="${d}: ${n} logged"></i>`);
  }
  return `<div class="heat">${cells.join('')}</div>
    <div class="heatkey"><span>10 weeks ago</span><span>today</span></div>`;
}

  const out=[];

  for(const id of S.owned)if(EARNED[id])out.push(Object.assign({k:'title',earned:1},EARNED[id]));
  out.push(POTION);
  return out;
}

/* The Sunday-night card. The hunter card says who you are; this one says what
   you did this week, which is a different flex. */
function weekStats(){
  const days=[],now=new Date();
  for(let i=6;i>=0;i--){
    const d=new Date(now.getTime()-i*864e5).toLocaleDateString('en-CA');
    days.push({d,n:S.history[d]||0});
  }
  const logged=days.reduce((a,b)=>a+b.n,0);
  const active=days.filter(x=>x.n>0).length;
  const best=days.reduce((a,b)=>b.n>a.n?b:a,days[0]);
  const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return {days,logged,active,best,wd:WD[new Date(best.d+'T12:00').getDay()]};
}

/* Focus goes into a sheet when it opens and comes back to whatever opened it
   when it closes, so a keyboard user is never dumped at the top of the page. */
let lastFocus=null;
const FOCUSABLE='button:not([disabled]),[href],input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
function trapFocus(v){
  lastFocus=document.activeElement;
  const first=v.querySelector(FOCUSABLE);
  if(first)first.focus();
  v.addEventListener('keydown',ev=>{
    if(ev.key!=='Tab')return;
    const f=[...v.querySelectorAll(FOCUSABLE)];
    if(!f.length)return;
    const a=f[0],z=f[f.length-1];
    if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();z.focus()}
    else if(!ev.shiftKey&&document.activeElement===z){ev.preventDefault();a.focus()}
  });
}
function closeSheet(){
  const had=document.querySelector('[data-veil]');
  document.querySelectorAll('[data-veil]').forEach(v=>{
    v.remove()});
  open=null;
  if(had&&lastFocus&&lastFocus.isConnected){lastFocus.focus();lastFocus=null}
}
/* Escape closes whatever is on top: a sheet, the card, or the tour. */
addEventListener('keydown',ev=>{
  if(ev.key!=='Escape')return;
  if(document.querySelector('.sysmsg'))return;      // the intro must be accepted
  if(tour.on){endTour();toast('Skipped. Replay it from the Vault.');return}
  if(document.querySelector('[data-veil]')){closeSheet();return}
});

/* ----- level up ----- */
let shards=[],BW,BH,burstOn=false,bx,bc;
function sizeBurst(){if(!bc)return;BW=bc.width=innerWidth*2;BH=bc.height=innerHeight*2}
function shardBurst(n,spd){
  for(let i=0;i<n;i++){const a=Math.random()*6.3,s=spd*(.35+Math.random());
    shards.push({x:BW/2,y:BH*.42,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,
      r:1+Math.random()*3.2,dec:.008+Math.random()*.012})}
}
function burstLoop(){
  if(!burstOn||!bc||!bc.isConnected)return;
  bx.clearRect(0,0,BW,BH);
  for(let i=shards.length-1;i>=0;i--){
    const p=shards[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.975;p.vy*=.975;p.life-=p.dec;
    if(p.life<=0){shards.splice(i,1);continue}
    bx.globalAlpha=p.life;
    bx.fillStyle=p.life>.7?cssv('--core'):p.life>.35?cssv('--magenta'):cssv('--crimson');
    bx.beginPath();bx.arc(p.x,p.y,p.r*2.2,0,6.3);bx.fill();
  }
  requestAnimationFrame(burstLoop);
}
function showLevelUp(){
  const lv=pendingLevel;pendingLevel=null;
  const r=rankOf(lv),prev=rankOf(lv-1),ranked=r!==prev;
  const el=document.createElement('div');el.className='awaken';
  el.innerHTML=`<canvas id="burst"></canvas><div class="aflash"></div>
    <div class="acore"></div><div class="aring r1"></div><div class="aring r2"></div>
    <div class="atext">
      <span class="asmall">${ranked?'Rank up':'Level up'}</span>
      <span class="abig">LEVEL ${lv}</span>
      <span class="asub">${ranked?`Now <b>${r}-Rank · ${RANK_TITLE[r]}</b>`:'Every stat increased by 1'}</span>
      <div class="aloot">
        <span class="aloot-i">All stats +1</span>
        ${ranked?'<span class="aloot-i">New skills unlocked</span>':''}
      </div>
    </div>
    <p class="atap">Tap anywhere to continue</p>`;
  el.setAttribute('role','status');
  el.setAttribute('aria-live','polite');
  /* Any earlier one is gone before this one goes up: two stacked overlays was
     the other way to end up staring at black. */
  document.querySelectorAll('.awaken').forEach(x=>x.remove());
  el.dataset.live='1';
  document.body.appendChild(el);
  let done=false;
  const bye=()=>{if(done)return;done=true;burstOn=false;
    clearTimeout(hardStop);removeEventListener('keydown',esc);
    el.remove();if(ranked)render()};
  /* Dismissible from the first frame, by tap or by key, and always announced
     with a visible way out rather than a mystery black screen. */
  el.addEventListener('click',bye);
  el.addEventListener('keydown',bye);
  const esc=ev=>{if(ev.key==='Escape'||ev.key===' '||ev.key==='Enter')bye()};
  addEventListener('keydown',esc);
  const hardStop=setTimeout(bye,7000);          // nothing survives this
  const cleanup=()=>{clearTimeout(hardStop);removeEventListener('keydown',esc)};
  if(REDUCED){                       // a fade and the text, nothing else
    el.querySelector('.atext').style.opacity=1;
    setTimeout(()=>{if(el.isConnected)bye()},4200);
    return;
  }
  bc=el.querySelector('#burst');bx=bc.getContext('2d');sizeBurst();
  shards=[];burstOn=true;requestAnimationFrame(burstLoop);
  const core=el.querySelector('.acore'),flash=el.querySelector('.aflash'),
        txt=el.querySelector('.atext'),r1=el.querySelector('.r1'),r2=el.querySelector('.r2');
  setTimeout(()=>{core.style.transition='transform 1.05s cubic-bezier(.35,.8,.3,1)';
    core.style.transform='translate(-50%,-50%) scale(1)';shardBurst(40,3)},120);
  setTimeout(()=>{core.style.transition='transform .22s ease-in';
    core.style.transform='translate(-50%,-50%) scale(.35)'},1150);
  setTimeout(()=>{
    if(navigator.vibrate)navigator.vibrate([0,45,40,110]);
    core.style.transition='transform .5s cubic-bezier(.15,1.1,.4,1)';
    core.style.transform='translate(-50%,-50%) scale(3.4)';
    flash.style.opacity=.92;shardBurst(220,26);
    setTimeout(()=>{flash.style.transition='opacity .55s';flash.style.opacity=0},60);
    [r1,r2].forEach((rr,i)=>setTimeout(()=>{
      rr.style.transition='transform 1.15s cubic-bezier(.1,.8,.25,1), opacity 1.15s';
      rr.style.opacity=.85;rr.style.transform='translate(-50%,-50%) scale(6)';
      setTimeout(()=>{rr.style.opacity=0},420)},i*170));
  },1400);
  setTimeout(()=>{core.style.transition='transform 1.2s ease-out, opacity 1.2s';
    core.style.transform='translate(-50%,-50%) scale(1.5)';core.style.opacity=.3},1960);
  setTimeout(()=>{txt.style.opacity=1},2120);
  setTimeout(()=>{if(el.isConnected)bye()},5400);
}

    const order=['auto','short','standard','long'];
    S.vol=order[(order.indexOf(S.vol)+1)%order.length];
    /* Today's quest is already half done for some people; keep what they have
       cleared and let the new length apply from the next roll. */
    save();render();
    toast(S.vol==='auto'?'Session length follows your days again'
      :questLen()+' exercises a quest');return}
  /* ----- guided session ----- */
  if(t.closest('[data-begin]')){
    if(S.kitAsked===today()&&sess()){keepAwake(true);tab='run';render();return}
    if(!sess())startSession();
    tab=(S.kitAsked===today())?'run':'kit';render();return}
  if(t.closest('[data-newsdone]')){S.newsSeen=NEWS.v;save();render();return}
  if(t.closest('[data-reroll]')){
    if(!canReroll())return;
    S.gold-=REROLL;S.qroll=(S.qroll||0)+1;
    /* A reroll must not carry the old session, which points at the old list. */
    S.sess=null;S.swaps=null;
    save();render();toast('Quest rerolled · -'+REROLL+' gold');return}
  if(t.closest('[data-kitopen]')){tab='kit';render();return}
  if(t.closest('[data-newroutine]')){
    const r={id:'r'+Date.now().toString(36),n:'New routine',ids:[]};
    S.routines.push(r);editing=r.id;save();tab='redit';render();return}
  const er=t.closest('[data-editroutine]');
  if(er){editing=er.dataset.editroutine;tab='redit';render();return}
  const rr=t.closest('[data-runroutine]');
  if(rr){const r=routine(rr.dataset.runroutine);
    if(!r||!r.ids.length)return;
    startSession(r.id);return}
  const ra=t.closest('[data-radd]');
  if(ra){const r=routine(editing);
    if(r&&r.ids.length<20&&!r.ids.includes(ra.dataset.radd)){
      saveName();r.ids.push(ra.dataset.radd);save();render()}
    return}
  const rd=t.closest('[data-rdrop]');
  if(rd){const r=routine(editing);
    if(r){saveName();r.ids=r.ids.filter(id=>id!==rd.dataset.rdrop);save();render()}
    return}
  const rm=t.closest('[data-rmove]');
  if(rm){const r=routine(editing),[id,dir]=rm.dataset.rmove.split(':');
    if(r){const i=r.ids.indexOf(id),j=i+ +dir;
      if(i>=0&&j>=0&&j<r.ids.length){saveName();
        const tmp=r.ids[i];r.ids[i]=r.ids[j];r.ids[j]=tmp;save();render()}}
    return}
  if(t.closest('[data-rsave]')){saveName();save();
    toast('Routine saved');tab='quest';render();return}
  if(t.closest('[data-rdelete]')){
    S.routines=S.routines.filter(x=>x.id!==editing);editing=null;save();
    toast('Routine deleted');tab='quest';render();return}
  if(t.closest('[data-kitdone]')){
    S.kitAsked=today();
    if(!sess())startSession(); else {const o=sess();o.i=0;o.set=1;o.st='brief';o.endAt=0}
    save();keepAwake(true);tab='run';render();return}
  if(t.closest('[data-runexit]')){endSession(true);return}
  if(t.closest('[data-runfinish]')){endSession(false);return}
  if(t.closest('[data-sound]')){S.sound=!S.sound;save();
    if(S.sound)beep();
    toast(S.sound?'Sound on':'Sound off');render();return}
  if(t.closest('[data-runstart]')){
    const o=sess(),q=sessList(),e=q[o.i];
    if(isTimed(e)){o.st='hold';o.total=targetReps(e);o.endAt=Date.now()+o.total*1000;o.paused=0;fired=false}
    else o.st='work';
    save();render();return}
  if(t.closest('[data-holdpause]')){
    const o=sess();
    if(o.paused){o.endAt=Date.now()+o.left*1000;o.paused=0;fired=false}
    else{o.left=restLeft();o.paused=1}
    save();render();return}
  const hd=t.closest('[data-holddone]');
  if(hd){const o=sess(),q=sessList(),e=q[o.i],sets=(doseParts(e)||{}).sets||3;
    buzz([0,40]);
    if(o.set>=sets){clearMovement(e,null);return}
    o.set++;o.total=restLen(e);fired=false;beginRest(o.total);return}
  const sd=t.closest('[data-setdone]');
  if(sd){const o=sess(),q=sessList(),e=q[o.i],sets=(doseParts(e)||{}).sets||3;
    const inp=document.getElementById('actual');
    const got=inp&&inp.value!==''?parseInt(inp.value,10):null;
    const lin=document.getElementById('load');
    const lot=lin&&lin.value!==''?parseFloat(lin.value):null;
    /* Remember it for the rest of the movement, so the weight is typed once. */
    if(Number.isFinite(lot)&&lot>0)o.load=lot;
    const useLoad=Number.isFinite(o.load)&&o.load>0?o.load:null;
    buzz([0,40]);
    /* Say it back. Typing a number into a box that then vanishes gives you no
       reason to believe it was recorded. */
    if(got!=null&&Number.isFinite(got)&&got>0){
      o.log=o.log||[];o.log.push({n:e.n,set:o.set,reps:got,load:useLoad||0});
      toast('Set '+o.set+' · '+got+' reps'+(useLoad?' × '+useLoad+S.unit:'')+' logged');
    }
    if(o.set>=sets){clearMovement(e,got,useLoad);return}
    if(got!=null)recordPerf(e,got,useLoad);
    o.set++;o.total=restLen(e);fired=false;beginRest(o.total);return}
  if(t.closest('[data-restskip]')){const o=sess();o.st='work';o.endAt=0;fired=false;save();render();return}
  if(t.closest('[data-runskip]')){
    const o=sess(),q=sessList();o.i++;o.set=1;o.st='brief';o.endAt=0;o.load=0;
    if(o.i>=q.length)o.st='done';
    save();render();return}
  const swp=t.closest('[data-swap]');
  if(swp){const e=EX.find(x=>x.id===swp.dataset.swap);if(e)viewSwap(e);return}
  const st2=t.closest('[data-swapto]');
  if(st2){const [a,b]=st2.dataset.swapto.split('|');doSwap(a,b,false);return}
  const shr=t.closest('[data-swaphurt]');
  if(shr){const [a,b]=shr.dataset.swaphurt.split('|');doSwap(a,b,true);return}

  const kb=t.closest('[data-kit]');
  if(kb){const k=kb.dataset.kit;
    /* Re-rolls today against the new constraint. Anything already logged stays
       logged — questDone is only cleared when the date rolls over — so nobody
       is punished for switching mid-day, and questBonus stops a second payout. */
    if(k==='custom'){setDayEq('custom',effEq().slice());tab='dayeq';render();return}
    setDayEq(k);
    if(sess()){const o=sess();o.i=0;o.set=1;o.st='brief';o.endAt=0;save()}
    render();return}
  const td=t.closest('[data-toggleday]');
  if(td){const k=td.dataset.toggleday,o=dayEq(),cur=(o&&o.k==='custom'?o.eq:effEq()).slice();
    const i=cur.indexOf(k);i>=0?cur.splice(i,1):cur.push(k);
    setDayEq('custom',cur);render();return}
  if(t.closest('[data-daydone]')){tab=sess()?'kit':'quest';toast('Quest rebuilt for today');render();return}

  const ol=t.closest('[data-oblim]');
  if(ol){const k=ol.dataset.oblim,i=ob.limits.indexOf(k);
    i>=0?ob.limits.splice(i,1):ob.limits.push(k);render();return}
  const tl=t.closest('[data-togglelim]');
  if(tl){const k=tl.dataset.togglelim,i=S.limits.indexOf(k);
    i>=0?S.limits.splice(i,1):S.limits.push(k);save();render();return}
  if(t.closest('[data-editlim]')){tab='limits';render();return}
  if(t.closest('[data-limdone]')){tab='vault';toast('Saved');render();return}
  if(t.closest('[data-editeq]')){tab='eqedit';render();return}
  const te=t.closest('[data-toggleeq]');
  if(te){const k=te.dataset.toggleeq,i=S.eq.indexOf(k);
    i>=0?S.eq.splice(i,1):S.eq.push(k);save();render();return}
  if(t.closest('[data-eqdone]')){tab='vault';save();toast('Kit updated');render();return}
  if(t.closest('[data-reset]')){
    if(!confirm('Wipe your hunter and start over? This cannot be undone.'))return;
    S=fresh();
    ob={step:0,name:'',exp:null,goal:null,eq:[],days:null,limits:[],class:'bladebound',weapon:'longsword',palette:'crimson'};
    save();applyLook();render();return}
});

/* ---------------- boot ---------------- */
(async()=>{
  await load();
  if(S.setup&&S.last){
    const n=daysBetween(S.last,today());
    if(n>gapAllowed()){if(S.potions>0)S.potions--;else S.streak=0;save()}
  }
  if(S.sess&&S.sess.d!==today())S.sess=null;      // yesterday's run does not resume
  if(S.dg&&S.dg.d!==today())S.dg=null;
  checkAch();
  render();
  if(S.refund){const g=S.refund;delete S.refund;save();
    setTimeout(()=>toast('Palettes are free now · '+g+' gold refunded'),700)}
  if(S.setup&&!S.tourSeen)setTimeout(startTour,400);
})();

</script>
</body>
</html>
